<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CustomUIV3 · SpaceX Ops</title>
  <style>
    :root {
      /* Ops Console：长时盯屏 — 深炭灰 + 柔对比 + 冷静蓝 */
      --space-black: #0b0e12;
      --spectral: #c9d0dc;
      --muted: #8b93a7;
      --ghost-surface: rgba(201, 208, 220, 0.06);
      --ghost-border: rgba(201, 208, 220, 0.16);
      --ghost-border-strong: rgba(201, 208, 220, 0.28);
      --panel-border: #2a3140;
      --overlay: rgba(11, 14, 18, 0.55);
      --hud-panel: rgba(14, 18, 26, 0.88);
      --hud-panel-hover: rgba(91, 140, 255, 0.12);
      --accent: #5b8cff;
      --accent-soft: rgba(91, 140, 255, 0.18);
      --ok: #3ddc97;
      --warn: #e0b84a;
      --bad: #e85a5c;
      --progress-track: rgba(201, 208, 220, 0.14);
      --progress-fill: #5b8cff;
      /* 系统字体 + 统一字号阶梯 */
      --font: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --font-mono: "Cascadia Mono", "Consolas", "Segoe UI", monospace;
      --fs-xs: 12px;
      --fs-sm: 13px;
      --fs-md: 14px;
      --fs-lg: 15px;
      --fs-xl: 16px;
      --fs-brand: 17px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--space-black);
      color: var(--spectral);
      font-family: var(--font);
      font-size: var(--fs-sm);
      font-weight: 400;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font-family: inherit; letter-spacing: 0; }
    button { cursor: pointer; }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 640px;
      background: var(--space-black);
      overflow: hidden;
    }

    .app.RealTimeDetectionV3 {
      flex-direction: column;
    }

    .app.RealTimeDetectionV3 #SpxStage {
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Header (stage overlay) ── */
    .header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      max-height: 64px;
      padding: 8px 12px;
      background: rgba(14, 18, 26, 0.92);
      border-bottom: 1px solid var(--panel-border);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      pointer-events: auto;
    }

    .minimal-mode #SpxHeaderBar.header {
      background: transparent;
      border-bottom-color: rgba(201, 208, 220, 0.1);
      min-height: 36px;
      max-height: 44px;
      padding: 4px 8px;
      gap: 6px;
    }

    .minimal-mode #SpxHeaderBar .logo { font-size: 12px; }
    .minimal-mode #SpxHeaderBar .mono { font-size: 11px; }
    .minimal-mode #SpxHeaderBar .lang-select { display: none; }
    .minimal-mode #SpxHeaderBar .device-chip {
      max-height: 28px;
      padding: 4px 8px;
      background: rgba(201, 208, 220, 0.04);
    }
    .minimal-mode #SpxHeaderBar .ghost-btn {
      padding: 2px 8px;
      min-height: 28px;
      font-size: 12px;
    }
    .minimal-mode #SpxHeaderBar .header-right .ghost-btn:nth-child(n+2):nth-child(-n+4) { display: none; }

    .header-left,
    .header-center,
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .header-left { gap: 12px; }
    .header-center { justify-content: center; flex-wrap: wrap; }
    .header-right { justify-content: flex-end; flex-wrap: wrap; }

    .logo {
      font-family: var(--font);
      font-size: var(--fs-brand);
      font-weight: 700;
      letter-spacing: 0;
      color: var(--spectral);
    }

    .mono {
      font-family: var(--font-mono);
      font-size: var(--fs-sm);
      letter-spacing: 0;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .device-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px 6px 10px;
      background: var(--ghost-surface);
      border: 1px solid var(--ghost-border);
      border-radius: 4px;
      transition: background 160ms ease;
      max-width: 220px;
    }

    .device-chip:hover { background: rgba(201, 208, 220, 0.16); }

    .device-chip .value {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(201, 208, 220, 0.35);
      background: #6b6b75;
      flex-shrink: 0;
    }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--bad); }

    .label {
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      color: var(--muted);
    }

    .value {
      font-family: var(--font-mono);
      font-size: var(--fs-md);
      font-weight: 600;
      letter-spacing: 0;
      color: var(--spectral);
      font-variant-numeric: tabular-nums;
    }

    .lang-select,
    .ghost-btn,
    .run-btn {
      background: var(--ghost-surface);
      color: var(--spectral);
      border: 1px solid var(--ghost-border);
      border-radius: 8px;
      padding: 8px 16px;
      font-family: var(--font);
      font-size: var(--fs-sm);
      font-weight: 600;
      letter-spacing: 0;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .lang-select {
      border-radius: 4px;
      min-width: 120px;
      min-height: 36px;
      appearance: none;
      padding-right: 28px;
      background-image: linear-gradient(45deg, transparent 50%, var(--spectral) 50%),
        linear-gradient(135deg, var(--spectral) 50%, transparent 50%);
      background-position: calc(100% - 14px) 55%, calc(100% - 10px) 55%;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
    }

    .ghost-btn:hover,
    .lang-select:hover { background-color: rgba(201, 208, 220, 0.16); }

    .ghost-btn:active { background-color: rgba(201, 208, 220, 0.22); }

    /* ── Stage ── */
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: var(--space-black);
    }

    .fabric {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(11,14,18,0.45) 0%, transparent 18%, transparent 55%, rgba(11,14,18,0.58) 100%),
        repeating-linear-gradient(
          90deg,
          #161a22 0px,
          #161a22 18px,
          #12161c 18px,
          #12161c 36px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(201, 208, 220, 0.03) 0px,
          rgba(201, 208, 220, 0.03) 1px,
          transparent 1px,
          transparent 28px
        );
      background-size: auto, 36px 100%, 100% 28px;
      animation: fabric-scroll 18s linear infinite;
    }

    .fabric.paused { animation-play-state: paused; }
    .fabric.vf-no-image {
      background: rgba(11, 14, 18, 0.88);
      animation-play-state: paused;
    }
    .fabric.vf-fit-height {
      background-size: auto, 36px 100%, 100% 28px;
      background-position: 0 0, 50% 0, 0 0;
    }

    .fabric-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .fabric-label-line {
      border-top: 2px solid rgba(61, 220, 151, 0.85);
      top: 42%;
      bottom: auto;
      height: 0;
      opacity: 0.9;
    }
    .fabric-cloth-edge::before,
    .fabric-cloth-edge::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(255, 77, 79, 0.75);
    }
    .fabric-cloth-edge::before { left: 18%; }
    .fabric-cloth-edge::after { right: 18%; }
    .fabric-grid {
      background:
        repeating-linear-gradient(90deg, rgba(201,208,220,0.08) 0 1px, transparent 1px 48px),
        repeating-linear-gradient(0deg, rgba(201,208,220,0.08) 0 1px, transparent 1px 48px);
      opacity: 0.55;
    }
    .fabric-frame-border {
      box-shadow: inset 0 0 0 2px rgba(91, 140, 255, 0.45), inset 0 0 0 6px rgba(0, 0, 0, 0.2);
    }

    #stageMarks, #stageDetectionResults {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }
    #stageDetectionResults .detection-box {
      position: absolute;
      border: 1px solid rgba(64, 169, 255, 0.65);
      background: rgba(64, 169, 255, 0.08);
      transform: translate(-50%, -50%);
    }
    .defect-mark .defect-info {
      position: absolute;
      left: 100%;
      top: -2px;
      margin-left: 4px;
      padding: 1px 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--spectral);
      white-space: nowrap;
      background: rgba(14, 18, 26, 0.82);
      border: 1px solid var(--ghost-border);
      border-radius: 3px;
    }

    @keyframes fabric-scroll {
      from { background-position: 0 0, 0 0, 0 0; }
      to { background-position: 0 0, 0 0, 0 560px; }
    }

    .fabric-placeholder {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 2px;
      text-transform: none;
      color: rgba(201, 208, 220, 0.35);
      font-size: 14px;
      pointer-events: none;
    }

  #stageMarks {
    pointer-events: none;
  }
  #stageMarks .defect-mark {
    pointer-events: auto;
  }

    .defect-mark {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 1px solid rgba(232, 90, 92, 0.9);
      background: rgba(232, 90, 92, 0.25);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
      /* 长时盯屏：疵点标记不做无限缩放闪烁 */
    }

    .defect-mark.selected {
      border-color: var(--accent);
      background: rgba(91, 140, 255, 0.28);
      box-shadow: 0 0 0 1px rgba(91, 140, 255, 0.35);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.92; }
    }

    .hud-panel {
      position: absolute;
      left: 0;
      top: 0;
      width: 240px;
      height: 240px;
      background: var(--hud-panel);
      border: 1px solid var(--panel-border);
      border-radius: 5px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10;
      overflow: hidden;
      pointer-events: auto;
    }

    .hud-panel.map { /* x/y/w/h via layoutStageOverlays */ }
    .hud-panel.list { /* x/y/w/h via layoutStageOverlays */ }

    .minimal-mode #SpxDefectMapHud.compact {
      background: rgba(8, 10, 14, 0.35);
      border-color: rgba(201, 208, 220, 0.16);
      padding: 4px 2px;
    }
    .minimal-mode #SpxDefectMapHud.compact .label,
    .minimal-mode #SpxDefectMapHud.compact #mapMeta,
    .minimal-mode #SpxDefectMapHud.compact .map-canvas {
      opacity: 0;
      height: 0;
      margin: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .minimal-mode #SpxDefectListHud.compact {
      background: rgba(10, 12, 18, 0.72);
      border-color: rgba(201, 208, 220, 0.28);
    }
    .minimal-mode #SpxDefectListHud.compact .list-actions .ghost-btn {
      min-width: 28px;
      max-width: 28px;
      padding: 0;
      font-size: 0;
    }
    .minimal-mode #SpxDefectListHud.compact .list-actions .ghost-btn::after {
      font-size: 11px;
      content: "+";
    }
    .minimal-mode #SpxDefectListHud.compact .list-actions #btnDefectEdit::after { content: "✎"; }

    .hud-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .list-actions {
      display: flex;
      gap: 6px;
    }

    .list-actions .ghost-btn {
      flex: 1;
      padding: 6px 10px;
      border-radius: 4px;
      min-height: 32px;
      font-size: 12px;
      letter-spacing: 0;
    }

    .map-canvas {
      flex: 1;
      min-height: 120px;
      margin-top: 4px;
      border: 1px solid rgba(201, 208, 220, 0.18);
      background: rgba(0, 0, 0, 0.12);
      position: relative;
      overflow: hidden;
    }

    .map-point {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--bad);
      border: 1px solid rgba(201, 208, 220, 0.5);
      transform: translate(-50%, -50%);
    }

    .map-point.selected { background: var(--warn); }

    .defect-list {
      list-style: none;
      flex: 1;
      overflow: auto;
      margin-top: 4px;
    }

    .defect-list li {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(201, 208, 220, 0.08);
      letter-spacing: 0;
      cursor: pointer;
      transition: background 140ms ease;
    }

    .defect-list li:hover,
    .defect-list li.active { background: var(--hud-panel-hover); }

    .defect-list::-webkit-scrollbar { width: 6px; }
    .defect-list::-webkit-scrollbar-thumb {
      background: rgba(201, 208, 220, 0.22);
      border-radius: 3px;
    }

    /* ── Bottom HUD (stage overlay) ── */
    .bottom {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      align-items: center;
      min-height: 110px;
      max-height: 128px;
      padding: 4px 8px;
      background: rgba(14, 18, 26, 0.92);
      border-top: 1px solid var(--panel-border);
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      pointer-events: auto;
    }

    .minimal-mode #SpxBottomHud.bottom {
      background: transparent;
      border-top-color: rgba(201, 208, 220, 0.1);
      min-height: 75px;
      max-height: 75px;
      gap: 4px;
      padding: 2px 6px;
    }
    .minimal-mode #SpxBottomHud .chip,
    .minimal-mode #SpxBottomHud .meter {
      min-height: 32px;
      padding: 2px 3px;
    }
    .minimal-mode #SpxBottomHud .chip .label,
    .minimal-mode #SpxBottomHud .meter .label { font-size: 10px; }
    .minimal-mode #SpxBottomHud .chip-value,
    .minimal-mode #SpxBottomHud .meter-value { font-size: 12px; }
    .minimal-mode #SpxBottomHud .run-btn,
    .minimal-mode #SpxBottomHud .ghost-btn.act-new,
    .minimal-mode #SpxBottomHud .ghost-btn.act-finish {
      min-height: 34px;
      padding: 4px 12px;
    }
    .minimal-mode #SpxBottomHud .progress-wrap { height: 12px; }

    #SpxViewToggleBar {
      position: absolute;
      z-index: 16;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      height: 42px;
      background: rgba(14, 18, 26, 0.9);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      pointer-events: auto;
    }
    #SpxViewToggleBar.compact {
      background: transparent;
      border-color: rgba(201, 208, 220, 0.12);
    }
    #SpxViewToggleBar .spx-vbtn {
      width: 34px;
      height: 34px;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid rgba(201, 208, 220, 0.14);
      background: rgba(201, 208, 220, 0.05);
      color: rgba(240, 240, 250, 0.88);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    #SpxViewToggleBar.compact .spx-vbtn {
      background: transparent;
      border-color: rgba(201, 208, 220, 0.18);
    }
    #SpxViewToggleBar .spx-vbtn:hover { background: rgba(201, 208, 220, 0.1); }
    #SpxViewToggleBar .spx-vbtn:checked,
    #SpxViewToggleBar .spx-vbtn[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: rgba(91, 140, 255, 0.5);
    }
    #SpxViewToggleBar .spx-vbtn svg { width: 20px; height: 20px; display: block; }
    #SpxViewToggleBar .spx-vsep {
      width: 1px;
      height: 22px;
      background: var(--panel-border);
      flex: 0 0 auto;
      margin: 0 2px;
    }
    #SpxViewToggleBar.compact .spx-vsep { background: rgba(201, 208, 220, 0.18); }

    #SpxFpsHud, #SpxCoordHud {
      position: absolute;
      z-index: 16;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 28px;
      padding: 4px 10px;
      background: rgba(14, 18, 26, 0.85);
      border: 1px solid var(--ghost-border);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      white-space: pre;
    }
    #SpxFpsHud { color: rgba(61, 220, 151, 0.85); justify-content: flex-end; }
    #SpxCoordHud { color: var(--muted); justify-content: flex-start; min-width: 220px; }

    #SpxRunDirectionHud {
      position: absolute;
      z-index: 14;
      width: 48px;
      height: 56px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #SpxRunDirectionHud svg { width: 32px; height: 40px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35)); }
    #SpxRunDirectionHud.forward svg { color: rgba(61, 220, 151, 0.9); }
    #SpxRunDirectionHud.reverse svg { color: rgba(255, 77, 79, 0.9); }
    #SpxRunDirectionHud.dim svg { opacity: 0.55; }
    .minimal-mode #SpxRunDirectionHud { display: none !important; }

    .side-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
      align-self: center;
      min-width: 0;
      height: auto;
      max-height: 100%;
    }

    /* 5 列 × 2 行；列优先：先填最外侧列，再往中间填 */
    .side-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-template-rows: repeat(2, auto);
      grid-auto-flow: column;
      align-content: center;
      gap: 4px;
      width: 100%;
      height: auto;
      min-height: 0;
    }

    .side-col.side-left .side-grid {
      direction: ltr;
    }

    .side-col.side-right .side-grid {
      direction: rtl; /* 最右列为第一列，先填满再往左 */
    }

    .side-col.side-right .chip {
      direction: ltr;
    }

    .chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      box-sizing: border-box;
      min-width: 0;
      width: 100%;
      height: auto;
      min-height: 40px;
      padding: 4px 4px;
      background: var(--ghost-surface);
      border: 1px solid var(--ghost-border);
      border-radius: 4px;
      text-align: center;
      color: inherit;
      font: inherit;
      transition: background 160ms ease;
    }

    .chip:hover { background: rgba(201, 208, 220, 0.16); }

    .chip .label {
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.15;
      text-transform: none;
    }

    .chip .chip-value {
      font-family: var(--font-mono);
      font-size: var(--fs-md);
      font-weight: 600;
      letter-spacing: 0;
      color: var(--spectral);
      word-break: break-all;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .chip.span-2 { grid-row: 1 / -1; grid-column: span 2; }
    .chip.chip-fp {
      min-height: 40px;
      gap: 2px;
    }
    .chip-fp-vals {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
      font-family: var(--font-mono);
      font-size: var(--fs-md) !important;
      font-weight: 600;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .chip-fp-vals .fp-sep {
      color: var(--muted);
      font-weight: 600;
      margin: 0 1px;
    }
    .chip-fp-vals .fp-ok { color: var(--ok); }
    .chip-fp-vals .fp-ng { color: var(--bad); }
    /* 报警芯片：单行紧凑，避免 span-2 双行过高被中间晕影盖住 */
    .chip.alarm-chip {
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      text-align: left;
      padding: 4px 8px;
      min-height: 40px;
      max-height: 40px;
      min-width: 0;
      overflow: hidden;
      grid-column: span 2;
      grid-row: auto;
    }
    .chip.alarm-chip .label {
      flex: 0 0 auto;
      text-align: left;
      transform: none;
      font-size: var(--fs-xs);
      opacity: 0.85;
    }
    .chip.alarm-chip .chip-value {
      flex: 1 1 auto;
      min-width: 0;
      font-family: var(--font);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      word-break: normal;
      line-height: 1.2;
    }

    .progress-wrap {

      background: rgba(224, 184, 74, 0.18);
      color: #E0B84A;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      cursor: pointer;
      touch-action: manipulation;
    }
    .spx-plc-undo:hover:not(:disabled) { background: rgba(224, 184, 74, 0.3); }
    .spx-plc-undo:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .spx-plc-msg {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }
    .spx-plc-msg.ok { color: var(--ok); }
    /* ── PLCTest：unwind 嵌 tuning/plc.html ── */
    .spx-popup-body:has(#popPlcTestFrame),
    .spx-popup-body:has(#popPlcTest) {
      padding: 0;
      overflow: hidden;
      gap: 0;
    }
    .spx-plct-frame-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: #0c0c10;
    }
    .spx-plct-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0c0c10;
    }

    /* ── PLCTest SPX 内嵌备用布局 ── */
    .spx-plctest {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      gap: 4px;
      padding: 6px 8px 4px;
      box-sizing: border-box;
      overflow: hidden;
    }
    .spx-plct-head {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 0 0 auto;
    }
    .spx-plct-tiles {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
    }
    .spx-plct-tile {
      border: 1px solid var(--ghost-border);
      background: var(--ghost-surface);
      border-radius: 4px;
      padding: 2px 6px;
      text-align: center;
      min-width: 0;
      min-height: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .spx-plct-tile.warn {
      border-color: rgba(232, 90, 92, 0.55);
      background: rgba(232, 90, 92, 0.12);
    }
    .spx-plct-tile .cap {
      font-size: 12px;
      color: var(--muted);
      line-height: 14px;
    }
    .spx-plct-tile .tile-body {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 3px;
      min-width: 0;
      width: 100%;
    }
    .spx-plct-tile .val {
      font-size: 15px;
      font-weight: 700;
      color: var(--spectral);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }
    .spx-plct-tile .unit {
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .spx-plct-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .spx-plct-actions-spacer {
      flex: 1 1 12px;
      min-width: 8px;
      display: block;
    }
    .spx-plct-actions .ghost-btn.compact {
      flex: 0 0 auto;
      min-width: 0;
      min-height: 30px;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
    }
    .spx-plct-actions .ghost-btn.compact.tool {
      flex: 0 0 auto;
      min-width: 0;
    }
    .spx-plct-actions .ghost-btn.ok,
    .spx-plct-labelling-actions .ghost-btn.ok,
    .spx-plct-manual-grid .ghost-btn.ok {
      color: var(--ok);
      border-color: rgba(61, 220, 151, 0.45);
    }
    .spx-plct-actions .ghost-btn.danger,
    .spx-plct-manual-grid .ghost-btn.danger {
      color: var(--bad);
      border-color: rgba(232, 90, 92, 0.45);
    }
    /* 双栏：左实时收窄，右侧吃满剩余宽度，避免整体滚动 */
    .spx-plct-body-row {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(168px, 220px) minmax(0, 1fr);
      gap: 8px;
      overflow: hidden;
    }
    .spx-plct-body-row.is-basic {
      grid-template-columns: minmax(168px, 240px) minmax(0, 1fr);
    }
    .spx-plct-col-live {
      width: 100%;
      max-width: 220px;
      min-width: 0;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }
    .spx-plct-col-right {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }
    .spx-plct-col-right.is-basic {
      display: flex;
    }
    .spx-plct-col-right.is-basic > .spx-plct-panel {
      flex: 1;
      min-height: 0;
    }
    .spx-plct-top-pair {
      display: flex;
      gap: 8px;
      flex: 1 1 0;
      min-height: 0;
    }
    .spx-plct-top-pair > .spx-plct-panel {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
    }
    .spx-plctest.is-admin .spx-plct-panel.system {
      flex: 0 1 auto;
      max-height: 48%;
      min-height: 0;
    }
    .spx-plct-top-pair .spx-plct-panel {
      --plct-label-w: 100px;
      --plct-apply-w: 48px;
      --plct-suffix-w: 36px;
    }
    .spx-plct-panel {
      --plct-label-w: 108px;
      --plct-apply-w: 52px;
      --plct-suffix-w: 40px;
      --plct-row-h: 32px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border: 1px solid rgba(201, 208, 220, 0.16);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(201, 208, 220, 0.05), rgba(0, 0, 0, 0.22));
      overflow: hidden;
    }
    .spx-plct-panel.system {
      min-height: 0;
      max-height: none;
    }
    .spx-plct-heading {
      flex: 0 0 auto;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(74, 83, 96, 0.95);
      color: #C9D0DC;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
      border-bottom: 1px solid rgba(201, 208, 220, 0.08);
    }
    .spx-plct-panel-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    /* 系统参数改为上下结构，避免半栏挤叠输入框与「写入」 */
    .spx-plct-panel-body.system-body {
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      gap: 10px;
      padding-top: 10px;
    }
    .spx-plct-system-params {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      min-width: 0;
      width: 100%;
    }
    .spx-plct-system-switches {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 16px;
      min-width: 0;
      width: 100%;
      padding-top: 2px;
      border-top: 1px solid rgba(201, 208, 220, 0.08);
    }
    .spx-plct-form-row {
      display: grid;
      grid-template-columns: var(--plct-label-w) minmax(72px, 1fr);
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: var(--plct-row-h);
      min-width: 0;
    }
    .spx-plct-form-row.param {
      grid-template-columns: var(--plct-label-w) minmax(72px, 1fr) var(--plct-apply-w);
    }
    .spx-plct-form-row.mode,
    .spx-plct-form-row.radio {
      grid-template-columns: var(--plct-label-w) minmax(0, 1fr);
      align-items: start;
    }
    .spx-plct-panel.live {
      --plct-label-w: 72px;
      --plct-row-h: 26px;
      --plct-suffix-w: 32px;
    }
    .spx-plct-panel.live .spx-plct-panel-body {
      overflow: hidden;
      padding: 6px 8px 8px;
      gap: 4px;
      justify-content: space-between;
    }
    .spx-plct-panel.live .spx-plct-form-row {
      gap: 6px;
      grid-template-columns: var(--plct-label-w) minmax(56px, 1fr);
    }
    .spx-plct-panel.live .spx-plct-form-k {
      font-size: 12px;
    }
    .spx-plct-panel.live .spx-plct-unit {
      padding: 0 6px;
    }
    .spx-plct-panel.live .spx-plct-unit .unit-value,
    .spx-plct-panel.live .spx-plct-inp {
      font-size: 12px;
    }
    .spx-plct-panel.live .spx-plct-unit .unit-suffix {
      right: 6px;
      font-size: 12px;
    }
    .spx-plct-col-right .spx-plct-panel-body {
      overflow: hidden;
    }
    .spx-plct-panel.system .spx-plct-panel-body {
      overflow: hidden;
    }
    .spx-plct-panel.param,
    .spx-plct-panel.label {
      --plct-label-w: 108px;
    }
    .spx-plct-panel.system {
      --plct-label-w: 132px;
    }
    .spx-plct-form-k {
      text-align: right;
      font-size: 12px;
      color: rgba(201, 208, 220, 0.78);
      min-height: var(--plct-row-h);
      min-width: 0;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      line-height: 1.2;
      padding-right: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .spx-plct-unit {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: var(--plct-row-h);
      height: var(--plct-row-h);
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(201, 208, 220, 0.18);
      border-radius: 6px;
      padding: 0 8px;
      min-width: 0;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
    .spx-plct-unit:has(.unit-suffix) {
      padding-right: calc(var(--plct-suffix-w) + 4px);
    }
    .spx-plct-unit.readonly {
      background: rgba(201, 208, 220, 0.04);
      pointer-events: none;
    }
    .spx-plct-unit .unit-value,
    .spx-plct-inp {
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      border: none;
      background: transparent;
      color: var(--spectral);
      font: inherit;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      outline: none;
      box-sizing: border-box;
    }
    .spx-plct-inp {
      height: 100%;
      padding: 0;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
    }
    .spx-plct-unit:focus-within {
      border-color: rgba(61, 220, 151, 0.55);
      box-shadow: 0 0 0 2px rgba(61, 220, 151, 0.12);
      background: rgba(61, 220, 151, 0.06);
    }
    .spx-plct-unit .unit-suffix {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: var(--plct-suffix-w);
      text-align: right;
      font-size: 12px;
      color: var(--muted);
      pointer-events: none;
      white-space: nowrap;
      line-height: 1;
    }
    .spx-plct-apply {
      justify-self: stretch;
      min-height: var(--plct-row-h) !important;
      height: var(--plct-row-h) !important;
      min-width: 0 !important;
      width: 100%;
      max-width: none;
      padding: 0 2px !important;
      font-size: 12px !important;
      border-radius: 6px !important;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
    }
    .spx-plct-mode {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      min-height: var(--plct-row-h);
      min-width: 0;
      padding: 0 4px;
    }
    .spx-plct-mode .mode-value {
      min-width: 44px;
      font-size: 13px;
      font-weight: 600;
      color: var(--spectral);
    }
    .spx-plct-switch-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: var(--plct-row-h);
      min-width: 0;
    }
    .spx-plct-system-switches .spx-plct-switch-row {
      grid-template-columns: minmax(0, 1fr) 48px;
    }
    .spx-plct-system-switches .spx-plct-form-k {
      justify-content: flex-end;
    }
    .spx-plct-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex: 0 0 44px;
      cursor: pointer;
      justify-self: start;
      overflow: hidden;
    }
    .spx-plct-switch input {
      opacity: 0;
      width: 1px;
      height: 1px;
      margin: 0;
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .spx-plct-slider {
      position: absolute;
      inset: 0;
      background: rgba(201, 208, 220, 0.22);
      border-radius: 12px;
      transition: background 0.2s;
      pointer-events: none;
    }
    .spx-plct-slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #C9D0DC;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .spx-plct-switch input:checked + .spx-plct-slider {
      background: rgba(61, 220, 151, 0.55);
    }
    .spx-plct-switch input:checked + .spx-plct-slider::before {
      transform: translateX(20px);
    }
    .spx-plct-radio {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      min-height: var(--plct-row-h);
      min-width: 0;
      padding: 0 2px;
    }
    .spx-plct-radio label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--spectral);
      min-height: 28px;
      white-space: nowrap;
    }
    .spx-plct-radio input {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      accent-color: #3ddc97;
    }
    .spx-plct-labelling-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
      width: 100%;
      padding-left: calc(var(--plct-label-w) + 8px);
      box-sizing: border-box;
    }
    .spx-plct-labelling-actions .ghost-btn {
      flex: 1;
      min-height: 34px;
      border-radius: 8px;
      font-size: 12px;
    }
    .spx-plct-h {
      font-size: 12px;
      letter-spacing: 0;
      text-transform: none;
      color: rgba(201, 208, 220, 0.55);
      flex: 0 0 auto;
      min-height: 20px;
      display: flex;
      align-items: center;
    }
    .spx-plct-check {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--spectral);
      cursor: pointer;
      user-select: none;
      min-height: 36px;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid transparent;
    }
    .spx-plct-check:active { background: rgba(201, 208, 220, 0.08); }
    .spx-plct-check input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      accent-color: #3ddc97;
    }
    .spx-plct-msg {
      flex: 0 0 auto;
      font-size: 12px;
      min-height: 1em;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 2px;
    }
    .spx-plct-msg.ok { color: var(--ok); }
    .spx-plct-col-live > .spx-plct-panel {
      flex: 1;
      width: 100%;
    }

    /* IO / 手动二级弹窗 — SPX 风格；IO 铺满 100% 防文字挤压 */
    .spx-plct-sub {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      box-sizing: border-box;
    }
    .spx-plct-sub.io {
      padding: 0;
      align-items: stretch;
      justify-content: stretch;
    }
    .spx-plct-sub[hidden] { display: none !important; }
    .spx-plct-sub-mask {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .spx-plct-sub.io .spx-plct-sub-mask {
      background: rgba(0, 0, 0, 0.88);
    }
    .spx-plct-sub-card {
      position: relative;
      z-index: 1;
      width: min(760px, 96%);
      max-height: calc(100% - 20px);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(201, 208, 220, 0.22);
      border-radius: 12px;
      background:
        radial-gradient(120% 60% at 0% 0%, rgba(201, 208, 220, 0.08), transparent 50%),
        rgba(12, 12, 16, 0.98);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      box-sizing: border-box;
    }
    .spx-plct-sub-card.io {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      border-radius: 0;
      border: none;
      box-shadow: none;
      background: #0c0c10;
    }
    .spx-plct-sub-card.manual {
      width: min(760px, 94%);
      max-height: min(660px, 94%);
    }
    .spx-plct-sub-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background: rgba(74, 83, 96, 0.95);
      color: #C9D0DC;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
      flex: 0 0 auto;
      border-bottom: 1px solid rgba(201, 208, 220, 0.1);
    }
    .spx-plct-sub-card.io .spx-plct-sub-head {
      height: 44px;
      padding: 0 14px;
      box-sizing: border-box;
    }
    .spx-plct-sub-head .ghost-btn.compact {
      min-width: 36px;
      min-height: 36px;
      font-size: 18px;
      padding: 0;
      color: #C9D0DC;
      border-radius: 10px;
      border-color: rgba(201, 208, 220, 0.28);
      background: rgba(0, 0, 0, 0.18);
    }
    .spx-plct-sub-body {
      padding: 14px 16px 16px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      flex: 1 1 auto;
    }
    .spx-plct-sub-body.io {
      padding: 0;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: #0c0c10;
    }
    .spx-plct-sub-body.io iframe {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: none;
      background: #0c0c10;
      display: block;
    }
    .spx-plct-sub-body > .spx-plct-check {
      align-self: stretch;
      border: 1px solid rgba(201, 208, 220, 0.14);
      background: rgba(201, 208, 220, 0.05);
      padding: 8px 12px;
      min-height: 44px;
      font-weight: 600;
    }
    .spx-plct-manual-hint {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      min-height: 1.2em;
      padding: 0 2px;
    }
    .spx-plct-manual-hint.ok { color: var(--ok); }
    .spx-plct-manual-ops {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      transition: opacity 0.15s ease;
    }
    .spx-plct-manual-ops.is-disabled {
      opacity: 0.42;
      filter: grayscale(0.25);
      pointer-events: none;
      user-select: none;
    }
    .spx-plct-manual-ops.is-disabled .ghost-btn {
      cursor: not-allowed;
    }
    .spx-plct-manual-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: stretch;
    }
    .spx-plct-manual-group {
      border: 1px solid rgba(201, 208, 220, 0.14);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.22);
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }
    .spx-plct-manual-checks {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .spx-plct-manual-checks .spx-plct-check {
      min-height: 34px;
      padding: 2px 6px;
    }
    .spx-plct-manual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex: 1;
      align-content: start;
    }
    .spx-plct-manual-grid .ghost-btn {
      min-height: 42px;
      border-radius: 10px;
      font-size: 13px;

    .spx-aided-ops { display: flex; gap: 6px; }
    .spx-aided-ops .mini-btn { flex: 1; height: 30px; }
    .spx-aided-side {

    .spx-aided-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: auto; }

    /* ── artifical_edit_defect：左地图 / 中列表 / 右信息 ── */
    .spx-edit {
      position: relative;
      display: grid;
      grid-template-columns: minmax(160px, 2fr) minmax(220px, 3fr) minmax(240px, 2fr);
      height: 100%;
      min-height: 0;
      gap: 8px;
      padding: 8px;
    }
    .spx-edit-map {
      position: relative;
      min-width: 0;
      min-height: 0;
      border: 1px solid rgba(201, 208, 220, 0.18);
      border-radius: 4px;
      background: #0c0c10;
      overflow: hidden;
    }
    .spx-edit-map canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .spx-edit-map-hint {
      position: absolute;
      left: 8px;
      top: 8px;
      padding: 4px 8px;
      border-radius: 3px;
      background: rgba(0, 0, 0, 0.55);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0;
      pointer-events: none;
    }
    .spx-edit-list {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 6px;
      border: 1px solid rgba(201, 208, 220, 0.14);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.28);
    }
    .spx-edit-group {
      margin-bottom: 8px;
      padding: 6px;
      border: 1px solid rgba(201, 208, 220, 0.16);
      border-radius: 4px;
      background: rgba(201, 208, 220, 0.04);
    }
    .spx-edit-group.selected {
      border-color: rgba(224, 184, 74, 0.45);
      background: rgba(224, 184, 74, 0.08);
    }
    .spx-edit-group-title {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0;
    }
    .spx-edit-thumbs {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .spx-edit-thumb {
      flex: 0 0 auto;
      width: 72px;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid rgba(201, 208, 220, 0.22);
      background: #121218;
      color: var(--spectral);
      font: inherit;

      text-align: left;
    }
    .spx-edit-thumb.selected {
      border-color: #910905;
      box-shadow: 0 0 0 1px #910905;
    }
    .spx-edit-thumb-img {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 56px;
      margin-bottom: 4px;
      border-radius: 3px;
      background:
        linear-gradient(135deg, rgba(201,208,220,0.08), transparent 55%),
        #15151c;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0;
      text-transform: none;
    }
    .spx-edit-thumb-lab {
      display: block;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spx-edit-info {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(201, 208, 220, 0.14);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.28);
      overflow: auto;
    }
    .spx-edit-preview {
      aspect-ratio: 1 / 1;
      max-height: 220px;
      margin: 0 auto;
      width: min(100%, 220px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(201, 208, 220, 0.18);
      border-radius: 4px;
      background: #15151c;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0;
      text-transform: none;
    }
    .spx-edit-form {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 10px;
      align-items: center;
      font-size: 12px;
    }
    .spx-edit-form label { color: var(--muted); white-space: nowrap; }
    .spx-edit-form input,
    .spx-edit-form select,
    .spx-edit-form textarea {
      width: 100%;
      min-height: 32px;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(201, 208, 220, 0.22);
      background: rgba(201, 208, 220, 0.06);
      color: var(--spectral);
      font: inherit;
    }
    .spx-edit-form textarea { resize: vertical; min-height: 48px; }
    .spx-edit-desc-lab { align-self: start; padding-top: 6px; }
    .spx-edit-actions { margin-top: auto; }

    .spx-art {
      position: relative;
      display: grid;
      grid-template-columns: 1fr minmax(260px, 320px);
      grid-template-rows: 1fr auto;
      height: 100%;
      min-height: 0;
    }
    .spx-art-left {
      grid-row: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid rgba(201, 208, 220, 0.14);
    }
    .spx-art-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(201, 208, 220, 0.14);
      background: rgba(0, 0, 0, 0.35);
    }
    .spx-art-sep {
      width: 1px;
      height: 22px;
      background: rgba(201, 208, 220, 0.2);
      margin: 0 4px;
    }
    .spx-art-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #0c0c10;
    }
    .spx-art-stage canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
    .spx-art-hint {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(201, 208, 220, 0.22);
      border-radius: 4px;
      color: var(--spectral);
      font-size: 12px;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .spx-art-right {
      grid-row: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      padding: 10px 12px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.28);
    }
    .spx-art-thumb {
      position: relative;
      height: 72px;
      border: 1px solid rgba(201, 208, 220, 0.18);
      border-radius: 4px;
      background: #15151c;
      overflow: hidden;
    }
    .spx-art-thumb-vp {
      position: absolute;
      border: 1px solid var(--warn);
      background: rgba(224, 184, 74, 0.15);
      min-width: 18%;
      min-height: 16%;
    }
    .spx-art-table-wrap {
      flex: 1;
      min-height: 80px;
      overflow: auto;
      border: 1px solid rgba(201, 208, 220, 0.12);
      border-radius: 4px;
    }
    .spx-art-table-wrap tr.active { background: rgba(224, 184, 74, 0.12); }
    .spx-art-preview { display: flex; flex-direction: column; gap: 6px; }
    .spx-art-preview .spx-defect-thumb { aspect-ratio: 16 / 7; margin: 0; }
    .spx-art-label-row { display: flex; gap: 8px; }
    .spx-art-label-row .ghost-btn { flex: 1; min-height: 36px; }
    .spx-art-ops { display: flex; gap: 4px; white-space: nowrap; }
    .spx-art-imgtype { display: flex; gap: 4px; }
    .spx-art-loading,
    .spx-art-saving {
      position: absolute; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background: rgba(8, 8, 10, 0.72); color: var(--spectral); font-size: 14px;
    }
    .spx-art-loading[hidden], .spx-art-saving[hidden] { display: none !important; }
    .spx-art-spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(201, 208, 220, 0.15); border-top-color: var(--warn);
      animation: spx-art-spin 0.9s linear infinite;
    }
    .spx-art-progress {
      width: min(280px, 60%); height: 4px; border-radius: 2px; overflow: hidden;
      background: rgba(201, 208, 220, 0.12);
    }
    .spx-art-progress::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: var(--warn); animation: spx-art-bar 1.2s ease-in-out infinite;
    }
    @keyframes spx-art-spin { to { transform: rotate(360deg); } }
    @keyframes spx-art-bar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(280%); }
    }
    .spx-art-modal {
      position: absolute; inset: 0; z-index: 30;
      display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55); padding: 16px;
    }
    .spx-art-modal.active { display: flex; }
    .spx-art-modal-card {
      width: min(420px, 100%); max-height: 90%;
      display: flex; flex-direction: column; gap: 12px;
      padding: 14px 16px; border-radius: 6px;
      border: 1px solid rgba(201, 208, 220, 0.28);
      background: rgba(18, 18, 24, 0.96); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .spx-art-modal-card.wide { width: min(720px, 100%); }
    .spx-art-modal-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 15px; letter-spacing: 0; color: var(--spectral);
    }
    .spx-art-modal-x {
      width: 32px; height: 32px; border: none; border-radius: 4px;
      background: transparent; color: var(--spectral); font-size: 22px; cursor: pointer;
    }
    .spx-art-modal-x:hover { background: rgba(201, 208, 220, 0.12); }
    .spx-art-modal-msg { color: var(--muted); line-height: 1.5; font-size: 13px; }
    .spx-art-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .spx-art-filter { display: flex; flex-wrap: wrap; gap: 6px; }
    .spx-art-chip {
      padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(201, 208, 220, 0.28);
      background: rgba(201, 208, 220, 0.06); color: var(--spectral); font: inherit; font-size: 12px; cursor: pointer;
    }
    .spx-art-chip.active, .spx-art-chip:hover {
      background: rgba(224, 184, 74, 0.18); border-color: rgba(224, 184, 74, 0.55);
    }
    .spx-art-type-wrap { overflow: auto; min-height: 0; max-height: min(52vh, 420px); display: flex; flex-direction: column; gap: 12px; }
    .spx-art-type-group-title {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
      color: var(--muted); font-size: 12px; letter-spacing: 0; text-transform: none;
    }
    .spx-art-type-count {
      padding: 1px 6px; border-radius: 3px; border: 1px solid rgba(201, 208, 220, 0.2); font-size: 12px;
    }
    .spx-art-type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px;
    }
    .spx-art-type {
      display: flex; flex-direction: column; gap: 6px; padding: 8px;
      border-radius: 4px; border: 1px solid rgba(201, 208, 220, 0.22);
      background: rgba(201, 208, 220, 0.06); color: var(--spectral); font: inherit; text-align: left; cursor: pointer;
    }
    .spx-art-type:hover { background: rgba(201, 208, 220, 0.12); }
    .spx-art-type.selected { border-color: rgba(224, 184, 74, 0.7); background: rgba(224, 184, 74, 0.12); }
    .spx-art-type-thumb {
      height: 56px; border-radius: 3px; background: #15151c;
      border: 1px solid rgba(201, 208, 220, 0.12);
    }
    .spx-art-type-thumb.is-empty {
      background:
        linear-gradient(135deg, rgba(201,208,220,0.08), transparent 55%),
        repeating-linear-gradient(45deg, #15151c 0 8px, #121218 8px 16px);
    }
    .spx-art-type-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .spx-art-type-code { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .spx-art-type-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .spx-art-status {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 12px;
      border-top: 1px solid rgba(201, 208, 220, 0.14);
      background: rgba(0, 0, 0, 0.45);
      color: var(--muted);
      font-size: 12px;
    }
    .spx-art-badge {
      padding: 2px 8px;
      border-radius: 3px;
      background: rgba(74, 83, 96, 0.85);
      color: #f5f5f5;
      font-size: 12px;
      letter-spacing: 0;
    }

    .spx-width {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .spx-width-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(201, 208, 220, 0.14);
      color: var(--muted);
      font-size: 13px;
      background: rgba(0, 0, 0, 0.35);
    }
    .spx-width-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #0c0c10;
    }
    .spx-width-stage canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
    .spx-width-float {
      display: none;
      position: absolute;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
      pointer-events: none;
    }
    .spx-width-float.show { display: block; }
    .spx-width-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 14px;
      border-top: 1px solid rgba(201, 208, 220, 0.14);
      background: rgba(0, 0, 0, 0.4);
    }
    .spx-width-metric {
      display: flex;
      flex-direction: column;
      min-width: 88px;
    }
    .spx-width-metric .k { font-size: 12px; color: var(--muted); letter-spacing: 0; text-transform: none; }
    .spx-width-metric .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .spx-width-metric.left .v { color: #E85A5C; }
    .spx-width-metric.right .v { color: #4c9aff; }
    .spx-width-metric.muted .v { color: var(--muted); font-size: 18px; }
    .spx-width-bar .spacer { flex: 1; }
    .spx-width-bar .run-btn:disabled { opacity: 0.4; cursor: default; }
    .spx-width-loading {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      color: #fff; background: rgba(0,0,0,0.4); white-space: pre-wrap; text-align: center; padding: 24px;
      pointer-events: none;
    }
    .spx-width-loading.active { display: flex; }
    .spx-width-manual {
      display: none; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
    }
    .spx-width-manual.show { display: flex; }
    .spx-width-manual input {
      width: 110px; height: 36px; padding: 0 10px; border-radius: 4px;
      border: 1px solid rgba(201,208,220,0.28); background: rgba(0,0,0,0.45);
      color: var(--spectral); font-size: 18px; font-weight: 700;
    }
    .spx-width-pad-data {
      font-family: Consolas, "Courier New", monospace; font-size: 12px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42%;
    }
    .spx-art-badge.active { background: #0f938f; }
    .spx-art-badge.warn { background: #a3100d; }

    /* ── DetectionRecords ── */
    .spx-records {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      gap: 10px;
      padding: 12px 14px 10px;
    }
    .spx-records-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex: 0 0 auto;
    }
    .spx-records-tabs,
    .spx-records-query {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .spx-records-query select,
    .spx-records-query input[type="text"],
    .spx-records-query input[type="date"],
    .spx-records-pager input[type="number"] {
      background: rgba(201, 208, 220, 0.06);
      color: var(--spectral);
      border: 1px solid rgba(201, 208, 220, 0.22);
      border-radius: 4px;
      padding: 6px 8px;
      font: inherit;
      min-height: 34px;
      color-scheme: dark;
    }
    .spx-records-query select {
      min-width: 128px;
      max-width: 168px;
      padding: 6px 28px 6px 10px;
      appearance: none;
      -webkit-appearance: none;
      background-color: #12151C;
      background-image: linear-gradient(45deg, transparent 50%, var(--spectral) 50%),
        linear-gradient(135deg, var(--spectral) 50%, transparent 50%);
      background-position: calc(100% - 14px) 55%, calc(100% - 10px) 55%;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
      cursor: pointer;
    }
    .spx-records-query select:hover {
      background-color: #1c1c22;
      border-color: rgba(201, 208, 220, 0.38);
    }
    .spx-records-query select:focus {
      outline: none;
      border-color: rgba(201, 208, 220, 0.55);
    }
    .spx-records-query select option {
      background: #12151C;
      color: #C9D0DC;
    }
    .spx-records-query select option:checked,
    .spx-records-query select option:hover {
      background: #2a2a34;
      color: #C9D0DC;
    }
    .spx-records-query input[type="text"] { width: 140px; }
    .spx-records-query input[type="date"] { width: 148px; }
    .spx-records-table-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid rgba(201, 208, 220, 0.14);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.22);
    }
    .spx-records-table {
      min-width: 720px;
      width: max-content;
      table-layout: fixed;
      font-size: 12px;
      border-collapse: separate;
      border-spacing: 0;
    }
    .spx-records-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 8px 8px;
      background: rgba(18, 18, 22, 0.96);
    }
    .spx-records-table td {
      white-space: nowrap;
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 6px 8px;
      max-width: 220px;
    }
    .spx-records-table .col-status { width: 88px; min-width: 88px; max-width: 96px; }
    .spx-records-table .col-report { width: 96px; min-width: 96px; max-width: 110px; }

    function calcFourPoints(defects, lengthM, widthCm) {
      const counts = { I: 0, II: 0, III: 0, IV: 0 };
      const rows = [];
      let total = 0;
      (defects || []).forEach((d) => {
        const g = d.grade || "I";
        const pts = GRADE_POINTS[g] || 0;
        if (counts[g] != null) counts[g] += 1;
        total += pts;
        rows.push({ id: d.id, title: d.title, grade: g, points: pts, y: d.y });
      });
      const lengthYd = Math.max(0.01, lengthM * 1.0936133);
      const widthYd = Math.max(0.01, (widthCm / 100) * 1.0936133);
      const areaSqYd = lengthYd * widthYd;
      const per100Sq = (total / areaSqYd) * 100;
      const per100 = (total / lengthYd) * 100;
      const threshold = 40;
      return {
        total,
        per100Sq,
        per100,
        counts,
        rows,
        threshold,
        isNg: per100Sq > threshold,
      };
    }
