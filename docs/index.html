        map.style.width = `${mapW}px`;
        map.style.height = `${hudH}px`;
        map.style.display = state.viewFlags.showMap ? "" : "none";
      }
      if (list) {
        list.style.left = `${sw - margin - listW}px`;
        list.style.top = `${top}px`;
        list.style.width = `${listW}px`;
        list.style.height = `${hudH}px`;
        list.style.display = state.viewFlags.showList ? "" : "none";
      }

      let toggleX = 0;
      let toggleBarW = 0;
      if (toggles) {
        toggleBarW = Math.max(toggles.scrollWidth || toggles.offsetWidth, 280);
        toggleX = Math.floor((sw - toggleBarW) / 2);
        const toggleY = sh - bottomH - toggleH - toggleGap;
        toggles.style.left = `${toggleX}px`;
        toggles.style.top = `${toggleY}px`;
        toggles.style.width = `${toggleBarW}px`;
        toggles.style.height = `${toggleH}px`;

        const chipH = Math.max(28, toggleH);
        const chipGap = 12;
        const mapRight = map && state.viewFlags.showMap ? margin + mapW : margin;

        if (fpsHud) {
          const right = toggleX - chipGap;
          const left = mapRight + chipGap;
          const w = spxClamp(right - left, 132, 200);
          const x = right - w;
          fpsHud.style.left = `${x}px`;
          fpsHud.style.top = `${toggleY + (toggleH - chipH) / 2}px`;
          fpsHud.style.width = `${w}px`;
          fpsHud.style.height = `${chipH}px`;
        }

        if (coordHud) {
          const w = Math.max(coordHud.offsetWidth || 220, 220);
          const x = toggleX + toggleBarW + chipGap;
          coordHud.style.left = `${x}px`;
          coordHud.style.top = `${toggleY + (toggleH - chipH) / 2}px`;
          coordHud.style.width = `${w}px`;
          coordHud.style.height = `${chipH}px`;
        }

        if (toast) {
          toast.style.bottom = `${bottomH + 12}px`;
        }
      }

      if (runDir && !state.minimalMode) {
        const rdx = Math.floor((sw - 48) / 2);
        runDir.style.left = `${rdx}px`;
        runDir.style.top = `${headerH + 10}px`;
        runDir.style.display = "";
      } else if (runDir) {
        runDir.style.display = "none";
      }
    }

    function setMinimalMode(on) {
      if (state.minimalMode === on) return;
      state.minimalMode = on;
      const root = $("app");
      const stage = $("SpxStage");
      if (root) root.classList.toggle("minimal-mode", on);
      if (stage) stage.classList.toggle("minimal-mode", on);
      $("SpxViewToggleBar")?.classList.toggle("compact", on);
      $("SpxDefectMapHud")?.classList.toggle("compact", on);
      $("SpxDefectListHud")?.classList.toggle("compact", on);
      const fsBtn = $("spxViewBtnFullscreen");
      if (fsBtn) {
        fsBtn.setAttribute("aria-pressed", on ? "true" : "false");
        fsBtn.classList.toggle("checked", on);
        fsBtn.title = t(on ? "exit_fullscreen" : "fullscreen");
        fsBtn.innerHTML = viewIconSvg("fullscreen", on);
      }
      layoutStageOverlays();
    }

    function applyViewFlags() {
      const f = state.viewFlags;
      $("SpxDefectMapHud") && ($("SpxDefectMapHud").style.display = f.showMap ? "" : "none");
      $("SpxDefectListHud") && ($("SpxDefectListHud").style.display = f.showList ? "" : "none");
      const fab = $("fabric");
      if (fab) {
        fab.classList.toggle("vf-no-image", !f.showImage);
        fab.classList.toggle("vf-fit-height", !!f.fitHeight);
        fab.classList.toggle("paused", !state.running || !f.showImage);
      }
      $("fabricHint").hidden = !f.showImage;
      $("fabricLabelLine").hidden = !f.showLabelLine;
      $("fabricClothEdge").hidden = !f.showClothEdge;
      $("fabricGrid").hidden = !f.showGrid;
      $("fabricFrameBorder").hidden = !f.showFrameBorder;
      const det = $("stageDetectionResults");
      if (det) det.hidden = !f.showDetectionResult;
      document.querySelectorAll("#stageMarks .defect-mark").forEach((el) => {
        const kind = el.dataset.kind || "detected";
        let show = true;
        if (kind === "detected") show = f.showDetected;
        else if (kind === "filtered") show = f.showFiltered;
        el.style.display = show ? "" : "none";
        const info = el.querySelector(".defect-info");
        if (info) info.hidden = !f.showDefectInfo;
      });
      syncViewToggleButtons();
      layoutStageOverlays();
    }

    function syncViewToggleButtons() {
      const bar = $("SpxViewToggleBar");
      if (!bar) return;
      const f = state.viewFlags;
      bar.querySelectorAll("[data-flag]").forEach((btn) => {
        const key = btn.getAttribute("data-flag");
        const on = !!f[key];
        btn.setAttribute("aria-pressed", on ? "true" : "false");
        btn.classList.toggle("checked", on);
        const icon = btn.getAttribute("data-icon");
        if (icon) btn.innerHTML = viewIconSvg(icon, on);
      });
      const fitW = $("spxViewBtnFitWidth");
      const fitH = $("spxViewBtnFitHeight");
      if (fitW) {
        const on = !f.fitHeight;
        fitW.setAttribute("aria-pressed", on ? "true" : "false");
        fitW.classList.toggle("checked", on);
        fitW.innerHTML = viewIconSvg("fitWidth", on);
      }
      if (fitH) {
        const on = !!f.fitHeight;
        fitH.setAttribute("aria-pressed", on ? "true" : "false");
        fitH.classList.toggle("checked", on);
        fitH.innerHTML = viewIconSvg("fitHeight", on);
      }
    }

    function applyShowAllViewFlags() {
      state.viewFlags = {
        ...state.viewFlags,
        showMap: true, showList: true, showImage: true, showLabelLine: true, showFrameBorder: true,
        showClothEdge: true, showDetected: true, showDetectionResult: true, showFiltered: true,
        showDefectInfo: true, showCoordRuler: true, showGrid: true,
      };
      applyViewFlags();
    }

    function applyHideAllViewFlags() {
      state.viewFlags = {
        ...state.viewFlags,
        showMap: false, showList: false, showImage: false, showLabelLine: false, showFrameBorder: false,
        showClothEdge: false, showDetected: false, showDetectionResult: false, showFiltered: false,
        showDefectInfo: false, showCoordRuler: false, showGrid: false,
      };
      applyViewFlags();
    }

    function applyResetViewFlags() {
      state.viewFlags = { ...DEFAULT_VIEW_FLAGS };
      applyViewFlags();
    }

    function buildViewToggleBar() {
      const bar = $("SpxViewToggleBar");
      if (!bar || bar.dataset.built === "1") return;
      bar.dataset.built = "1";
      bar.innerHTML = "";
      VIEW_TOGGLE_SPECS.forEach((spec) => {
        if (spec.kind === "sep") {
          const sep = document.createElement("span");
          sep.className = "spx-vsep";
          sep.setAttribute("aria-hidden", "true");
          bar.appendChild(sep);
          return;
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "spx-vbtn";
        btn.title = t(spec.i18n);
        if (spec.kind === "toggle") {
          btn.id = `spxViewBtn${spec.flag.charAt(0).toUpperCase()}${spec.flag.slice(1)}`;
          btn.setAttribute("data-flag", spec.flag);
          btn.setAttribute("data-icon", spec.icon);
          btn.setAttribute("aria-pressed", state.viewFlags[spec.flag] ? "true" : "false");
          btn.innerHTML = viewIconSvg(spec.icon, state.viewFlags[spec.flag]);
          btn.addEventListener("click", () => {
            state.viewFlags[spec.flag] = !state.viewFlags[spec.flag];
            applyViewFlags();
          });
        } else if (spec.kind === "action") {
          btn.id = `spxViewBtn${spec.key.charAt(0).toUpperCase()}${spec.key.slice(1)}`;
          btn.setAttribute("data-icon", spec.icon);
          btn.innerHTML = viewIconSvg(spec.icon, true);
          btn.addEventListener("click", () => {
            if (spec.key === "showAll") applyShowAllViewFlags();
            else if (spec.key === "hideAll") applyHideAllViewFlags();
            else applyResetViewFlags();
          });
        } else if (spec.kind === "fit") {
          btn.id = spec.key === "fitWidth" ? "spxViewBtnFitWidth" : "spxViewBtnFitHeight";
          btn.setAttribute("data-icon", spec.icon);
          btn.setAttribute("aria-pressed", spec.key === "fitWidth" ? (!state.viewFlags.fitHeight ? "true" : "false") : (state.viewFlags.fitHeight ? "true" : "false"));
          btn.innerHTML = viewIconSvg(spec.icon, spec.key === "fitWidth" ? !state.viewFlags.fitHeight : state.viewFlags.fitHeight);
          btn.addEventListener("click", () => {
            state.viewFlags.fitHeight = spec.key === "fitHeight";
            applyViewFlags();
          });
        } else if (spec.kind === "fullscreen") {
          btn.id = "spxViewBtnFullscreen";
          btn.setAttribute("data-icon", "fullscreen");
          btn.setAttribute("aria-pressed", "false");
          btn.innerHTML = viewIconSvg("fullscreen", false);
          btn.addEventListener("click", () => setMinimalMode(!state.minimalMode));
        }
        bar.appendChild(btn);
      });
    }

    function seedDetectionResults() {
      const layer = $("stageDetectionResults");
      if (!layer || layer.dataset.seeded === "1") return;
      layer.dataset.seeded = "1";
      layer.innerHTML = "";
      [
        { left: "35%", top: "30%", w: 48, h: 36 },
        { left: "62%", top: "55%", w: 40, h: 28 },
      ].forEach((b) => {
        const el = document.createElement("div");
        el.className = "detection-box";
        el.style.left = b.left;
        el.style.top = b.top;
        el.style.width = `${b.w}px`;
        el.style.height = `${b.h}px`;
        layer.appendChild(el);
      });
    }

    function formatCoordHud(pxX, pxY, mmX, mmY) {
      const px = `${String(pxX).padStart(5, " ")}, ${String(pxY).padStart(5, " ")} px`;
      const mm = `${mmX.toFixed(1).padStart(8, " ")}, ${mmY.toFixed(1).padStart(8, " ")} mm`;
      return `${px}  ${mm}`;
    }

    function updateFpsHud() {
      const el = $("SpxFpsHud");
      if (!el) return;
      el.textContent = `显示 ${state.displayFps.toFixed(1).padStart(5, " ")}  入 ${state.inputFps.toFixed(1).padStart(5, " ")}`;
    }

    function tickPreviewFps() {
      const jitter = () => (Math.random() - 0.5) * 1.2;
      state.displayFps = spxClamp(state.displayFps + jitter(), 24, 32);
      state.inputFps = spxClamp(state.inputFps + jitter(), 22, 30);
      updateFpsHud();
    }

    function updateRunDirectionHud() {
      const el = $("SpxRunDirectionHud");
      if (!el) return;
      el.classList.toggle("reverse", !!state.isReversal);
      el.classList.toggle("forward", !state.isReversal);
      el.classList.toggle("dim", !state.running);
      el.title = t(state.isReversal ? "run_dir_reverse" : "run_dir_forward");
      const svg = el.querySelector("svg path");
      if (svg) {
        svg.setAttribute("d", state.isReversal ? "M12 4 L22 20 H14 V26 H10 V20 H2 Z" : "M12 24 L22 8 H14 V2 H10 V8 H2 Z");
      }
    }

    function bindFabricCoordHud() {
      const fabric = $("fabric");
      const coord = $("SpxCoordHud");
      if (!fabric || !coord) return;
      const mmPerPxX = (state.widthCm * 10) / Math.max(fabric.clientWidth, 1);
      const mmPerPxY = 0.35;
      fabric.addEventListener("mousemove", (ev) => {
        const r = fabric.getBoundingClientRect();
        const pxX = Math.round(ev.clientX - r.left);
        const pxY = Math.round(ev.clientY - r.top);
        const mmX = pxX * mmPerPxX;
        const mmY = pxY * mmPerPxY;
        coord.textContent = formatCoordHud(pxX, pxY, mmX, mmY);
        coord.hidden = false;
        layoutStageOverlays();
      });
      fabric.addEventListener("mouseleave", () => {
        coord.textContent = "";
        coord.hidden = true;
      });
    }

    function applyViewToggleI18n() {
      VIEW_TOGGLE_SPECS.forEach((spec) => {
        if (!spec.i18n) return;
        let id = "";
        if (spec.kind === "toggle" && spec.flag) {
          id = `spxViewBtn${spec.flag.charAt(0).toUpperCase()}${spec.flag.slice(1)}`;
        } else if (spec.key) {
          id = `spxViewBtn${spec.key.charAt(0).toUpperCase()}${spec.key.slice(1)}`;
        }
        const btn = id ? $(id) : null;
        if (!btn) return;
        if (spec.kind === "fullscreen") {
          btn.title = t(state.minimalMode ? "exit_fullscreen" : "fullscreen");
        } else {
          btn.title = t(spec.i18n);
        }
      });
    }

    function t(key) {
      return (I18N[state.lang] && I18N[state.lang][key]) || I18N.en[key] || key;
    }

    function showToast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => el.classList.remove("show"), 1200);
    }

    function pad(n) { return String(n).padStart(2, "0"); }

    function tickClock() {
      const d = new Date();
      $("clock").textContent =
        `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}  ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function applyI18n() {
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      $("mapTitle").textContent = t("map");
      $("listTitle").textContent = t("list");
      $("fabricHint").textContent = t("fabric_hint");
      document.querySelectorAll(".header-right .ghost-btn")[0].textContent = t("login");
      document.querySelectorAll(".header-right .ghost-btn")[1].textContent = t("settings");
      document.querySelectorAll(".header-right .ghost-btn")[2].textContent = t("about");
      $("btnExit").textContent = t("exit");
      updateDeviceChips();
      updateRunBtn();
      applyViewToggleI18n();
      updateRunDirectionHud();
      renderDefects();
    }

    function updateDeviceChips() {
      const plc = `${Math.round(state.plcX)} ${Math.round(state.plcY)} ${Math.round(state.plcTy)}`;
      const cam = String(Math.round(state.camFrames));
      const light = `${state.lightAuto ? "AUTO" : "MAN"} ${Math.round(state.lightBrightness)}`;
      const cropL = Number((state.settingsValues && state.settingsValues.DistanceToLeftEdge) || state.cropLeftMm || 20);
      const cropR = Number((state.settingsValues && state.settingsValues.DistanceToRightEdge) || state.cropRightMm || 20);
      const widthSns = `${Number(state.widthCm || 0).toFixed(1)} · ${cropL}/${cropR}`;
      $("plcVal").textContent = plc;
      $("plcVal").title = `x y ty · ${plc}`;
      $("camVal").textContent = cam;
      $("camVal").title = (state.lang === "zh-CN" ? "采集帧数 · " : "Frames · ") + cam;
      $("lightVal").textContent = light;
      $("lightVal").title = (state.lang === "zh-CN"
        ? (state.lightAuto ? "自动调光 · 亮度 " : "手动 · 亮度 ")
        : (state.lightAuto ? "Auto light · " : "Manual · ")) + Math.round(state.lightBrightness);
      const wsLab = $("widthSnsLab");
      const wsVal = $("widthSnsVal");
      if (wsLab) wsLab.textContent = state.lang === "zh-CN" ? "幅宽传感器" : "Width";
      if (wsVal) {
        wsVal.textContent = widthSns;
        const L = state.plc && state.plc.width_sensor_left;
        const R = state.plc && state.plc.width_sensor_right;
        wsVal.title = `W ${Number(state.widthCm || 0).toFixed(1)} · L ${L != null ? Number(L).toFixed(1) : "—"} / R ${R != null ? Number(R).toFixed(1) : "—"} · crop ${cropL}/${cropR}`;
      }
    }

    function updateRunBtn() {
      const btn = $("btnRun");
      btn.classList.toggle("running", state.running);
      btn.textContent = state.running ? t("pause") : t("start");
      const fab = $("fabric");
      if (fab) fab.classList.toggle("paused", !state.running || !state.viewFlags.showImage);
      updateRunDirectionHud();
    }

    /** 主操作按下：透明度脉冲 + busy 固定 hold（对齐 Qt SpxBottomHud） */
    function playActFeedback(el, holdMs) {
      if (!el || el.classList.contains("busy") || el.dataset.actFeedback === "1") return false;
      const hold = Math.max(180, Math.min(Number(holdMs) || 300, 2000));
      const gen = (Number(el.dataset.actFeedbackGen) || 0) + 1;
      el.dataset.actFeedbackGen = String(gen);
      el.dataset.actFeedback = "1";
      el.classList.add("busy");
      window.setTimeout(() => {
        if (el.dataset.actFeedbackGen !== String(gen)) return;
        el.dataset.actFeedback = "0";
        el.classList.remove("busy");
      }, hold);
      return true;
    }

    function openDefectDetail() {
      if (!popupHost) return;
      const listPanel = $("SpxDefectListHud") || document.querySelector(".hud-panel.list");
      if (popupHost.isOpen("defectDetail")) {
        popupHost.refresh(["defectDetail"]);
        if (typeof popupHost._place === "function") {
          popupHost._place("left", listPanel);
        }
      } else {
        popupHost.open("defectDetail", listPanel);
      }
    }

    function renderDefects() {
      $("listMeta").textContent = String(DEFECTS.length);
      $("mapMeta").textContent =
        `${(state.widthCm / 100).toFixed(2)} × ${state.lengthM.toFixed(1)} m  ·  ${DEFECTS.length}`;

      const list = $("defectList");
      list.innerHTML = "";
      DEFECTS.forEach((d) => {
        const li = document.createElement("li");
        li.className = d.id === state.selectedId ? "active" : "";
        const sizeMm = Math.max(Number(d.width) || 0, Number(d.length) || 0);
        li.innerHTML = `${d.title}  ·  ${d.grade}<br>${sizeMm.toFixed(1)} mm  ·  Y ${Number(d.y).toFixed(2)} m`;
        li.addEventListener("click", () => {
          state.selectedId = d.id;
          renderDefects();
          openDefectDetail();
        });
        list.appendChild(li);
      });

      const map = $("mapCanvas");
      map.innerHTML = "";
      DEFECTS.forEach((d) => {
        const p = document.createElement("div");
        p.className = "map-point" + (d.id === state.selectedId ? " selected" : "");
        p.style.left = `${d.x * 100}%`;
        p.style.top = `${(d.y / Math.max(state.lengthM, 40)) * 100}%`;
        p.title = d.title;
        p.addEventListener("click", () => {
          state.selectedId = d.id;
          renderDefects();
          openDefectDetail();
        });
        map.appendChild(p);
      });

      const marks = $("stageMarks");
      marks.innerHTML = "";
      DEFECTS.forEach((d) => {
        const m = document.createElement("div");
        const kind = d.id === 4 ? "filtered" : "detected";
        m.className = "defect-mark" + (d.id === state.selectedId ? " selected" : "");
        m.dataset.kind = kind;
        m.style.left = `${18 + d.x * 64}%`;
        m.style.top = `${22 + (d.y / 40) * 56}%`;
        const info = document.createElement("span");
        info.className = "defect-info";
        info.textContent = `${d.title} · ${d.grade}`;
        info.hidden = !state.viewFlags.showDefectInfo;
        m.appendChild(info);
        if (!state.viewFlags.showDetected && kind === "detected") m.style.display = "none";
        if (!state.viewFlags.showFiltered && kind === "filtered") m.style.display = "none";
        marks.appendChild(m);
      });

      if (popupHost && popupHost.isOpen("defectDetail")) {
        popupHost.refresh(["defectDetail"]);
      }
    }

    function renderMetrics() {
      $("meterLength").textContent = state.lengthM.toFixed(1);
      $("meterWidth").textContent = state.widthCm.toFixed(1);
      const grossEl = $("grossWidth");
      if (grossEl) grossEl.textContent = state.widthCm.toFixed(1);
      const netChip = $("netWidthChip");
      if (netChip) {
        const last = state.netWidth && state.netWidth.last != null ? Number(state.netWidth.last) : 0;
        netChip.textContent = last > 0 ? last.toFixed(1) : "-";
      }
      $("meterSpeed").textContent = state.speed.toFixed(1);
      $("meterColorDiff").textContent = state.colorDiff.toFixed(2);
      $("meterWeight").textContent = state.weightNetKg.toFixed(1);
      $("meterTension").textContent = state.tension.toFixed(1);
      $("unwind").textContent = `${state.unwind.toFixed(0)}%`;
      $("cpu").textContent = `${state.cpu.toFixed(0)}%`;
      $("gpu").textContent = `${state.gpu.toFixed(0)}%`;
      $("records").textContent = `${state.todayM.toFixed(0)} m`;
      $("alarmVal").textContent = String(state.alarm);
      $("alarmDot").className = "dot " + (state.alarm > 0 ? "bad" : "ok");
      const alarmChip = $("alarmChip");
      const alarmMsg = $("alarmMsg");
      const idleMsg = state.lang === "zh-CN" ? "当前无报警" : "No alarms";
      const liveMsg =
        state.alarmMsg ||
        (state.alarmList.length ? state.alarmList.map((a) => a.msg).join(" · ") : idleMsg);
      alarmMsg.textContent = liveMsg;
      alarmChip.classList.toggle("active", state.alarm > 0);
      alarmChip.title = liveMsg;

      const pct = Math.min(100, (state.lengthM / state.targetM) * 100);
      $("progressFill").style.width = `${pct}%`;
      $("progressText").textContent =
        `${state.lengthM.toFixed(1)} / ${state.targetM.toFixed(1)} m`;
      const fp = calcFourPoints(DEFECTS, state.lengthM, state.widthCm);
      const fpPer = $("fpPer100Sq");
      const fpResult = $("fpResult");
      if (fpPer) fpPer.textContent = fp.per100Sq.toFixed(2);
      if (fpResult) {
        fpResult.textContent = fp.isNg ? "NG" : "OK";
        fpResult.classList.toggle("fp-ok", !fp.isNg);
        fpResult.classList.toggle("fp-ng", !!fp.isNg);
      }
      updateDeviceChips();
    }

    function demoTick() {
      if (!state.running) return;
      state.lengthM = Math.min(state.targetM, state.lengthM + state.speed / 3600 * 8);
      state.speed = 40 + Math.sin(Date.now() / 1800) * 4;
      state.widthCm = 150 + Math.sin(Date.now() / 2600) * 1.4;
      state.colorDiff = 0.35 + Math.abs(Math.sin(Date.now() / 2200)) * 0.25;
      state.tension = 30 + Math.sin(Date.now() / 1900) * 4;
      state.plcX = 100 + Math.round((Date.now() / 200) % 40);
      state.plcY = Math.round(state.lengthM * 1000);
      state.plcTy = Math.round(state.targetM * 1000);
      state.camFrames += 2;
      state.lightBrightness = 160 + Math.round(Math.abs(Math.sin(Date.now() / 2400)) * 20);
      // 演示：净重随码长缓慢变化，毛重保持净重+纸管
      state.weightNetKg = 18 + state.lengthM * 0.05;
      state.weightGrossKg = state.weightNetKg + 0.6;
      state.weightKg = state.weightNetKg;
      state.cpu = 35 + Math.abs(Math.sin(Date.now() / 1400)) * 25;
      state.gpu = 45 + Math.abs(Math.cos(Date.now() / 1600)) * 30;
      state.unwind = Math.max(20, 70 - state.lengthM * 0.2);
      if (state.plc) {
        state.plc.fabric_length = state.lengthM;
        state.plc.servo_speed = state.speed;
        state.plc.current_y = state.plcY;
        state.plc.current_x = state.plcX;

          return;
        }

        // ── artifical_add_defect ──
        if (act === "art-mode") {
          const mode = actEl && actEl.getAttribute("data-mode");
          if (mode) state.artificalMode = mode;
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-imgtype") {
          const t = actEl && Number(actEl.getAttribute("data-imgtype"));
          if (Number.isFinite(t)) state.artificalImgType = t;
          refreshOpenTool(host, "artificalAddDefect");
          showToast(state.lang === "zh-CN" ? `图像${state.artificalImgType + 1}` : `Image ${state.artificalImgType + 1}`);
          return;
        }
        if (act === "art-roi-add") {
          const p = host._pendingRoi;
          host._pendingRoi = null;
          if (!p) return;
          const id = state.artificalRoiSeq++;
          state.artificalRois.push({
            id, x: p.x, y: p.y, w: p.w, h: p.h, label: "",
          });
          state.artificalRoiId = id;
          state.artificalLabelModal = true;
          refreshOpenTool(host, "artificalAddDefect");
          showToast(state.lang === "zh-CN" ? `ROI-${id} 已添加` : `ROI-${id} added`);
          return;
        }
        if (act === "art-roi-select") {
          const rid = actEl && Number(actEl.getAttribute("data-roi-id"));
          if (Number.isFinite(rid)) state.artificalRoiId = rid;
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-roi-del") {
          state.artificalConfirm = "delete";
          state.artificalConfirmId = actId;
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-ticket") {
          state.artificalConfirm = "ticket";
          state.artificalConfirmId = actId;
          state.artificalRoiId = actId;
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-label-open") {
          if (state.artificalRoiId == null) {
            showToast(state.lang === "zh-CN" ? "请先选择 ROI" : "Select a ROI first");
            return;
          }
          state.artificalLabelModal = true;
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-label-close") {
          state.artificalLabelModal = false;
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-label-filter") {
          state.artificalLabelFilter = (actEl && actEl.getAttribute("data-group")) || "";
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-label") {
          const lab = actEl && actEl.getAttribute("data-label");
          const roi = state.artificalRois.find((r) => r.id === state.artificalRoiId);
          if (!roi) {
            showToast(state.lang === "zh-CN" ? "请先选择 ROI" : "Select a ROI first");
            return;
          }
          if (lab) roi.label = lab;
          state.artificalLabelModal = false;
          refreshOpenTool(host, "artificalAddDefect");
          showToast(state.lang === "zh-CN" ? `标签: ${lab}` : `Label: ${lab}`);
          return;
        }
        if (act === "art-clear") {
          if (!state.artificalRois.length) return;
          state.artificalConfirm = "clear";
          state.artificalConfirmId = null;
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-deselect") {
          state.artificalRoiId = null;
          state.artificalLabelModal = false;
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-finish") {
          if (!state.artificalRois.length) {
            showToast(state.lang === "zh-CN" ? "请至少框选一个 ROI" : "Draw at least one ROI");
            return;
          }
          const unlabeled = state.artificalRois.filter((r) => !r.label).length;
          if (unlabeled) {
            showToast(state.lang === "zh-CN" ? "请为每个 ROI 选择标签" : "Label every ROI");
            return;
          }
          state.artificalConfirm = "finish";
          state.artificalConfirmId = null;
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-confirm-cancel") {
          state.artificalConfirm = null;
          state.artificalConfirmId = null;
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-confirm-ok") {
          const kind = state.artificalConfirm;
          const cid = state.artificalConfirmId;
          state.artificalConfirm = null;
          state.artificalConfirmId = null;
          if (kind === "clear") {
            state.artificalRois = [];
            state.artificalRoiId = null;
            refreshOpenTool(host, "artificalAddDefect");
            showToast(state.lang === "zh-CN" ? "已清空" : "Cleared");
            return;
          }
          if (kind === "delete") {
            state.artificalRois = state.artificalRois.filter((r) => r.id !== cid);
            if (state.artificalRoiId === cid) state.artificalRoiId = null;
            refreshOpenTool(host, "artificalAddDefect");
            showToast(state.lang === "zh-CN" ? `已删除 ROI-${cid}` : `Deleted ROI-${cid}`);
            return;
          }
          if (kind === "ticket") {
            const roi = state.artificalRois.find((r) => r.id === cid);
            const x = roi ? Number(roi.x).toFixed(0) : "?";
            refreshOpenTool(host, "artificalAddDefect");
            showToast(state.lang === "zh-CN" ? `贴标已触发，X=${x}` : `Labeling triggered, X=${x}`);
            return;
          }
          if (kind === "finish") {
            // 预览：把漏检写入疵点列表
            state.artificalRois.forEach((r) => {
              const nextId = DEFECTS.reduce((m, d) => Math.max(m, d.id), 0) + 1;
              DEFECTS.push({
                id: nextId,
                title: r.label || "Manual",
                grade: "II",
                y: Math.max(0, state.lengthM),
                x: Math.min(1, Math.max(0, (Number(r.x) || 0) / 1200)),
              });
              state.selectedId = nextId;
            });
            const n = state.artificalRois.length;
            state.artificalRois = [];
            state.artificalRoiId = null;
            renderDefects();
            renderMetrics();
            showToast(state.lang === "zh-CN" ? `已保存 ${n} 个漏检` : `Saved ${n} defects`);
            host.close();
            return;
          }
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }

        // ── artifical_edit_defect ──
        if (act === "edit-select") {
          const id = host._pendingEditId != null ? host._pendingEditId
            : (actEl && Number(actEl.getAttribute("data-id")));
          host._pendingEditId = null;
          if (!Number.isFinite(id)) return;
          state.editSelectedId = id;
          state.selectedId = id;
          refreshOpenTool(host, "artificalEditDefect");
          return;
        }
        if (act === "edit-save") {
          const id = state.editSelectedId != null ? state.editSelectedId : state.selectedId;
          const d = DEFECTS.find((x) => x.id === id);
          if (!d) {
            showToast(state.lang === "zh-CN" ? "未选择疵点" : "No defect selected");
            return;
          }
          const typeEl = document.getElementById("spxEditType");
          const xEl = document.getElementById("spxEditX");
          const yEl = document.getElementById("spxEditY");
          const lenEl = document.getElementById("spxEditLen");
          const widEl = document.getElementById("spxEditWid");
          if (typeEl) d.title = typeEl.value || d.title;
          const widthMm = Math.max(200, Number(state.widthCm || 150) * 10);
          if (xEl) {
            const xmm = Math.max(0, Number(xEl.value) || 0);
            d.xMm = xmm;
            d.x = Math.min(1, xmm / widthMm);
          }
          if (yEl) {
            const ymm = Math.max(0, Number(yEl.value) || 0);
            d.yMm = ymm;
            d.y = ymm / 1000;
          }
          if (lenEl) d.lengthMm = Math.max(0, Number(lenEl.value) || 0);
          if (widEl) d.widthMm = Math.max(0, Number(widEl.value) || 0);
          d.areaMm2 = (d.lengthMm || 0) * (d.widthMm || 0);
          renderDefects();
          renderMetrics();
          refreshOpenTool(host, "artificalEditDefect");
          showToast(state.lang === "zh-CN" ? "已保存" : "Saved");
          return;
        }
        if (act === "edit-delete") {
          state.editConfirm = "delete";
          refreshOpenTool(host, "artificalEditDefect");
          return;
        }
        if (act === "edit-finish") {
          state.editConfirm = "finish";
          refreshOpenTool(host, "artificalEditDefect");
          return;
        }
        if (act === "edit-confirm-cancel") {
          state.editConfirm = null;
          refreshOpenTool(host, "artificalEditDefect");
          return;
        }
        if (act === "edit-confirm-ok") {
          const kind = state.editConfirm;
          state.editConfirm = null;
          if (kind === "delete") {
            const id = state.editSelectedId != null ? state.editSelectedId : state.selectedId;
            const idx = DEFECTS.findIndex((x) => x.id === id);
            if (idx >= 0) DEFECTS.splice(idx, 1);
            state.editSelectedId = DEFECTS[0] ? DEFECTS[0].id : null;
            state.selectedId = state.editSelectedId;
            renderDefects();
            renderMetrics();
            if (!DEFECTS.length) {
              showToast(state.lang === "zh-CN" ? "已删除，列表为空" : "Deleted — list empty");
              host.close();
              return;
            }
            refreshOpenTool(host, "artificalEditDefect");
            showToast(state.lang === "zh-CN" ? "已删除" : "Deleted");
            return;
          }
          if (kind === "finish") {
            showToast(state.lang === "zh-CN" ? "编辑完成" : "Edit finished");
            host.close();
            return;
          }
          refreshOpenTool(host, "artificalEditDefect");
          return;
        }

        // ── artifical_add_width ──
        if (act === "width-reset") {
          if (host._toolApi && typeof host._toolApi.reset === "function") host._toolApi.reset();
          showToast(state.lang === "zh-CN" ? "已重测" : "Reset");
          return;
        }
        if (act === "width-save") {
          try {
            const m = (host._toolApi && typeof host._toolApi.save === "function")
              ? await host._toolApi.save()
              : (host._toolApi && host._toolApi.measure ? host._toolApi.measure() : state.netWidth);
            if (!m || m.width == null) {
              showToast(state.lang === "zh-CN" ? "请先标定左右布边" : "Place both edges first");
              return;
            }
            state.netWidth = Object.assign({}, state.netWidth, m, { last: m.width });
            state.widthCm = Number(m.width) || state.widthCm;
            renderMetrics();
            showToast(state.lang === "zh-CN"
              ? `净幅宽 ${Number(m.width).toFixed(1)} cm`
              : `Net width ${Number(m.width).toFixed(1)} cm`);
            host.close();
          } catch (e) {
            showToast((e && e.message) || String(e));
          }
          return;
        }

        // ── DetectionRecords ──
        const recUi = () => state.recordsUi || (state.recordsUi = {});
        const recSuffix = (name) => {
          const s = String(name || "").trim();
          const dot = s.lastIndexOf(".");
          return (dot >= 0 ? s.slice(dot + 1) : s).trim().toLowerCase();
        };
        const recMatch = (a, b) => recSuffix(a) === recSuffix(b);
        const ensureDraft = (ui) => {
          if (!Array.isArray(ui.draftCols) || !ui.draftCols.length) {
            ui.draftCols = (Array.isArray(ui.cols) ? ui.cols : []).slice();
          }
          return ui.draftCols;
        };

        if (act === "rec-filter") {
          const f = actEl ? Number(actEl.getAttribute("data-filter")) : 0;
          recUi().filter = Number.isFinite(f) ? f : 0;
          recUi().page = 1;
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-query-type") {
          const sel = document.getElementById("popRecQueryType");
          recUi().queryType = sel ? Number(sel.value) || 0 : 0;
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-search") {
          const ui = recUi();
          const v = document.getElementById("popRecQueryValue");
          const d1 = document.getElementById("popRecDate");
          const d2 = document.getElementById("popRecDate2");
          const qt = document.getElementById("popRecQueryType");
          if (qt) ui.queryType = Number(qt.value) || 0;
          if (v) ui.queryValue = v.value || "";
          if (d1) ui.queryDate = d1.value || "";
          if (d2) ui.queryDate2 = d2.value || "";
          ui.page = 1;
          refreshOpenTool(host, "records");
          showToast(state.lang === "zh-CN" ? "已查询" : "Searched");
          return;
        }
        if (act === "rec-page") {
          const p = actEl ? Number(actEl.getAttribute("data-page")) : 1;
          recUi().page = Math.max(1, p || 1);
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-jump") {
          const inp = document.getElementById("popRecJump");
          recUi().page = Math.max(1, Number(inp && inp.value) || 1);
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-export") {
          showToast(state.lang === "zh-CN" ? "导出数据（预览）" : "Export (preview)");
          return;
        }
        if (act === "rec-total-len") {
          recUi().totalLengthM = state.todayM;
          refreshOpenTool(host, "records");
          showToast(
            state.lang === "zh-CN"
              ? `检验长度 ${state.todayM.toFixed(0)} m`
              : `Length ${state.todayM.toFixed(0)} m`
          );
          return;
        }
        if (act === "rec-order") {
          const finished = actEl && actEl.getAttribute("data-finished") === "1";
          showToast(
            finished
              ? (state.lang === "zh-CN" ? "查看报告" : "Open report")
              : (state.lang === "zh-CN" ? "检验此单" : "Inspect sheet")
          );
          return;
        }
        if (act === "rec-checkid") {
          showToast((state.lang === "zh-CN" ? "误检统计 · " : "Mistake stats · ") + (actEl ? actEl.textContent : ""));
          return;
        }
        if (act === "rec-print") {
          showToast(state.lang === "zh-CN" ? "打印标签（预览）" : "Print label (preview)");
          return;
        }
        if (act === "rec-settings") {
          const ui = recUi();
          ui.settingsOpen = !ui.settingsOpen;
          if (ui.settingsOpen) {
            ui.draftCols = (Array.isArray(ui.cols) ? ui.cols : []).slice();
            ui.settingsActiveIdx = -1;
            ui.settingsQuery = "";
          }
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-col-close") {
          const ui = recUi();
          ui.settingsOpen = false;
          ui.draftCols = null;
          ui.settingsActiveIdx = -1;
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-col-select") {
          const idx = actEl ? Number(actEl.getAttribute("data-index")) : -1;
          recUi().settingsActiveIdx = Number.isFinite(idx) ? idx : -1;
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-col-toggle") {
          const col = actEl && actEl.getAttribute("data-column");
          if (!col) return;
          const box = actEl.matches && actEl.matches("input[type='checkbox']")
            ? actEl
            : (actEl.querySelector && actEl.querySelector("input[type='checkbox']"));
          if (box && box.disabled) {
            showToast(state.lang === "zh-CN" ? "前 4 列不可移除" : "First 4 columns are fixed");
            return;
          }
          const ui = recUi();
          const draft = ensureDraft(ui);
          const idx = draft.findIndex((c) => recMatch(c, col));
          const wantOn = box ? !!box.checked : idx < 0;
          if (wantOn) {
            if (idx < 0) draft.push(col);
          } else {
            if (idx >= 0 && idx < 4) {
              if (box) box.checked = true;
              showToast(state.lang === "zh-CN" ? "前 4 列不可移除" : "First 4 columns are fixed");
              return;
            }
            if (idx >= 0) draft.splice(idx, 1);
          }
          ui.draftCols = draft;
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-col-remove") {
          const idx = actEl ? Number(actEl.getAttribute("data-index")) : -1;
          const ui = recUi();
          const draft = ensureDraft(ui);
          if (idx < 4) {
            showToast(state.lang === "zh-CN" ? "前 4 列不可移除" : "First 4 columns are fixed");
            return;
          }
          if (idx >= 0 && idx < draft.length) {
            draft.splice(idx, 1);
            ui.draftCols = draft;
            if (ui.settingsActiveIdx === idx) ui.settingsActiveIdx = -1;
            else if (ui.settingsActiveIdx > idx) ui.settingsActiveIdx -= 1;
            refreshOpenTool(host, "records");
          }
          return;
        }
        if (act === "rec-col-top" || act === "rec-col-bottom" || act === "rec-col-up" || act === "rec-col-down") {
          const ui = recUi();
          const draft = ensureDraft(ui);
          let idx = ui.settingsActiveIdx != null ? Number(ui.settingsActiveIdx) : -1;
          if (idx < 4 || idx >= draft.length) return;
          const item = draft.splice(idx, 1)[0];
          if (act === "rec-col-top") idx = 4;
          else if (act === "rec-col-bottom") idx = draft.length;
          else if (act === "rec-col-up") idx = Math.max(4, idx - 1);
          else idx = Math.min(draft.length, idx + 1);
          draft.splice(idx, 0, item);
          ui.draftCols = draft;
          ui.settingsActiveIdx = idx;
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-col-save") {
          const ui = recUi();
          const draft = ensureDraft(ui).map((c) => String(c || "").trim()).filter(Boolean);
          const zh = state.lang === "zh-CN";
          if (!draft.length) {
            showToast(zh ? "请至少选择一列" : "Select at least one column");
            return;
          }
          const msg = document.getElementById("popRecColMsg");
          // 有 SpxApi 时写库；纯静态预览仅本地生效
          if (window.SpxApi && typeof window.SpxApi.setSheetColumns === "function") {
            if (msg) {
              msg.className = "spx-msg";
              msg.textContent = zh ? "正在保存到数据库…" : "Saving to database...";
            }
            try {
              const ret = await window.SpxApi.setSheetColumns(draft);
              const saved = (ret && Array.isArray(ret.saved) && ret.saved.length) ? ret.saved : draft;
              ui.cols = saved.slice();
              ui.draftCols = null;
              ui.settingsOpen = false;
              ui.settingsActiveIdx = -1;
              if (typeof window.SpxApi.loadRecordsUi === "function") {
                try {
                  const next = await window.SpxApi.loadRecordsUi({ state: state }, { loadAvailable: true, reloadSheets: true });
                  if (next && next.state && next.state.recordsUi) {
                    Object.assign(ui, next.state.recordsUi, {
                      settingsOpen: false,
                      draftCols: null,
                    });
                    if (Array.isArray(next.recordRows)) state.recordRows = next.recordRows;
                  }
                } catch (e) {
                  console.warn("preview reloadRecordsUi", e);
                }
              }
              refreshOpenTool(host, "records");
              showToast(zh ? `列配置已保存（${ui.cols.length} 列）` : `Columns saved (${ui.cols.length})`);
            } catch (e) {
              console.warn("setSheetColumns", e);
              if (msg) {
                msg.className = "spx-msg err";
                msg.textContent = (e && e.message) || (zh ? "保存失败" : "Save failed");
              }
              showToast((e && e.message) || (zh ? "保存失败" : "Save failed"));
            }
            return;
          }
          ui.cols = draft.slice();
          ui.draftCols = null;
          ui.settingsOpen = false;
          refreshOpenTool(host, "records");
          showToast(zh ? "列配置已保存（预览本地，未写库）" : "Saved locally (preview, no DB)");
          return;
        }

        showToast(act);
      },
    });

    document.querySelectorAll("[data-popup]").forEach((el) => {
      el.addEventListener("click", () => {
        popupHost.open(el.getAttribute("data-popup"), el);
      });
    });

    $("btnDefectAdd").addEventListener("click", () => {
      // 对齐 DefectList::on_ButtonAddClicked → artifical_add_defect（SPX）
      popupHost.open("artificalAddDefect", $("btnDefectAdd"));
    });
    $("btnDefectEdit").addEventListener("click", () => {
      if (!DEFECTS.find((d) => d.id === state.selectedId)) {
        showToast(state.lang === "zh-CN" ? "请先选择疵点" : "Select a defect first");
        return;
      }
      // 对齐 DefectList 编辑 → artifical_edit_defect（SPX）
      state.editSelectedId = state.selectedId;
      state.editConfirm = null;
      popupHost.open("artificalEditDefect", $("btnDefectEdit"));
    });

    $("btnRun").addEventListener("click", () => {
      if (!playActFeedback($("btnRun"), 300)) return;
      state.running = !state.running;
      updateRunBtn();
      showToast(state.running ? t("start") : t("pause"));
    });

    document.querySelector(".action-row .act-new")?.addEventListener("click", (e) => {
      playActFeedback(e.currentTarget, 400);
    }, true);
    document.querySelector(".action-row .act-finish")?.addEventListener("click", (e) => {
      playActFeedback(e.currentTarget, state.running ? 400 : 850);
    }, true);

    $("lang").addEventListener("change", (e) => {
      state.lang = e.target.value;
      applyI18n();
      if (popupHost.activeKey) popupHost.open(popupHost.activeKey, popupHost.triggerEl);
    });

    $("btnExit").addEventListener("click", () => showToast(t("exit")));

    window.addEventListener("resize", () => {
      layoutStageOverlays();
      if (popupHost.activeKey) popupHost.open(popupHost.activeKey, popupHost.triggerEl);
    });

    tickClock();
    setInterval(tickClock, 1000);
    buildViewToggleBar();
    seedDetectionResults();
    bindFabricCoordHud();
    applyI18n();
    applyViewFlags();
    layoutStageOverlays();
    requestAnimationFrame(() => layoutStageOverlays());
    updateFpsHud();
    setInterval(tickPreviewFps, 800);
    renderMetrics();
    renderDefects();
    setInterval(demoTick, 400);
  </script>
</body>
</html>
