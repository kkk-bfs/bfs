<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CustomUIV3 · SpaceX HUD</title>
  <style>
    :root {
      --space-black: #000000;
      --spectral: #f0f0fa;
      --muted: rgba(240, 240, 250, 0.55);
      --ghost-surface: rgba(240, 240, 250, 0.08);
      --ghost-border: rgba(240, 240, 250, 0.28);
      --ghost-border-strong: rgba(240, 240, 250, 0.35);
      --overlay: rgba(0, 0, 0, 0.45);
      --hud-panel: rgba(0, 0, 0, 0.28);
      --hud-panel-hover: rgba(240, 240, 250, 0.1);
      --ok: #3ddc97;
      --warn: #f5c542;
      --bad: #ff4d4f;
      --progress-track: rgba(240, 240, 250, 0.18);
      --progress-fill: #f0f0fa;
      --font: "Bahnschrift", "DIN Alternate", "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--space-black);
      color: var(--spectral);
      font-family: var(--font);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: inherit; cursor: pointer; }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 640px;
      background: var(--space-black);
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      max-height: 64px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.72);
      border-bottom: 1px solid rgba(240, 240, 250, 0.18);
      z-index: 20;
    }

    .header-left,
    .header-center,
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .header-left { gap: 12px; }
    .header-center { justify-content: center; flex-wrap: wrap; }
    .header-right { justify-content: flex-end; flex-wrap: wrap; }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--spectral);
    }

    .mono {
      font-size: 13px;
      letter-spacing: 1px;
      color: rgba(240, 240, 250, 0.75);
    }

    .device-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px 6px 10px;
      background: var(--ghost-surface);
      border: 1px solid var(--ghost-border);
      border-radius: 4px;
      transition: background 160ms ease;
      max-width: 220px;
    }

    .device-chip:hover { background: rgba(240, 240, 250, 0.16); }

    .device-chip .value {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(240, 240, 250, 0.35);
      background: #6b6b75;
      flex-shrink: 0;
    }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--bad); }

    .label {
      font-size: 11px;
      letter-spacing: 1.2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .value {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--spectral);
    }

    .lang-select,
    .ghost-btn,
    .run-btn {
      background: var(--ghost-surface);
      color: var(--spectral);
      border: 1px solid var(--ghost-border);
      border-radius: 22px;
      padding: 8px 16px;
      font-weight: 600;
      letter-spacing: 1px;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .lang-select {
      border-radius: 4px;
      min-width: 120px;
      min-height: 36px;
      appearance: none;
      padding-right: 28px;
      background-image: linear-gradient(45deg, transparent 50%, var(--spectral) 50%),
        linear-gradient(135deg, var(--spectral) 50%, transparent 50%);
      background-position: calc(100% - 14px) 55%, calc(100% - 10px) 55%;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
    }

    .ghost-btn:hover,
    .lang-select:hover { background-color: rgba(240, 240, 250, 0.16); }

    .ghost-btn:active { background-color: rgba(240, 240, 250, 0.22); }

    /* ── Stage ── */
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: var(--space-black);
    }

    .fabric {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 18%, transparent 55%, rgba(0,0,0,0.72) 100%),
        repeating-linear-gradient(
          90deg,
          #1a1a22 0px,
          #1a1a22 18px,
          #15151c 18px,
          #15151c 36px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(240, 240, 250, 0.04) 0px,
          rgba(240, 240, 250, 0.04) 1px,
          transparent 1px,
          transparent 28px
        );
      background-size: auto, 36px 100%, 100% 28px;
      animation: fabric-scroll 18s linear infinite;
    }

    .fabric.paused { animation-play-state: paused; }

    @keyframes fabric-scroll {
      from { background-position: 0 0, 0 0, 0 0; }
      to { background-position: 0 0, 0 0, 0 560px; }
    }

    .fabric-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(240, 240, 250, 0.35);
      font-size: 14px;
      pointer-events: none;
    }

    .defect-mark {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 1px solid rgba(255, 77, 79, 0.9);
      background: rgba(255, 77, 79, 0.25);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
      animation: pulse 2.4s ease-in-out infinite;
    }

    .defect-mark.selected {
      border-color: var(--warn);
      background: rgba(245, 197, 66, 0.3);
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.75; }
    }

    .hud-panel {
      position: absolute;
      top: 16px;
      bottom: 16px;
      width: clamp(220px, 18vw, 280px);
      background: var(--hud-panel);
      border: 1px solid var(--ghost-border);
      border-radius: 4px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10;
    }

    .hud-panel.map { left: 16px; }
    .hud-panel.list { right: 16px; width: clamp(240px, 20vw, 300px); }

    .hud-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .list-actions {
      display: flex;
      gap: 6px;
    }

    .list-actions .ghost-btn {
      flex: 1;
      padding: 6px 10px;
      border-radius: 4px;
      min-height: 32px;
      font-size: 12px;
      letter-spacing: 0.8px;
    }

    .map-canvas {
      flex: 1;
      min-height: 120px;
      margin-top: 4px;
      border: 1px solid rgba(240, 240, 250, 0.18);
      background: rgba(0, 0, 0, 0.12);
      position: relative;
      overflow: hidden;
    }

    .map-point {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--bad);
      border: 1px solid rgba(240, 240, 250, 0.5);
      transform: translate(-50%, -50%);
    }

    .map-point.selected { background: var(--warn); }

    .defect-list {
      list-style: none;
      flex: 1;
      overflow: auto;
      margin-top: 4px;
    }

    .defect-list li {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(240, 240, 250, 0.08);
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: background 140ms ease;
    }

    .defect-list li:hover,
    .defect-list li.active { background: var(--hud-panel-hover); }

    .defect-list::-webkit-scrollbar { width: 6px; }
    .defect-list::-webkit-scrollbar-thumb {
      background: rgba(240, 240, 250, 0.22);
      border-radius: 3px;
    }

    /* ── Bottom HUD ── */
    .bottom {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      align-items: center;
      min-height: 0;
      max-height: 128px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.72);
      border-top: 1px solid rgba(240, 240, 250, 0.18);
      z-index: 20;
    }

    .side-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
      align-self: center;
      min-width: 0;
      height: auto;
      max-height: 100%;
    }

    /* 5 列 × 2 行；列优先：先填最外侧列，再往中间填 */
    .side-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-template-rows: repeat(2, auto);
      grid-auto-flow: column;
      align-content: center;
      gap: 4px;
      width: 100%;
      height: auto;
      min-height: 0;
    }

    .side-col.side-left .side-grid {
      direction: ltr;
    }

    .side-col.side-right .side-grid {
      direction: rtl; /* 最右列为第一列，先填满再往左 */
    }

    .side-col.side-right .chip {
      direction: ltr;
    }

    .chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      box-sizing: border-box;
      min-width: 0;
      width: 100%;
      height: auto;
      min-height: 40px;
      padding: 4px 4px;
      background: var(--ghost-surface);
      border: 1px solid var(--ghost-border);
      border-radius: 4px;
      text-align: center;
      color: inherit;
      font: inherit;
      transition: background 160ms ease;
    }

    .chip:hover { background: rgba(240, 240, 250, 0.16); }

    .chip .label {
      font-size: 10px;
      letter-spacing: 0.4px;
      line-height: 1.05;
      transform: scale(0.95);
      transform-origin: center bottom;
    }

    .chip .chip-value {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--spectral);
      word-break: break-all;
      line-height: 1.1;
    }

    .chip.span-2 { grid-row: 1 / -1; grid-column: span 2; }
    .chip.chip-fp {
      min-height: 40px;
      gap: 2px;
    }
    .chip-fp-vals {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
      font-size: 13px !important;
      font-weight: 700;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .chip-fp-vals .fp-sep {
      color: var(--muted);
      font-weight: 600;
      margin: 0 1px;
    }
    .chip-fp-vals .fp-ok { color: var(--ok); }
    .chip-fp-vals .fp-ng { color: var(--bad); }
    /* 报警芯片：单行紧凑，避免 span-2 双行过高被中间晕影盖住 */
    .chip.alarm-chip {
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      text-align: left;
      padding: 4px 8px;
      min-height: 40px;
      max-height: 40px;
      min-width: 0;
      overflow: hidden;
      grid-column: span 2;
      grid-row: auto;
    }
    .chip.alarm-chip .label {
      flex: 0 0 auto;
      text-align: left;
      transform: none;
      font-size: 10px;
      opacity: 0.75;
    }
    .chip.alarm-chip .chip-value {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      word-break: normal;
      line-height: 1.2;
    }
    .chip.alarm-chip.active {
      border-color: rgba(255, 77, 79, 0.65);
      background: rgba(255, 77, 79, 0.12);
    }
    .chip.alarm-chip.active .chip-value {
      color: #FF4D4F;
    }
    .alarm-ticker-viewport {
      display: block;
      overflow: hidden;
      width: 100%;
      mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
    }
    .alarm-ticker-track {
      display: inline-block;
      padding-left: 100%;
      animation: spx-alarm-marquee 12s linear infinite;
    }
    .chip.alarm-chip:not(.active) .alarm-ticker-track {
      padding-left: 0;
      animation: none;
    }
    @keyframes spx-alarm-marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      align-self: center;
      gap: 3px;
      min-width: 0;
      width: 100%;
      height: auto;
      max-height: 100%;
    }

    .meter-row {
      display: flex;
      gap: 4px;
      justify-content: center;
      flex-wrap: nowrap;
      width: 100%;
    }

    /* 横排：标签 + 数值 + 单位，单行放大字号不抬高 */
    .meter {
      flex: 1 1 0;
      min-width: 0;
      max-width: 160px;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid var(--ghost-border);
      background: var(--ghost-surface);
      display: flex;
      flex-direction: row;
      align-items: baseline;
      justify-content: center;
      gap: 4px;
      color: inherit;
      font: inherit;
      white-space: nowrap;
    }

    .meter .label {
      font-size: 11px;
      letter-spacing: 0.4px;
      line-height: 1;
      flex-shrink: 0;
    }

    .meter .meter-value {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
      line-height: 1;
      min-width: 0;
    }

    .meter .chip-value {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
      font-variant-numeric: tabular-nums;
      color: var(--spectral);
      line-height: 1;
    }

    .meter .meter-unit {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--muted);
      text-transform: none;
      flex-shrink: 0;
    }

    .action-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      width: 100%;
      flex-shrink: 0;
    }

    .action-row .ghost-btn,
    .action-row .run-btn {
      min-width: 108px;
      min-height: 40px;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .action-row .run-btn,
    .action-row #btnRun {
      min-width: 216px;
    }

    /* 主操作语义色：新建轻提亮 / 启动绿 / 暂停红 / 结束琥珀 */
    .action-row .act-new {
      background: rgba(240, 240, 250, 0.12);
      border-color: rgba(240, 240, 250, 0.48);
    }
    .action-row .act-new:hover {
      background: rgba(240, 240, 250, 0.2);
    }

    .action-row .act-finish {
      background: rgba(245, 197, 66, 0.12);
      border-color: rgba(245, 197, 66, 0.55);
      color: #f5d97a;
    }
    .action-row .act-finish:hover {
      background: rgba(245, 197, 66, 0.2);
    }

    .run-btn {
      background: rgba(61, 220, 151, 0.14);
      border: 1px solid rgba(61, 220, 151, 0.55);
      color: #9aefc9;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .run-btn:hover { background: rgba(61, 220, 151, 0.22); }

    .run-btn.running {
      background: rgba(255, 77, 79, 0.18);
      border-color: rgba(255, 77, 79, 0.65);
      color: #ffb4b4;
    }
    .run-btn.running:hover {
      background: rgba(255, 77, 79, 0.26);
    }

    .progress-wrap {
      width: 100%;
      height: 16px;
      border: 1px solid var(--ghost-border);
      border-radius: 4px;
      background: var(--progress-track);
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--progress-fill);
      border-radius: 3px;
      transition: width 280ms ease;
    }

    .progress-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--spectral);
      mix-blend-mode: difference;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(12px);
      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid var(--ghost-border-strong);
      border-radius: 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      z-index: 30;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1200px) {
      .header { padding: 6px 8px; gap: 6px; }
      .device-chip { padding: 5px 8px; gap: 6px; }
      .device-chip .value { font-size: 12px; }
      .ghost-btn, .lang-select { padding: 6px 12px; }
      .lang-select { min-width: 96px; }
      .hud-panel.map, .hud-panel.list {
        width: min(200px, 22vw);
        top: 10px;
        bottom: 10px;
      }
      .hud-panel.map { left: 10px; }
      .hud-panel.list { right: 10px; }
      .meter { min-width: 64px; }
      .bottom {
        grid-template-columns: 1fr 1fr 1fr;
        max-height: 120px;
      }
    }

    @media (max-width: 900px) {
      .header-right .ghost-btn:nth-child(n+3):nth-child(-n+4) { display: none; }
      .logo { font-size: 15px; letter-spacing: 2px; }
      .mono { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fabric, .defect-mark { animation: none !important; }
    }

    /* ── Popup (SpaceX shell · viewsvue fields) ── */
    .spx-popup-root {
      position: fixed;
      inset: 0;
      z-index: 100;
    }
    .spx-popup-root[hidden] { display: none !important; }
    /* 旁挂详情：不挡列表操作、不抢焦点 */
    .spx-popup-root.modeless {
      pointer-events: none;
      background: transparent;
    }
    .spx-popup-root.modeless .spx-popup-mask {
      display: none;
    }
    .spx-popup-root.modeless .spx-popup-shell {
      pointer-events: auto;
    }
    .spx-popup-mask {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }
    .spx-popup-shell {
      position: fixed;
      display: flex;
      flex-direction: column;
      background: rgba(8, 8, 10, 0.96);
      border: 1px solid rgba(240, 240, 250, 0.28);
      border-radius: 4px;
      color: var(--spectral);
      overflow: hidden;
      box-shadow: none;
      z-index: 101;
    }
    /* 检验记录 / 疵点设置：居中铺满中间区时略透明 */
    .spx-popup-shell.center {
      background: rgba(8, 8, 10, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    /* 系统消息弹窗（无布停机/结检/取样等）：略透明 */
    .spx-popup-shell.info {
      background: rgba(8, 8, 10, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .spx-popup-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 10px 16px;
      background: rgba(0, 0, 0, 0.55);
      border-bottom: 1px solid rgba(240, 240, 250, 0.18);
    }
    .spx-popup-title {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .spx-popup-close {
      width: 44px;
      height: 44px;
      border-radius: 22px;
      border: 1px solid var(--ghost-border);
      background: var(--ghost-surface);
      color: var(--spectral);
      font-size: 22px;
      line-height: 1;
      flex-shrink: 0;
    }
    .spx-popup-close:hover { background: rgba(255, 77, 79, 0.25); }
    .spx-popup-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .spx-section {
      color: rgba(240, 240, 250, 0.75);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding-bottom: 4px;
    }
    .spx-kv, .spx-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
    }
    .spx-field { flex-wrap: wrap; }
    .spx-field.inline { flex: 1; justify-content: flex-start; }

      height: 72px;

      border-radius: 4px;
      background: #15151c;
      overflow: hidden;
    }
    .spx-art-thumb-vp {
      position: absolute;
      border: 1px solid var(--warn);
      background: rgba(245, 197, 66, 0.15);
      min-width: 18%;
      min-height: 16%;
    }
    .spx-art-table-wrap {

      min-height: 80px;

    }
    @keyframes spx-art-spin { to { transform: rotate(360deg); } }
    @keyframes spx-art-bar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(280%); }
    }
    .spx-art-modal {
      position: absolute; inset: 0; z-index: 30;
      display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55); padding: 16px;
    }
    .spx-art-modal.active { display: flex; }
    .spx-art-modal-card {
      width: min(420px, 100%); max-height: 90%;
      display: flex; flex-direction: column; gap: 12px;
      padding: 14px 16px; border-radius: 6px;
      border: 1px solid rgba(240, 240, 250, 0.28);
      background: rgba(18, 18, 24, 0.96); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .spx-art-modal-card.wide { width: min(720px, 100%); }
    .spx-art-modal-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 15px; letter-spacing: 1px; color: var(--spectral);
    }
    .spx-art-modal-x {
      width: 32px; height: 32px; border: none; border-radius: 4px;
      background: transparent; color: var(--spectral); font-size: 22px; cursor: pointer;
    }
    .spx-art-modal-x:hover { background: rgba(240, 240, 250, 0.12); }
    .spx-art-modal-msg { color: var(--muted); line-height: 1.5; font-size: 13px; }
    .spx-art-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .spx-art-filter { display: flex; flex-wrap: wrap; gap: 6px; }
    .spx-art-chip {
      padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(240, 240, 250, 0.28);
      background: rgba(240, 240, 250, 0.06); color: var(--spectral); font: inherit; font-size: 12px; cursor: pointer;
    }
    .spx-art-chip.active, .spx-art-chip:hover {
      background: rgba(245, 197, 66, 0.18); border-color: rgba(245, 197, 66, 0.55);
    }
    .spx-art-type-wrap { overflow: auto; min-height: 0; max-height: min(52vh, 420px); display: flex; flex-direction: column; gap: 12px; }
    .spx-art-type-group-title {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
      color: var(--muted); font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
    }
    .spx-art-type-count {
      padding: 1px 6px; border-radius: 3px; border: 1px solid rgba(240, 240, 250, 0.2); font-size: 11px;
    }
    .spx-art-type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px;
    }
    .spx-art-type {
      display: flex; flex-direction: column; gap: 6px; padding: 8px;
      border-radius: 4px; border: 1px solid rgba(240, 240, 250, 0.22);
      background: rgba(240, 240, 250, 0.06); color: var(--spectral); font: inherit; text-align: left; cursor: pointer;
    }
    .spx-art-type:hover { background: rgba(240, 240, 250, 0.12); }
    .spx-art-type.selected { border-color: rgba(245, 197, 66, 0.7); background: rgba(245, 197, 66, 0.12); }
    .spx-art-type-thumb {
      height: 56px; border-radius: 3px; background: #15151c;
      border: 1px solid rgba(240, 240, 250, 0.12);
    }
    .spx-art-type-thumb.is-empty {
      background:
        linear-gradient(135deg, rgba(240,240,250,0.08), transparent 55%),
        repeating-linear-gradient(45deg, #15151c 0 8px, #121218 8px 16px);
    }
    .spx-art-type-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .spx-art-type-code { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .spx-art-type-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .spx-art-status {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 12px;
      border-top: 1px solid rgba(240, 240, 250, 0.14);
      background: rgba(0, 0, 0, 0.45);
      color: var(--muted);
      font-size: 12px;
    }
    .spx-art-badge {
      padding: 2px 8px;
      border-radius: 3px;
      background: rgba(74, 83, 96, 0.85);
      color: #f5f5f5;
      font-size: 11px;
      letter-spacing: 0.6px;
    }

    .spx-width {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .spx-width-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(240, 240, 250, 0.14);
      color: var(--muted);
      font-size: 13px;
      background: rgba(0, 0, 0, 0.35);
    }
    .spx-width-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #0c0c10;
    }
    .spx-width-stage canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
    .spx-width-float {
      display: none;
      position: absolute;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      padding: 8px 18px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      pointer-events: none;
    }
    .spx-width-float.show { display: block; }
    .spx-width-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 14px;
      border-top: 1px solid rgba(240, 240, 250, 0.14);
      background: rgba(0, 0, 0, 0.4);
    }
    .spx-width-metric {
      display: flex;
      flex-direction: column;
      min-width: 88px;
    }
    .spx-width-metric .k { font-size: 11px; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; }
    .spx-width-metric .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .spx-width-metric.left .v { color: #ff4d4f; }
    .spx-width-metric.right .v { color: #4c9aff; }
    .spx-width-metric.muted .v { color: var(--muted); font-size: 18px; }
    .spx-width-bar .spacer { flex: 1; }
    .spx-width-bar .run-btn:disabled { opacity: 0.4; cursor: default; }
    .spx-width-loading {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      color: #fff; background: rgba(0,0,0,0.4); white-space: pre-wrap; text-align: center; padding: 24px;
      pointer-events: none;
    }
    .spx-width-loading.active { display: flex; }
    .spx-width-manual {
      display: none; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
    }
    .spx-width-manual.show { display: flex; }
    .spx-width-manual input {
      width: 110px; height: 36px; padding: 0 10px; border-radius: 4px;
      border: 1px solid rgba(240,240,250,0.28); background: rgba(0,0,0,0.45);
      color: var(--spectral); font-size: 18px; font-weight: 700;
    }
    .spx-width-pad-data {
      font-family: Consolas, "Courier New", monospace; font-size: 12px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42%;
    }
    .spx-art-badge.active { background: #0f938f; }
    .spx-art-badge.warn { background: #a3100d; }

    /* ── DetectionRecords ── */
    .spx-records {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      gap: 10px;
      padding: 12px 14px 10px;
    }
    .spx-records-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex: 0 0 auto;
    }
    .spx-records-tabs,
    .spx-records-query {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .spx-records-query select,
    .spx-records-query input[type="text"],
    .spx-records-query input[type="date"],
    .spx-records-pager input[type="number"] {
      background: rgba(240, 240, 250, 0.06);
      color: var(--spectral);
      border: 1px solid rgba(240, 240, 250, 0.22);
      border-radius: 4px;
      padding: 6px 8px;
      font: inherit;
      min-height: 34px;
      color-scheme: dark;
    }
    .spx-records-query select {
      min-width: 128px;
      max-width: 168px;
      padding: 6px 28px 6px 10px;
      appearance: none;
      -webkit-appearance: none;
      background-color: #141418;
      background-image: linear-gradient(45deg, transparent 50%, var(--spectral) 50%),
        linear-gradient(135deg, var(--spectral) 50%, transparent 50%);
      background-position: calc(100% - 14px) 55%, calc(100% - 10px) 55%;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
      cursor: pointer;
    }
    .spx-records-query select:hover {
      background-color: #1c1c22;
      border-color: rgba(240, 240, 250, 0.38);
    }
    .spx-records-query select:focus {
      outline: none;
      border-color: rgba(240, 240, 250, 0.55);
    }
    .spx-records-query select option {
      background: #141418;
      color: #f0f0fa;
    }
    .spx-records-query select option:checked,
    .spx-records-query select option:hover {
      background: #2a2a34;
      color: #f0f0fa;
    }
    .spx-records-query input[type="text"] { width: 140px; }
    .spx-records-query input[type="date"] { width: 148px; }
    .spx-records-table-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid rgba(240, 240, 250, 0.14);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.22);
    }
    .spx-records-table {
      min-width: 1180px;
      font-size: 12px;
    }
    .spx-records-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      white-space: nowrap;
    }
    .spx-records-table td {
      white-space: nowrap;
      vertical-align: middle;
    }
    .spx-records-table tbody tr:nth-child(even) {
      background: rgba(240, 240, 250, 0.03);
    }
    .spx-records-table tbody tr:hover {
      background: rgba(240, 240, 250, 0.08);
    }
    .spx-rec-status {
      display: inline-block;
      min-width: 56px;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      letter-spacing: 0.6px;
      text-align: center;
    }
    .spx-rec-status.ok {
      color: var(--ok);
      border: 1px solid rgba(61, 220, 151, 0.45);
      background: rgba(61, 220, 151, 0.12);
    }
    .spx-rec-status.warn {
      color: var(--warn);
      border: 1px solid rgba(245, 197, 66, 0.45);
      background: rgba(245, 197, 66, 0.12);
    }
    .spx-records-pager {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex: 0 0 auto;
      padding-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }
    .spx-records-pager-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-right: auto;
      white-space: nowrap;
    }
    .spx-records-pager-ctrl {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }
    .spx-records-pager-ctrl .ghost-btn.compact {
      padding: 4px 10px;
      min-width: 0;
      min-height: 28px;
      border-radius: 4px;
      letter-spacing: 0.4px;
    }
    .spx-records-pager input[type="number"] {
      width: 48px;
      min-height: 28px;
      padding: 2px 4px;
      text-align: center;
    }
    .spx-records-pager .ghost-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .spx-records-sep {
      width: 1px;
      height: 16px;
      background: rgba(240, 240, 250, 0.2);
      margin: 0 2px;
      flex: 0 0 auto;
    }
    .spx-records-pager b { color: var(--spectral); }

    @media (max-width: 1100px) {
      .spx-aided-mainrow { grid-template-columns: 1fr; }
      .spx-aided-side { flex-direction: row; flex-wrap: wrap; align-items: center; }
      .spx-aided-confirm { min-height: 44px; width: auto; }
      .spx-art { grid-template-columns: 1fr; grid-template-rows: minmax(220px, 1fr) minmax(200px, 40%) auto; }
      .spx-art-left { border-right: none; border-bottom: 1px solid rgba(240, 240, 250, 0.14); }
    }
  </style>

<body>
  <div class="app" id="app">
    <header class="header">
      <div class="header-left">
        <div class="logo">Bullmer</div>
        <div class="mono" id="clock">2026-11-19  22:16:00</div>
      </div>
      <div class="header-center">
        <button class="device-chip" type="button" data-popup="plc" title="x y ty">
          <span class="dot ok" id="plcDot"></span>
          <span class="label">PLC</span>
          <span class="value" id="plcVal">120 12400 100000</span>
        </button>
        <button class="device-chip" type="button" data-popup="camera" title="frames">
          <span class="dot ok" id="camDot"></span>
          <span class="label">Camera</span>
          <span class="value" id="camVal">1280</span>
        </button>
        <button class="device-chip" type="button" data-popup="light" title="auto / brightness">
          <span class="dot ok" id="lightDot"></span>
          <span class="label">Light</span>
          <span class="value" id="lightVal">AUTO 180</span>
        </button>
        <button class="device-chip" type="button" data-popup="alarm">
          <span class="dot ok" id="alarmDot"></span>
          <span class="label">Alarm</span>
          <span class="value" id="alarmVal">0</span>
        </button>
      </div>
      <div class="header-right">
        <select class="lang-select" id="lang" aria-label="Language">
          <option value="zh-CN">中文</option>
          <option value="en">English</option>
          <option value="vi-VN">Tiếng Việt</option>
          <option value="pt-PT">Português</option>
          <option value="de-DE">Deutsch</option>
        </select>
        <button class="ghost-btn" type="button" data-popup="login">Login</button>
        <button class="ghost-btn" type="button" data-popup="systemSettings">Settings</button>
        <button class="ghost-btn" type="button" data-popup="about">About</button>
        <button class="ghost-btn" type="button" id="btnExit">Exit</button>
      </div>
    </header>

    <main class="stage">
      <div class="fabric" id="fabric"></div>
      <div class="fabric-placeholder" id="fabricHint">Fabric Live View</div>
      <div id="stageMarks"></div>

      <aside class="hud-panel map">
        <div class="label" id="mapTitle">Defect Map</div>
        <div class="mono" id="mapMeta">1.50 × 42.0 m  ·  5</div>
        <div class="map-canvas" id="mapCanvas"></div>
      </aside>

      <aside class="hud-panel list">
        <div class="hud-head">
          <span class="label" id="listTitle">Defect List</span>
          <span class="mono" id="listMeta">5</span>
        </div>
        <div class="list-actions">
          <button class="ghost-btn" type="button" id="btnDefectAdd" data-i18n="add_defect">新增</button>
          <button class="ghost-btn" type="button" id="btnDefectEdit" data-i18n="edit_defect">编辑</button>
        </div>
        <ul class="defect-list" id="defectList"></ul>
      </aside>

      <div class="toast" id="toast"></div>

      <!-- preview: RealTimeDetection::slot_show 基本信息弹窗 + 工具页 -->
      <div class="demo-show" aria-label="slot_show demo">
        <span class="demo-label">slot_show</span>
        <button class="ghost-btn" type="button" data-popup="noclothstop">noclothstop</button>
        <button class="ghost-btn" type="button" data-popup="empty_sheet_stop">empty_sheet</button>
        <button class="ghost-btn" type="button" data-popup="noclothstop_clothfinish">clothfinish</button>
        <button class="ghost-btn" type="button" data-popup="loop_stop">loop_stop</button>
        <button class="ghost-btn" type="button" data-popup="cloth_finish_stop">cloth_finish</button>
        <button class="ghost-btn" type="button" data-popup="mid_sample_stop">mid_sample</button>
        <button class="ghost-btn" type="button" data-popup="width_sample_stop">width_sample</button>
        <button class="ghost-btn" type="button" data-popup="netWidthNeedStart">net_start</button>
        <button class="ghost-btn" type="button" data-popup="netWidthNeedStop">net_stop</button>
        <button class="ghost-btn" type="button" data-popup="colordiffalarm">colordiff</button>
        <span class="demo-label">tools</span>
        <button class="ghost-btn" type="button" data-popup="defectAidedSelection">aided</button>
        <button class="ghost-btn" type="button" data-popup="artificalAddDefect">add_defect</button>
        <button class="ghost-btn" type="button" data-popup="artificalAddWidth">add_width</button>
      </div>
    </main>

    <footer class="bottom">
      <div class="side-col side-left">
        <div class="side-grid">
          <button class="chip" type="button" data-popup="erpEditSheet">
            <span class="label" data-i18n="check_id">Check ID</span>
            <span class="chip-value" id="checkId">CK-20261119</span>
          </button>
          <button class="chip" type="button" data-popup="erpEditSheet">
            <span class="label" data-i18n="lot">Lot</span>
            <span class="chip-value" id="lotNo">L-88421</span>
          </button>
          <button class="chip" type="button" data-popup="erpEditSheet">
            <span class="label" data-i18n="roll">Roll</span>
            <span class="chip-value" id="rollNo">R-17</span>
          </button>
          <button class="chip" type="button" data-popup="erpEditSheet">
            <span class="label" data-i18n="color">Color</span>
            <span class="chip-value" id="fabricColor">Navy</span>
          </button>
          <button class="chip" type="button" data-popup="erpEditSheet">
            <span class="label" data-i18n="fabric_name">Fabric</span>
            <span class="chip-value" id="fabricName">Twill 280GSM</span>
          </button>
          <button class="chip chip-fp" type="button" data-popup="fourPoints" title="百平方码扣分 / OK·NG">
            <span class="label" data-i18n="fp_per100sq">百平方码扣分</span>
            <span class="chip-value chip-fp-vals">
              <b id="fpPer100Sq">0.00</b><span class="fp-sep">/</span><b id="fpResult" class="fp-ok">OK</b>
            </span>
          </button>
          <button class="chip" type="button" data-popup="width">
            <span class="label" data-i18n="gross_width">毛幅宽</span>
            <span class="chip-value" id="grossWidth">150.0</span>
          </button>
          <button class="chip" type="button" data-popup="artificalAddWidth">
            <span class="label" data-i18n="net_width">净幅宽</span>
            <span class="chip-value" id="netWidthChip">148.2</span>
          </button>
        </div>
      </div>

      <div class="center-col">
        <div class="action-row">
          <button class="ghost-btn act-new" type="button" data-popup="erpNewSheet" data-i18n="new_sheet">New</button>
          <button class="run-btn" type="button" id="btnRun" data-i18n="start">Start</button>
          <button class="ghost-btn act-finish" type="button" data-popup="finishSheet" data-i18n="finish_sheet">Finish</button>
        </div>
        <div class="meter-row">
          <button class="meter" type="button" data-popup="length">
            <span class="label" data-i18n="length">Length</span>
            <span class="meter-value">
              <span class="chip-value" id="meterLength">12.4</span>
              <span class="meter-unit">m</span>
            </span>
          </button>
          <button class="meter" type="button" data-popup="width">
            <span class="label" data-i18n="width">Width</span>
            <span class="meter-value">
              <span class="chip-value" id="meterWidth">150.0</span>
              <span class="meter-unit">cm</span>
            </span>
          </button>
          <button class="meter" type="button" data-popup="speed">
            <span class="label" data-i18n="speed">Speed</span>
            <span class="meter-value">

    function calcFourPoints(defects, lengthM, widthCm) {
      const counts = { I: 0, II: 0, III: 0, IV: 0 };
      const rows = [];
      let total = 0;
      (defects || []).forEach((d) => {
        const g = d.grade || "I";
        const pts = GRADE_POINTS[g] || 0;
        if (counts[g] != null) counts[g] += 1;
        total += pts;
        rows.push({ id: d.id, title: d.title, grade: g, points: pts, y: d.y });
      });
      const lengthYd = Math.max(0.01, lengthM * 1.0936133);
      const widthYd = Math.max(0.01, (widthCm / 100) * 1.0936133);
      const areaSqYd = lengthYd * widthYd;
      const per100Sq = (total / areaSqYd) * 100;
      const per100 = (total / lengthYd) * 100;
      const threshold = 40;
      return {
        total,
        per100Sq,
        per100,
        counts,
        rows,
        threshold,
        isNg: per100Sq > threshold,
      };
    }

      if (!host || !host.isOpen(key)) return;

      else {
        host.refresh([key]);

          requestAnimationFrame(() => host._initTool(key));
        }
      }
    }

    function pushHistorySample(force) {
      const now = Date.now() / 1000;
      const last = state.history[state.history.length - 1];
      if (!force && last && now - last.t < 0.35) return;
      state.history.push({
        t: now,
        lengthM: state.lengthM,
        widthCm: state.widthCm,
        speed: state.speed,
        colorDiff: state.colorDiff,
        tension: state.tension,
        weightKg: state.weightKg
      });
      if (state.history.length > HISTORY_MAX) {
        state.history.splice(0, state.history.length - HISTORY_MAX);
      }
    }

      const t0 = Date.now() / 1000 - 40;

        const u = i / 39;
        state.history.push({
          t: t0 + i,
          lengthM: 8 + u * 4.5 + Math.sin(i / 3) * 0.15,
          widthCm: 149.2 + Math.sin(i / 5) * 1.2,
          speed: 40 + Math.sin(i / 4) * 3.5,
          colorDiff: 0.35 + Math.abs(Math.sin(i / 6)) * 0.2,
          tension: 30 + Math.sin(i / 3.5) * 4,
          weightKg: 18.2 + u * 0.4
        });
      }
      const last = state.history[state.history.length - 1];
      state.lengthM = last.lengthM;
      state.widthCm = last.widthCm;
      state.speed = last.speed;
      state.colorDiff = last.colorDiff;
      state.tension = last.tension;
    })();

        fpResult.classList.toggle("fp-ng", !!fp.isNg);

      updateDeviceChips();
    }

            showToast(state.lang === "zh-CN" ? "请为每个 ROI 选择标签" : "Label every ROI");
            return;
          }
          state.artificalConfirm = "finish";
          state.artificalConfirmId = null;
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-confirm-cancel") {
          state.artificalConfirm = null;
          state.artificalConfirmId = null;
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-confirm-ok") {
          const kind = state.artificalConfirm;
          const cid = state.artificalConfirmId;
          state.artificalConfirm = null;
          state.artificalConfirmId = null;
          if (kind === "clear") {
            state.artificalRois = [];
            state.artificalRoiId = null;
            refreshOpenTool(host, "artificalAddDefect");
            showToast(state.lang === "zh-CN" ? "已清空" : "Cleared");
            return;
          }
          if (kind === "delete") {
            state.artificalRois = state.artificalRois.filter((r) => r.id !== cid);
            if (state.artificalRoiId === cid) state.artificalRoiId = null;
            refreshOpenTool(host, "artificalAddDefect");
            showToast(state.lang === "zh-CN" ? `已删除 ROI-${cid}` : `Deleted ROI-${cid}`);
            return;
          }
          if (kind === "ticket") {
            const roi = state.artificalRois.find((r) => r.id === cid);
            const x = roi ? Number(roi.x).toFixed(0) : "?";
            refreshOpenTool(host, "artificalAddDefect");
            showToast(state.lang === "zh-CN" ? `贴标已触发，X=${x}` : `Labeling triggered, X=${x}`);
            return;
          }
          if (kind === "finish") {
            // 预览：把漏检写入疵点列表
            state.artificalRois.forEach((r) => {
              const nextId = DEFECTS.reduce((m, d) => Math.max(m, d.id), 0) + 1;
              DEFECTS.push({
                id: nextId,
                title: r.label || "Manual",
                grade: "II",
                y: Math.max(0, state.lengthM),
                x: Math.min(1, Math.max(0, (Number(r.x) || 0) / 1200)),
              });
              state.selectedId = nextId;
            });
            const n = state.artificalRois.length;
            state.artificalRois = [];
            state.artificalRoiId = null;
            renderDefects();
            renderMetrics();
            showToast(state.lang === "zh-CN" ? `已保存 ${n} 个漏检` : `Saved ${n} defects`);
            host.close();
            return;
          }
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }

        // ── artifical_edit_defect ──
        if (act === "edit-select") {
          const id = host._pendingEditId != null ? host._pendingEditId
            : (actEl && Number(actEl.getAttribute("data-id")));
          host._pendingEditId = null;
          if (!Number.isFinite(id)) return;
          state.editSelectedId = id;
          state.selectedId = id;
          refreshOpenTool(host, "artificalEditDefect");
          return;
        }
        if (act === "edit-save") {
          const id = state.editSelectedId != null ? state.editSelectedId : state.selectedId;
          const d = DEFECTS.find((x) => x.id === id);
          if (!d) {
            showToast(state.lang === "zh-CN" ? "未选择疵点" : "No defect selected");
            return;
          }
          const typeEl = document.getElementById("spxEditType");
          const xEl = document.getElementById("spxEditX");
          const yEl = document.getElementById("spxEditY");
          const lenEl = document.getElementById("spxEditLen");
          const widEl = document.getElementById("spxEditWid");
          if (typeEl) d.title = typeEl.value || d.title;
          const widthMm = Math.max(200, Number(state.widthCm || 150) * 10);
          if (xEl) {
            const xmm = Math.max(0, Number(xEl.value) || 0);
            d.xMm = xmm;
            d.x = Math.min(1, xmm / widthMm);
          }
          if (yEl) {
            const ymm = Math.max(0, Number(yEl.value) || 0);
            d.yMm = ymm;
            d.y = ymm / 1000;
          }
          if (lenEl) d.lengthMm = Math.max(0, Number(lenEl.value) || 0);
          if (widEl) d.widthMm = Math.max(0, Number(widEl.value) || 0);
          d.areaMm2 = (d.lengthMm || 0) * (d.widthMm || 0);
          renderDefects();
          renderMetrics();
          refreshOpenTool(host, "artificalEditDefect");
          showToast(state.lang === "zh-CN" ? "已保存" : "Saved");
          return;
        }
        if (act === "edit-delete") {
          state.editConfirm = "delete";
          refreshOpenTool(host, "artificalEditDefect");
          return;
        }
        if (act === "edit-finish") {
          state.editConfirm = "finish";
          refreshOpenTool(host, "artificalEditDefect");
          return;
        }
        if (act === "edit-confirm-cancel") {
          state.editConfirm = null;
          refreshOpenTool(host, "artificalEditDefect");
          return;
        }
        if (act === "edit-confirm-ok") {
          const kind = state.editConfirm;
          state.editConfirm = null;
          if (kind === "delete") {
            const id = state.editSelectedId != null ? state.editSelectedId : state.selectedId;
            const idx = DEFECTS.findIndex((x) => x.id === id);
            if (idx >= 0) DEFECTS.splice(idx, 1);
            state.editSelectedId = DEFECTS[0] ? DEFECTS[0].id : null;
            state.selectedId = state.editSelectedId;
            renderDefects();
            renderMetrics();
            if (!DEFECTS.length) {
              showToast(state.lang === "zh-CN" ? "已删除，列表为空" : "Deleted — list empty");
              host.close();
              return;
            }
            refreshOpenTool(host, "artificalEditDefect");
            showToast(state.lang === "zh-CN" ? "已删除" : "Deleted");
            return;
          }
          if (kind === "finish") {
            showToast(state.lang === "zh-CN" ? "编辑完成" : "Edit finished");
            host.close();
            return;
          }
          refreshOpenTool(host, "artificalEditDefect");
          return;
        }

        // ── artifical_add_width ──
        if (act === "width-reset") {
          if (host._toolApi && typeof host._toolApi.reset === "function") host._toolApi.reset();
          showToast(state.lang === "zh-CN" ? "已重测" : "Reset");
          return;
        }
        if (act === "width-save") {
          try {
            const m = (host._toolApi && typeof host._toolApi.save === "function")
              ? await host._toolApi.save()
              : (host._toolApi && host._toolApi.measure ? host._toolApi.measure() : state.netWidth);
            if (!m || m.width == null) {
              showToast(state.lang === "zh-CN" ? "请先标定左右布边" : "Place both edges first");
              return;
            }
            state.netWidth = Object.assign({}, state.netWidth, m, { last: m.width });
            state.widthCm = Number(m.width) || state.widthCm;
            renderMetrics();
            showToast(state.lang === "zh-CN"
              ? `净幅宽 ${Number(m.width).toFixed(1)} cm`
              : `Net width ${Number(m.width).toFixed(1)} cm`);
            host.close();
          } catch (e) {
            showToast((e && e.message) || String(e));
          }
          return;
        }

        // ── DetectionRecords ──
        if (act === "rec-filter") {
          const f = actEl ? Number(actEl.getAttribute("data-filter")) : 0;
          state.recordsUi.filter = Number.isFinite(f) ? f : 0;
          state.recordsUi.page = 1;
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-query-type") {
          const sel = document.getElementById("popRecQueryType");
          state.recordsUi.queryType = sel ? Number(sel.value) || 0 : 0;
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-search") {
          const v = document.getElementById("popRecQueryValue");
          const d1 = document.getElementById("popRecDate");
          const d2 = document.getElementById("popRecDate2");
          const qt = document.getElementById("popRecQueryType");
          if (qt) state.recordsUi.queryType = Number(qt.value) || 0;
          if (v) state.recordsUi.queryValue = v.value || "";
          if (d1) state.recordsUi.queryDate = d1.value || "";
          if (d2) state.recordsUi.queryDate2 = d2.value || "";
          state.recordsUi.page = 1;
          refreshOpenTool(host, "records");
          showToast(state.lang === "zh-CN" ? "已查询" : "Searched");
          return;
        }
        if (act === "rec-page") {
          const p = actEl ? Number(actEl.getAttribute("data-page")) : 1;
          state.recordsUi.page = Math.max(1, p || 1);
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-jump") {
          const inp = document.getElementById("popRecJump");
          state.recordsUi.page = Math.max(1, Number(inp && inp.value) || 1);
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-export") {
          showToast(state.lang === "zh-CN" ? "导出数据（预览）" : "Export (preview)");
          return;
        }
        if (act === "rec-total-len") {
          state.recordsUi.totalLengthM = state.todayM;
          refreshOpenTool(host, "records");
          showToast(
            state.lang === "zh-CN"
              ? `检验长度 ${state.todayM.toFixed(0)} m`
              : `Length ${state.todayM.toFixed(0)} m`
          );
          return;
        }
        if (act === "rec-order") {
          const finished = actEl && actEl.getAttribute("data-finished") === "1";
          showToast(
            finished
              ? (state.lang === "zh-CN" ? "查看报告" : "Open report")
              : (state.lang === "zh-CN" ? "检验此单" : "Inspect sheet")
          );
          return;
        }
        if (act === "rec-checkid") {
          showToast((state.lang === "zh-CN" ? "误检统计 · " : "Mistake stats · ") + (actEl ? actEl.textContent : ""));
          return;
        }
        if (act === "rec-print") {
          showToast(state.lang === "zh-CN" ? "打印标签（预览）" : "Print label (preview)");
          return;
        }

        showToast(act);
      },
    });

    document.querySelectorAll("[data-popup]").forEach((el) => {
      el.addEventListener("click", () => {
        popupHost.open(el.getAttribute("data-popup"), el);
      });
    });

    $("btnDefectAdd").addEventListener("click", () => {
      // 对齐 DefectList::on_ButtonAddClicked → artifical_add_defect（SPX）
      popupHost.open("artificalAddDefect", $("btnDefectAdd"));
    });
    $("btnDefectEdit").addEventListener("click", () => {
      if (!DEFECTS.find((d) => d.id === state.selectedId)) {
        showToast(state.lang === "zh-CN" ? "请先选择疵点" : "Select a defect first");
        return;
      }
      // 对齐 DefectList 编辑 → artifical_edit_defect（SPX）
      state.editSelectedId = state.selectedId;
      state.editConfirm = null;
      popupHost.open("artificalEditDefect", $("btnDefectEdit"));
    });

    $("btnRun").addEventListener("click", () => {
      state.running = !state.running;
      updateRunBtn();
      showToast(state.running ? t("start") : t("pause"));
    });

    $("lang").addEventListener("change", (e) => {
      state.lang = e.target.value;
      applyI18n();
      if (popupHost.activeKey) popupHost.open(popupHost.activeKey, popupHost.triggerEl);
    });

    $("btnExit").addEventListener("click", () => showToast(t("exit")));

    window.addEventListener("resize", () => {
      if (popupHost.activeKey) popupHost.open(popupHost.activeKey, popupHost.triggerEl);
    });

    tickClock();
    setInterval(tickClock, 1000);
    applyI18n();
    renderMetrics();
    renderDefects();
    setInterval(demoTick, 400);
  </script>
</body>
</html>
