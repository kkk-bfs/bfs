<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CustomUIV3 · SpaceX Ops</title>
  <!-- 与运行端共用同一套设计令牌/弹窗样式；主界面覆盖样式见下方内联块 -->
  <link rel="stylesheet" href="./spacex-theme.css" />
  <style>
    :root {
      /* Ops Console：长时盯屏 — 深炭灰 + 柔对比 + 冷静蓝 */
      --space-black: #0b0e12;
      --spectral: #c9d0dc;
      --muted: #8b93a7;
      --ghost-surface: rgba(201, 208, 220, 0.06);
      --ghost-border: rgba(201, 208, 220, 0.16);
      --ghost-border-strong: rgba(201, 208, 220, 0.28);
      --panel-border: #2a3140;
      --overlay: rgba(11, 14, 18, 0.55);
      --hud-panel: rgba(14, 18, 26, 0.88);
      --hud-panel-hover: rgba(91, 140, 255, 0.12);
      --accent: #5b8cff;
      --accent-soft: rgba(91, 140, 255, 0.18);
      --ok: #3ddc97;
      --warn: #e0b84a;
      --bad: #e85a5c;
      --progress-track: rgba(201, 208, 220, 0.14);
      --progress-fill: #5b8cff;
      /* 系统字体 + 统一字号阶梯 */
      --font: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --font-mono: "Cascadia Mono", "Consolas", "Segoe UI", monospace;
      --fs-xs: 12px;
      --fs-sm: 13px;
      --fs-md: 14px;
      --fs-lg: 15px;
      --fs-xl: 16px;
      --fs-brand: 17px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--space-black);
      color: var(--spectral);
      font-family: var(--font);
      font-size: var(--fs-sm);
      font-weight: 400;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font-family: inherit; letter-spacing: 0; }
    button { cursor: pointer; }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 640px;
      background: var(--space-black);
      overflow: hidden;
    }

    .app.RealTimeDetectionV3 {
      flex-direction: column;
    }

    .app.RealTimeDetectionV3 #SpxStage {
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Header (stage overlay) ── */
    .header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      max-height: 64px;
      padding: 8px 12px;
      background: rgba(14, 18, 26, 0.92);
      border-bottom: 1px solid var(--panel-border);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      pointer-events: auto;
    }

    .minimal-mode #SpxHeaderBar.header {
      background: transparent;
      border-bottom-color: rgba(201, 208, 220, 0.1);
      min-height: 36px;
      max-height: 44px;
      padding: 4px 8px;
      gap: 6px;
    }

    .minimal-mode #SpxHeaderBar .logo { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .minimal-mode #SpxHeaderBar .mono { font-size: 11px; }
    .minimal-mode #SpxHeaderBar .lang-select { display: none; }
    /* 对齐 SpxHeaderBar compact：chip 仅圆点+数值 */
    .minimal-mode #SpxHeaderBar .device-chip {
      max-height: 28px;
      padding: 2px 8px 2px 6px;
      gap: 4px;
      background: rgba(201, 208, 220, 0.04);
    }
    .minimal-mode #SpxHeaderBar .device-chip .label { display: none; }
    .minimal-mode #SpxHeaderBar .device-chip .value { font-size: 11px; min-width: 0; }
    /* 右栏：登录/设置/关于/退出全部保留为 32×28 图标钮（对齐 Qt applyRightButtonIcons） */
    .minimal-mode #SpxHeaderBar .header-right .ghost-btn {
      width: 32px;
      min-width: 32px;
      max-width: 32px;
      min-height: 28px;
      max-height: 28px;
      padding: 0;
      font-size: 0;
      line-height: 0;
      position: relative;
    }
    .minimal-mode #SpxHeaderBar .header-right .ghost-btn::before {
      font-size: 13px;
      line-height: 28px;
      color: rgba(220, 226, 236, 0.92);
    }
    .minimal-mode #SpxHeaderBar .header-right .ghost-btn[data-popup="login"]::before { content: "👤"; }
    .minimal-mode #SpxHeaderBar .header-right .ghost-btn[data-popup="systemSettings"]::before { content: "⚙"; }
    .minimal-mode #SpxHeaderBar .header-right .ghost-btn[data-popup="about"]::before { content: "ⓘ"; }
    .minimal-mode #SpxHeaderBar .header-right #btnExit::before { content: "✕"; }

    .header-left,
    .header-center,
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .header-left { gap: 12px; }
    .header-center { justify-content: center; flex-wrap: wrap; }
    .header-right { justify-content: flex-end; flex-wrap: wrap; }

    .logo {
      font-family: var(--font);
      font-size: var(--fs-brand);
      font-weight: 700;
      letter-spacing: 0;
      color: var(--spectral);
    }

    .mono {
      font-family: var(--font-mono);
      font-size: var(--fs-sm);
      letter-spacing: 0;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .device-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px 6px 10px;
      background: var(--ghost-surface);
      border: 1px solid var(--ghost-border);
      border-radius: 4px;
      transition: background 160ms ease;
      max-width: 220px;
    }

    .device-chip:hover { background: rgba(201, 208, 220, 0.16); }

    .device-chip .value {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(201, 208, 220, 0.35);
      background: #6b6b75;
      flex-shrink: 0;
    }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--bad); }

    .light-mode-ico {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      display: inline-block;
      background-repeat: no-repeat;
      background-position: center;
      background-size: 14px 14px;
    }
    .light-mode-ico[data-auto="0"] {
      background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 14' fill='none'%3E%3Ccircle cx='7' cy='7' r='2.2' stroke='%238B93A7' stroke-width='1.35'/%3E%3Cg stroke='%238B93A7' stroke-width='1.35' stroke-linecap='round'%3E%3Cpath d='M7 3.6V2M7 12v-1.6M10.4 7H12M2 7h1.6M9.4 9.4l1.13 1.13M3.47 3.47L4.6 4.6M9.4 4.6l1.13-1.13M3.47 10.53L4.6 9.4'/%3E%3C/g%3E%3C/svg%3E");
    }
    .light-mode-ico[data-auto="1"] {
      background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 14' fill='none'%3E%3Ccircle cx='7' cy='7' r='2.2' stroke='%233DDC97' stroke-width='1.35'/%3E%3Cg stroke='%233DDC97' stroke-width='1.35' stroke-linecap='round'%3E%3Cpath d='M7 3.6V2M7 12v-1.6M10.4 7H12M2 7h1.6M9.4 9.4l1.13 1.13M3.47 3.47L4.6 4.6M9.4 4.6l1.13-1.13M3.47 10.53L4.6 9.4'/%3E%3C/g%3E%3C/svg%3E");
    }

    .label {
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      color: var(--muted);
    }

    .value {
      font-family: var(--font-mono);
      font-size: var(--fs-md);
      font-weight: 600;
      letter-spacing: 0;
      color: var(--spectral);
      font-variant-numeric: tabular-nums;
    }

    .lang-select,
    .ghost-btn,
    .run-btn {
      background: var(--ghost-surface);
      color: var(--spectral);
      border: 1px solid var(--ghost-border);
      border-radius: 8px;
      padding: 8px 16px;
      font-family: var(--font);
      font-size: var(--fs-sm);
      font-weight: 600;
      letter-spacing: 0;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .lang-select {
      border-radius: 4px;
      min-width: 120px;
      min-height: 36px;
      appearance: none;
      padding-right: 28px;
      background-image: linear-gradient(45deg, transparent 50%, var(--spectral) 50%),
        linear-gradient(135deg, var(--spectral) 50%, transparent 50%);
      background-position: calc(100% - 14px) 55%, calc(100% - 10px) 55%;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
    }

    .ghost-btn:hover,
    .lang-select:hover { background-color: rgba(201, 208, 220, 0.16); }

    .ghost-btn:active { background-color: rgba(201, 208, 220, 0.22); }

    /* ── Stage ── */
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: var(--space-black);
    }

    .fabric {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(11,14,18,0.45) 0%, transparent 18%, transparent 55%, rgba(11,14,18,0.58) 100%),
        repeating-linear-gradient(
          90deg,
          #161a22 0px,
          #161a22 18px,
          #12161c 18px,
          #12161c 36px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(201, 208, 220, 0.03) 0px,
          rgba(201, 208, 220, 0.03) 1px,
          transparent 1px,
          transparent 28px
        );
      background-size: auto, 36px 100%, 100% 28px;
      animation: fabric-scroll 18s linear infinite;
    }

    .fabric.paused { animation-play-state: paused; }
    .fabric.vf-no-image {
      background: rgba(11, 14, 18, 0.88);
      animation-play-state: paused;
    }
    .fabric.vf-fit-height {
      background-size: auto, 36px 100%, 100% 28px;
      background-position: 0 0, 50% 0, 0 0;
    }

    .fabric-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .fabric-label-line {
      border-top: 2px solid rgba(61, 220, 151, 0.85);
      top: 42%;
      bottom: auto;
      height: 0;
      opacity: 0.9;
    }
    .fabric-cloth-edge::before,
    .fabric-cloth-edge::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(255, 77, 79, 0.75);
    }
    .fabric-cloth-edge::before { left: 18%; }
    .fabric-cloth-edge::after { right: 18%; }
    .fabric-grid {
      background:
        repeating-linear-gradient(90deg, rgba(201,208,220,0.08) 0 1px, transparent 1px 48px),
        repeating-linear-gradient(0deg, rgba(201,208,220,0.08) 0 1px, transparent 1px 48px);
      opacity: 0.55;
    }
    .fabric-frame-border {
      box-shadow: inset 0 0 0 2px rgba(91, 140, 255, 0.45), inset 0 0 0 6px rgba(0, 0, 0, 0.2);
    }

    #stageMarks, #stageDetectionResults {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }
    #stageDetectionResults .detection-box {
      position: absolute;
      border: 1px solid rgba(64, 169, 255, 0.65);
      background: rgba(64, 169, 255, 0.08);
      transform: translate(-50%, -50%);
    }
    .defect-mark .defect-info {
      position: absolute;
      left: 100%;
      top: -2px;
      margin-left: 4px;
      padding: 1px 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--spectral);
      white-space: nowrap;
      background: rgba(14, 18, 26, 0.82);
      border: 1px solid var(--ghost-border);
      border-radius: 3px;
    }

    @keyframes fabric-scroll {
      from { background-position: 0 0, 0 0, 0 0; }
      to { background-position: 0 0, 0 0, 0 560px; }
    }

    .fabric-placeholder {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 2px;
      text-transform: none;
      color: rgba(201, 208, 220, 0.35);
      font-size: 14px;
      pointer-events: none;
    }

  #stageMarks {
    pointer-events: none;
  }
  #stageMarks .defect-mark {
    pointer-events: auto;
  }

    .defect-mark {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 1px solid rgba(232, 90, 92, 0.9);
      background: rgba(232, 90, 92, 0.25);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
      /* 长时盯屏：疵点标记不做无限缩放闪烁 */
    }

    .defect-mark.selected {
      border-color: var(--accent);
      background: rgba(91, 140, 255, 0.28);
      box-shadow: 0 0 0 1px rgba(91, 140, 255, 0.35);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.92; }
    }

    .hud-panel {
      position: absolute;
      left: 0;
      top: 0;
      width: 240px;
      height: 240px;
      background: var(--hud-panel);
      border: 1px solid var(--panel-border);
      border-radius: 5px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10;
      overflow: hidden;
      pointer-events: auto;
    }

    .hud-panel.map { /* x/y/w/h via layoutStageOverlays */ }
    .hud-panel.list { /* x/y/w/h via layoutStageOverlays */ }

    .minimal-mode #SpxDefectMapHud.compact {
      background: rgba(8, 10, 14, 0.35);
      border-color: rgba(201, 208, 220, 0.16);
      padding: 4px 2px;
    }
    .minimal-mode #SpxDefectMapHud.compact .label,
    .minimal-mode #SpxDefectMapHud.compact #mapMeta,
    .minimal-mode #SpxDefectMapHud.compact .map-canvas {
      opacity: 0;
      height: 0;
      margin: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .minimal-mode #SpxDefectListHud.compact {
      background: rgba(10, 12, 18, 0.72);
      border-color: rgba(201, 208, 220, 0.28);
    }
    .minimal-mode #SpxDefectListHud.compact .list-actions .ghost-btn {
      min-width: 28px;
      max-width: 28px;
      padding: 0;
      font-size: 0;
    }
    .minimal-mode #SpxDefectListHud.compact .list-actions .ghost-btn::after {
      font-size: 11px;
      content: "+";
    }
    .minimal-mode #SpxDefectListHud.compact .list-actions #btnDefectEdit::after { content: "✎"; }

    .hud-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .list-actions {
      display: flex;
      gap: 6px;
    }

    .list-actions .ghost-btn {
      flex: 1;
      padding: 6px 10px;
      border-radius: 4px;
      min-height: 32px;
      font-size: 12px;
      letter-spacing: 0;
    }

    .map-canvas {
      flex: 1;
      min-height: 120px;
      margin-top: 4px;
      border: 1px solid rgba(201, 208, 220, 0.18);
      background: rgba(0, 0, 0, 0.12);
      position: relative;
      overflow: hidden;
    }

    .map-point {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--bad);
      border: 1px solid rgba(201, 208, 220, 0.5);
      transform: translate(-50%, -50%);
    }

    .map-point.selected { background: var(--warn); }

    .map-label-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 0;
      border-top: 1.5px dashed rgba(91, 140, 255, 0.9);
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 2;
    }

    .defect-list {
      list-style: none;
      flex: 1;
      overflow: auto;
      margin-top: 4px;
    }

    .defect-list li {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(201, 208, 220, 0.08);
      letter-spacing: 0;
      cursor: pointer;
      transition: background 140ms ease;
    }

    .defect-list li:hover,
    .defect-list li.active { background: var(--hud-panel-hover); }

    .defect-list .d-compact { display: none; }
    /* 全屏极简：列表收成「名称 - 码长」单行（对齐 SpxDefectListHud compact） */
    .minimal-mode #SpxDefectListHud .defect-list li {
      padding: 5px 6px;
      font-size: 11px;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .minimal-mode #SpxDefectListHud .defect-list li .d-title,
    .minimal-mode #SpxDefectListHud .defect-list li .d-meta,
    .minimal-mode #SpxDefectListHud .defect-list li br { display: none; }
    .minimal-mode #SpxDefectListHud .defect-list li .d-compact {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 全屏极简不展示 slot_show 演示按钮 */
    .minimal-mode .demo-show { display: none !important; }

    .defect-list::-webkit-scrollbar { width: 6px; }
    .defect-list::-webkit-scrollbar-thumb {
      background: rgba(201, 208, 220, 0.22);
      border-radius: 3px;
    }

    /* ── Bottom HUD (stage overlay) ── */
    .bottom {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between; /* 中间定宽后，剩余 33% 留在两侧空隙 */
      gap: 8px;
      min-height: 110px;
      max-height: 128px;
      padding: 4px 8px;
      background: rgba(14, 18, 26, 0.92);
      border-top: 1px solid var(--panel-border);
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      pointer-events: auto;
      box-sizing: border-box;
    }

    .minimal-mode #SpxBottomHud.bottom {
      background: transparent;
      border-top-color: rgba(201, 208, 220, 0.1);
      min-height: 75px;
      max-height: 75px;
      gap: 8px;
      padding: 2px 6px;
      align-items: flex-end;
      justify-content: flex-start; /* 紧凑：左|中(拉伸)|右，无 33% 留白 */
    }
    /* 全屏极简：对齐 SpxBottomHud 紧凑常量
       码表 24 · 左右 chip 28 · 操作钮 40 · 进度 3 · 栏高 75 */
    .minimal-mode #SpxBottomHud .meter {
      min-height: 24px;
      max-height: 24px;
      padding: 0 4px;
      gap: 2px;
      flex-direction: row;
      align-items: center;
    }
    .minimal-mode #SpxBottomHud .side-col {
      align-self: flex-end;
      justify-content: flex-end;
    }
    .minimal-mode #SpxBottomHud .side-col .side-grid {
      grid-template-columns: repeat(auto-fit, minmax(0, auto));
      grid-template-rows: auto;
      grid-auto-flow: column;
      align-content: end;
      gap: 4px;
      height: auto;
    }
    /* 左：隐藏颜色/布料/四分（对齐 Qt keep=检验单·缸·卷·毛·净） */
    .minimal-mode #SpxBottomHud .side-left .chip:has(#fabricColor),
    .minimal-mode #SpxBottomHud .side-left .chip:has(#fabricName),
    .minimal-mode #SpxBottomHud .side-left .chip-fp {
      display: none !important;
    }
    .minimal-mode #SpxBottomHud .side-col .chip {
      min-height: 28px;
      max-height: 28px;
      height: 28px;
      padding: 2px 6px;
      flex-direction: row;
      width: auto;
      min-width: 0;
    }
    .minimal-mode #SpxBottomHud .meter .label,
    .minimal-mode #SpxBottomHud .side-col .chip .label { display: none; }
    /* 右：疵点/记录/放卷 → 28px 图标；CPU/GPU 数值；报警保留标题 */
    .minimal-mode #SpxBottomHud .side-right .side-grid {
      direction: ltr;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      width: 100%;
    }
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="defectSettings"],
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="records"],
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="unwind"] {
      width: 28px;
      min-width: 28px;
      max-width: 28px;
      padding: 0;
      font-size: 0;
      position: relative;
    }
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="defectSettings"] .chip-value,
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="records"] .chip-value,
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="unwind"] .chip-value {
      display: none;
    }
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="defectSettings"]::before,
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="records"]::before,
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="unwind"]::before {
      font-size: 13px;
      line-height: 28px;
      color: rgba(220, 226, 236, 0.92);
    }
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="defectSettings"]::before { content: "✦"; }
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="records"]::before { content: "☰"; }
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="unwind"]::before { content: "↻"; }
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="cpu"],
    .minimal-mode #SpxBottomHud .side-right .chip[data-popup="gpu"] {
      min-width: 48px;
      width: auto;
      flex: 0 0 auto;
    }
    .minimal-mode #SpxBottomHud .alarm-chip {
      min-height: 28px;
      max-height: 28px;
      height: 28px;
      padding: 2px 8px;
      flex: 1 1 auto;
      min-width: 96px;
    }
    .minimal-mode #SpxBottomHud .alarm-chip .label { display: inline; font-size: 11px; }
    .minimal-mode #SpxBottomHud .chip-value,
    .minimal-mode #SpxBottomHud .meter-value { font-size: 12px; }
    .minimal-mode #SpxBottomHud .run-btn,
    .minimal-mode #SpxBottomHud .ghost-btn.act-new,
    .minimal-mode #SpxBottomHud .ghost-btn.act-finish {
      min-height: 40px;
      max-height: 40px;
      padding: 4px 12px;
    }
    .minimal-mode #SpxBottomHud .ghost-btn.act-new,
    .minimal-mode #SpxBottomHud .ghost-btn.act-finish { min-width: 108px; }
    .minimal-mode #SpxBottomHud .run-btn { min-width: 216px; }
    .minimal-mode #SpxBottomHud .progress-wrap { height: 3px; }
    .minimal-mode #SpxBottomHud .progress-text { display: none; }
    .minimal-mode #SpxBottomHud .center-col {
      gap: 2px;
      align-self: flex-start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .minimal-mode #SpxBottomHud .action-row { gap: 6px; }
    .minimal-mode #SpxBottomHud .meter-row { gap: 10px; }

    #SpxViewToggleBar {
      position: absolute;
      z-index: 16;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      height: 42px;
      background: rgba(14, 18, 26, 0.9);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      pointer-events: auto;
    }
    #SpxViewToggleBar.compact {
      background: transparent;
      border-color: rgba(201, 208, 220, 0.12);
    }
    #SpxViewToggleBar .spx-vbtn {
      width: 34px;
      height: 34px;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid rgba(201, 208, 220, 0.14);
      background: rgba(201, 208, 220, 0.05);
      color: rgba(240, 240, 250, 0.88);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    #SpxViewToggleBar.compact .spx-vbtn {
      background: transparent;
      border-color: rgba(201, 208, 220, 0.18);
    }
    #SpxViewToggleBar .spx-vbtn:hover { background: rgba(201, 208, 220, 0.1); }
    #SpxViewToggleBar .spx-vbtn:checked,
    #SpxViewToggleBar .spx-vbtn[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: rgba(91, 140, 255, 0.5);
    }
    #SpxViewToggleBar .spx-vbtn svg { width: 20px; height: 20px; display: block; }
    #SpxViewToggleBar .spx-vsep {
      width: 1px;
      height: 22px;
      background: var(--panel-border);
      flex: 0 0 auto;
      margin: 0 2px;
    }
    #SpxViewToggleBar.compact .spx-vsep { background: rgba(201, 208, 220, 0.18); }

    #SpxFpsHud, #SpxCoordHud {
      position: absolute;
      z-index: 16;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 28px;
      padding: 4px 10px;
      background: rgba(14, 18, 26, 0.85);
      border: 1px solid var(--ghost-border);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      white-space: pre;
    }
    #SpxFpsHud { color: rgba(61, 220, 151, 0.85); justify-content: flex-end; }
    #SpxCoordHud { color: var(--muted); justify-content: flex-start; min-width: 220px; }

    #SpxRunDirectionHud {
      position: absolute;
      z-index: 14;
      width: 48px;
      height: 56px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #SpxRunDirectionHud svg { width: 32px; height: 40px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35)); }
    #SpxRunDirectionHud.forward svg { color: rgba(61, 220, 151, 0.9); }
    #SpxRunDirectionHud.reverse svg { color: rgba(255, 77, 79, 0.9); }
    #SpxRunDirectionHud.dim svg { opacity: 0.55; }
    .minimal-mode #SpxRunDirectionHud { display: none !important; }

    .side-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
      align-self: center;
      flex: 0 0 auto;
      min-width: 0;
      height: auto;
      max-height: 100%;
      box-sizing: border-box;
    }

    /* 左右统一 4 列 × 2 行，总体宽度一致 */
    .side-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(2, auto);
      grid-auto-flow: column;
      align-content: center;
      gap: 4px;
      width: 100%;
      height: auto;
      min-height: 0;
    }

    .side-col.side-left .side-grid {
      direction: ltr;
      width: 100%;
    }

    /* 右栏靠右：RTL 最右列先排；视觉从左到右仍为 放卷/报警(跨2) | CPU/GPU | 疵点/记录 */
    .side-col.side-right {
      justify-content: center;
      align-items: stretch;
    }
    .side-col.side-right .side-grid {
      direction: rtl;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-flow: dense;
      justify-content: end;
      width: 100%;
    }

    .side-col.side-right .chip {
      direction: ltr;
    }
    /* RTL 下 column 1 = 屏幕最右侧 */
    .side-col.side-right .chip[data-popup="defectSettings"] { grid-column: 1; grid-row: 1; }
    .side-col.side-right .chip[data-popup="records"] { grid-column: 1; grid-row: 2; }
    .side-col.side-right .chip[data-popup="cpu"] { grid-column: 2; grid-row: 1; }
    .side-col.side-right .chip[data-popup="gpu"] { grid-column: 2; grid-row: 2; }
    .side-col.side-right .chip[data-popup="unwind"] { grid-column: 3 / span 2; grid-row: 1; }
    .side-col.side-right .chip.alarm-chip { grid-column: 3 / span 2; grid-row: 2; }

    .chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      box-sizing: border-box;
      min-width: 0;
      width: 100%;
      height: auto;
      min-height: 40px;
      padding: 4px 4px;
      background: var(--ghost-surface);
      border: 1px solid var(--ghost-border);
      border-radius: 4px;
      text-align: center;
      color: inherit;
      font: inherit;
      transition: background 160ms ease;
    }

    .chip:hover { background: rgba(201, 208, 220, 0.16); }

    .chip .label {
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.15;
      text-transform: none;
    }

    .chip .chip-value {
      font-family: var(--font-mono);
      font-size: var(--fs-md);
      font-weight: 600;
      letter-spacing: 0;
      color: var(--spectral);
      word-break: break-all;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .chip.span-2 { grid-row: 1 / -1; grid-column: span 2; }
    .chip.chip-fp {
      min-height: 40px;
      gap: 2px;
    }
    .chip-fp-vals {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
      font-family: var(--font-mono);
      font-size: var(--fs-md) !important;
      font-weight: 600;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .chip-fp-vals .fp-sep {
      color: var(--muted);
      font-weight: 600;
      margin: 0 1px;
    }
    .chip-fp-vals .fp-ok { color: var(--ok); }
    .chip-fp-vals .fp-ng { color: var(--bad); }
    /* 报警芯片：单行紧凑，避免 span-2 双行过高被中间晕影盖住 */
    .chip.alarm-chip {
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      text-align: left;
      padding: 4px 8px;
      min-height: 40px;
      max-height: 40px;
      min-width: 0;
      overflow: hidden;
    }
    .chip.alarm-chip .label {
      flex: 0 0 auto;
      text-align: left;
      transform: none;
      font-size: var(--fs-xs);
      opacity: 0.85;
    }
    .chip.alarm-chip .chip-value {
      flex: 1 1 auto;
      min-width: 0;
      font-family: var(--font);
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      word-break: normal;
      line-height: 1.2;
    }
    .chip.alarm-chip.active {
      border-color: rgba(232, 90, 92, 0.65);
      background: rgba(232, 90, 92, 0.12);
    }
    .chip.alarm-chip.active .chip-value {
      color: #E85A5C;
    }
    .alarm-ticker-viewport {
      display: block;
      overflow: hidden;
      width: 100%;
      mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
    }
    .alarm-ticker-track {
      display: inline-block;
      padding-left: 100%;
      animation: spx-alarm-marquee 12s linear infinite;
    }
    .chip.alarm-chip:not(.active) .alarm-ticker-track {
      padding-left: 0;
      animation: none;
    }
    @keyframes spx-alarm-marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      align-self: center;
      gap: 3px;
      flex: 0 0 auto;
      min-width: 0;
      width: auto;
      height: auto;
      max-height: 100%;
      box-sizing: border-box;
    }

    .meter-row {
      display: flex;
      gap: 4px;
      justify-content: center;
      flex-wrap: nowrap;
      width: 100%;
    }

    /* 横排：标签 + 数值 + 单位，单行放大字号不抬高 */
    .meter {
      flex: 1 1 0;
      min-width: 0;
      max-width: 160px;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid var(--ghost-border);
      background: var(--ghost-surface);
      display: flex;
      flex-direction: row;
      align-items: baseline;
      justify-content: center;
      gap: 4px;
      color: inherit;
      font: inherit;
      white-space: nowrap;
    }

    .meter .label {
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1;
      flex-shrink: 0;
      text-transform: none;
    }

    .meter .meter-value {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
      line-height: 1;
      min-width: 0;
    }

    .meter .chip-value {
      font-family: var(--font-mono);
      font-size: var(--fs-xl);
      font-weight: 600;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      color: var(--spectral);
      line-height: 1;
    }

    .meter .meter-unit {
      font-size: var(--fs-xs);
      font-weight: 600;
      letter-spacing: 0;
      color: var(--muted);
      text-transform: none;
      flex-shrink: 0;
    }

    .action-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      width: 100%;
      flex-shrink: 0;
    }

    .action-row .ghost-btn,
    .action-row .run-btn {
      min-width: 108px;
      min-height: 40px;
      padding: 8px 16px;
      border-radius: 10px;
      font-family: var(--font);
      font-size: var(--fs-lg);
      font-weight: 600;
      letter-spacing: 0;
    }

    .action-row .run-btn,
    .action-row #btnRun {
      min-width: 216px;
    }

    /* 主操作语义色：新建 Accent / 启动绿·暂停黄 / 开始绿·结束红 */
    .action-row .act-new {
      background: rgba(91, 140, 255, 0.12);
      border-color: rgba(91, 140, 255, 0.4);
    }
    .action-row .act-new:hover {
      background: rgba(91, 140, 255, 0.2);
    }

    .action-row .act-finish {
      background: rgba(232, 90, 92, 0.14);
      border-color: rgba(232, 90, 92, 0.55);
      color: #f0a8a8;
    }
    .action-row .act-finish:hover {
      background: rgba(232, 90, 92, 0.24);
    }
    .action-row .act-finish.as-start {
      background: rgba(61, 220, 151, 0.12);
      border-color: rgba(61, 220, 151, 0.5);
      color: #8fe0bc;
    }
    .action-row .act-finish.as-start:hover {
      background: rgba(61, 220, 151, 0.22);
    }

    .run-btn {
      background: rgba(61, 220, 151, 0.12);
      border: 1px solid rgba(61, 220, 151, 0.5);
      color: #8fe0bc;
      font-family: var(--font);
      font-size: var(--fs-lg);
      font-weight: 600;
      letter-spacing: 0;
    }

    .run-btn:hover { background: rgba(61, 220, 151, 0.22); }
    .run-btn:active { transform: translateY(1px) scale(0.99); }
    .run-btn.busy {
      background: rgba(61, 220, 151, 0.26);
      border-color: rgba(61, 220, 151, 0.8);
      pointer-events: none;
      animation: spx-act-pulse 180ms ease-out;
    }

    .run-btn.running {
      background: rgba(224, 184, 74, 0.14);
      border-color: rgba(224, 184, 74, 0.55);
      color: #e8d08a;
    }
    .run-btn.running:hover {
      background: rgba(224, 184, 74, 0.24);
    }
    .run-btn.running.busy {
      background: rgba(224, 184, 74, 0.28);
      border-color: rgba(224, 184, 74, 0.8);
      animation: spx-act-pulse 180ms ease-out;
    }

    .action-row .act-new:active,
    .action-row .act-finish:active {
      transform: translateY(1px) scale(0.99);
    }
    .action-row .act-new.busy,
    .action-row .act-finish.busy {
      filter: brightness(1.08);
      pointer-events: none;
      animation: spx-act-pulse 180ms ease-out;
    }
    @keyframes spx-act-pulse {
      0% { opacity: 1; transform: scale(1); }
      32% { opacity: 0.7; transform: scale(0.97); }
      100% { opacity: 1; transform: scale(1); }
    }
    .spx-click-fx {
      animation: spx-act-pulse 180ms ease-out;
    }
    .chip.spx-click-fx,
    .ghost-btn.spx-click-fx,
    .spx-vbtn.spx-click-fx {
      border-color: rgba(91, 140, 255, 0.65) !important;
      background-color: rgba(91, 140, 255, 0.16) !important;
    }

    .progress-wrap {
      width: 100%;
      height: 16px;
      border: 1px solid var(--ghost-border);
      border-radius: 4px;
      background: var(--progress-track);
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--progress-fill);
      border-radius: 3px;
      transition: width 280ms ease;
    }

    .progress-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--spectral);
      mix-blend-mode: difference;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(12px);
      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid var(--ghost-border-strong);
      border-radius: 4px;
      letter-spacing: 0;
      text-transform: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      z-index: 30;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1200px) {
      .header { padding: 6px 8px; gap: 6px; }
      .device-chip { padding: 5px 8px; gap: 6px; }
      .device-chip .value { font-size: 12px; }
      .ghost-btn, .lang-select { padding: 6px 12px; }
      .lang-select { min-width: 96px; }
      .meter { min-width: 64px; }
      .bottom {
        max-height: 120px;
      }
    }

    @media (max-width: 900px) {
      .header-right .ghost-btn:nth-child(n+3):nth-child(-n+4) { display: none; }
      .logo { font-size: var(--fs-lg); letter-spacing: 0; }
      .mono { font-size: var(--fs-xs); }
    }

    @media (prefers-reduced-motion: reduce) {
      .fabric, .defect-mark { animation: none !important; }
    }

    /* ── preview only ── */
.demo-show {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 8;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: min(920px, calc(100% - 24px));
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(201, 208, 220, 0.18);
      border-radius: 4px;
      pointer-events: auto;
    }
    .demo-show .demo-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0;
      text-transform: none;
      white-space: nowrap;
      margin-right: 2px;
    }
    .demo-show .ghost-btn {
      min-height: 28px;
      padding: 4px 8px;
      font-size: 12px;
      letter-spacing: 0;
    }

    /* ── log playback bar ── */
    .log-bar {
      position: absolute;
      z-index: 19;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      background: rgba(14, 18, 26, 0.92);
      border: 1px solid var(--ghost-border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--muted);
      pointer-events: auto;
      max-width: min(620px, calc(100% - 32px));
    }
    .log-bar[hidden] { display: none !important; }
    .log-bar .log-label { font-weight: 600; white-space: nowrap; }
    .log-bar select {
      min-width: 140px;
      max-width: 240px;
      background: var(--ghost-surface);
      color: var(--spectral);
      border: 1px solid var(--ghost-border);
      border-radius: 4px;
      padding: 5px 8px;
      font: inherit;
    }
    .log-bar .log-meta {
      font-family: var(--font-mono);
      color: var(--spectral);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .minimal-mode .log-bar { padding: 3px 6px; }

    </style>
</head>
<body>
  <div class="app RealTimeDetectionV3" id="app">
    <main class="stage" id="SpxStage">
      <div class="fabric" id="fabric"></div>
      <div class="fabric-placeholder" id="fabricHint">Fabric Live View</div>
      <div class="fabric-overlay fabric-label-line" id="fabricLabelLine" hidden></div>
      <div class="fabric-overlay fabric-cloth-edge" id="fabricClothEdge" hidden></div>
      <div class="fabric-overlay fabric-grid" id="fabricGrid" hidden></div>
      <div class="fabric-overlay fabric-frame-border" id="fabricFrameBorder" hidden></div>
      <div id="stageMarks"></div>
      <div id="stageDetectionResults" hidden></div>

      <aside class="hud-panel map" id="SpxDefectMapHud">
        <div class="label" id="mapTitle">Defect Map</div>
        <div class="mono" id="mapMeta">1.50 × 42.0 m  ·  5</div>
        <div class="map-canvas" id="mapCanvas"></div>
      </aside>

      <aside class="hud-panel list" id="SpxDefectListHud">
        <div class="hud-head">
          <span class="label" id="listTitle">Defect List</span>
          <span class="mono" id="listMeta">5</span>
        </div>
        <div class="list-actions">
          <button class="ghost-btn" type="button" id="btnDefectAdd" data-i18n="add_defect">新增</button>
          <button class="ghost-btn" type="button" id="btnDefectEdit" data-i18n="edit_defect">编辑</button>
        </div>
        <ul class="defect-list" id="defectList"></ul>
      </aside>

      <header class="header" id="SpxHeaderBar">
        <div class="header-left">
          <div class="logo">Bullmer</div>
          <div class="mono" id="clock">2026-11-19  22:16:00</div>
        </div>
        <div class="header-center">
          <button class="device-chip" type="button" data-popup="plc" title="x y ty">
            <span class="dot ok" id="plcDot"></span>
            <span class="label">PLC</span>
            <span class="value" id="plcVal">120 12400 100000</span>
          </button>
          <button class="device-chip" type="button" data-popup="camera" title="frames">
            <span class="dot ok" id="camDot"></span>
            <span class="label">Camera</span>
            <span class="value" id="camVal">1280</span>
          </button>
          <button class="device-chip" type="button" data-popup="light" title="auto / brightness">
            <span class="dot ok" id="lightDot"></span>
            <span class="label">Light</span>
            <span class="value" id="lightVal">180</span>
            <span class="light-mode-ico" id="lightModeIco" data-auto="1" aria-hidden="true"></span>
          </button>
          <button class="device-chip" type="button" data-popup="widthSensor" title="width · crop L/R">
            <span class="dot ok" id="widthSnsDot"></span>
            <span class="label" id="widthSnsLab">Width</span>

    const GRADE_POINTS = { I: 1, II: 2, III: 3, IV: 4 };

    function calcFourPoints(defects, lengthM, widthCm) {
      const counts = { I: 0, II: 0, III: 0, IV: 0 };
      const rows = [];
      let total = 0;
      (defects || []).forEach((d) => {
        const g = d.grade || "I";
        const pts = GRADE_POINTS[g] || 0;
        if (counts[g] != null) counts[g] += 1;
        total += pts;
        rows.push({ id: d.id, title: d.title, grade: g, points: pts, y: d.y });
      });
      const lengthYd = Math.max(0.01, lengthM * 1.0936133);
      const widthYd = Math.max(0.01, (widthCm / 100) * 1.0936133);
      const areaSqYd = lengthYd * widthYd;
      const per100Sq = (total / areaSqYd) * 100;
      const per100 = (total / lengthYd) * 100;
      const threshold = 40;
      return {
        total,
        per100Sq,
        per100,
        counts,
        rows,
        threshold,
        isNg: per100Sq > threshold,
      };
    }

    function pushHistorySample(force) {
      const now = Date.now() / 1000;

      state.history.push({
        t: now,
        lengthM: state.lengthM,
        widthCm: state.widthCm,
        speed: state.speed,
        colorDiff: state.colorDiff,
        tension: state.tension,
        weightKg: state.weightKg
      });
      if (state.history.length > HISTORY_MAX) {
        state.history.splice(0, state.history.length - HISTORY_MAX);

          weightKg: 18.2 + u * 0.4

    /** 普通：中间定宽，左右等宽占剩余 67%；紧凑：左右按内容等宽贴边，中间拉伸（对齐 SpxBottomHud） */
    function syncBottomSideWidths(bottom) {
      if (!bottom) bottom = $("SpxBottomHud");
      if (!bottom) return;
      const left = bottom.querySelector(".side-col.side-left");
      const right = bottom.querySelector(".side-col.side-right");
      const center = bottom.querySelector(".center-col");
      if (!left || !right || !center) return;

      const minimal =
        !!state.minimalMode ||
        bottom.classList.contains("minimal") ||
        document.body.classList.contains("minimal-mode") ||
        !!document.getElementById("app")?.classList.contains("minimal-mode");

      left.style.flex = "0 0 auto";
      right.style.flex = "0 0 auto";
      left.style.width = "";
      right.style.width = "";
      center.style.minWidth = "";
      center.style.maxWidth = "none";

      if (minimal) {
        // 紧凑：先测内容再取 max，左右等宽；中间吃剩余
        center.style.flex = "1 1 auto";
        center.style.width = "auto";
        left.style.flex = "0 0 auto";
        right.style.flex = "0 0 auto";
        // 强制一次布局再测，避免隐藏 chip 后宽度仍偏大
        void bottom.offsetWidth;
        const leftNeed = Math.max(160, Math.ceil(left.scrollWidth || left.offsetWidth || 0));
        // 右：3×28 图标 + CPU/GPU + 报警最小宽（对齐 Qt syncCompactSideWidths）
        const rightIconsW = 3 * 28 + 2 * 4;
        const rightNeed = Math.max(
          rightIconsW + 4 + 52 + 52 + 4 + 96,
          Math.ceil(right.scrollWidth || right.offsetWidth || 0)
        );
        const sideW = Math.max(leftNeed, rightNeed);
        left.style.width = `${sideW}px`;
        right.style.width = `${sideW}px`;
        left.style.flex = `0 0 ${sideW}px`;
        right.style.flex = `0 0 ${sideW}px`;
        return;
      }

      center.style.flex = "0 0 auto";
      center.style.width = "auto";

      const style = getComputedStyle(bottom);
      const padL = parseFloat(style.paddingLeft) || 0;
      const padR = parseFloat(style.paddingRight) || 0;
      const gap = parseFloat(style.columnGap || style.gap) || 8;
      const avail = Math.max(0, bottom.clientWidth - padL - padR - gap * 2);

      let centerNeed = Math.ceil(center.scrollWidth || center.offsetWidth || 0);
      centerNeed = Math.max(centerNeed, 108 + 216 + 108);
      centerNeed = Math.min(centerNeed, Math.floor(avail * 0.8));

      const remain = Math.max(0, avail - centerNeed);
      const sideW = Math.floor((remain * 0.67) / 2);
      center.style.flex = `0 0 ${centerNeed}px`;
      center.style.width = `${centerNeed}px`;
      if (sideW > 0) {
        left.style.width = `${sideW}px`;
        right.style.width = `${sideW}px`;
        left.style.flex = `0 0 ${sideW}px`;
        right.style.flex = `0 0 ${sideW}px`;
      }
    }

    function layoutStageOverlays() {
      const stage = $("SpxStage");
      if (!stage) return;
      const sr = stage.getBoundingClientRect();
      const sw = sr.width;
      const sh = sr.height;

      const header = $("SpxHeaderBar");
      const bottom = $("SpxBottomHud");
      const map = $("SpxDefectMapHud");
      const list = $("SpxDefectListHud");
      const toggles = $("SpxViewToggleBar");
      const fpsHud = $("SpxFpsHud");
      const coordHud = $("SpxCoordHud");
      const runDir = $("SpxRunDirectionHud");
      const toast = $("toast");

      const headerH = header
        ? spxClamp(header.offsetHeight || (state.minimalMode ? 40 : 56), state.minimalMode ? 36 : 56, state.minimalMode ? 44 : 64)
        : state.minimalMode ? 40 : 56;
      const bottomH = bottom
        ? spxClamp(bottom.offsetHeight || (state.minimalMode ? 75 : 110), state.minimalMode ? 70 : 110, state.minimalMode ? 80 : 128)
        : state.minimalMode ? 75 : 110;

      if (header) {
        header.style.height = `${headerH}px`;
        header.style.top = "0";
      }
      if (bottom) {
        bottom.style.height = `${bottomH}px`;
        bottom.style.bottom = "0";
        syncBottomSideWidths(bottom);
      }

      const margin = state.minimalMode ? 6 : 16;
      const toggleH = toggles ? (toggles.offsetHeight || 42) : 40;
      const toggleGap = state.minimalMode ? 4 : 8;
      const top = headerH + 8;
      const bot = bottomH + toggleH + toggleGap + 8;
      const mapW = state.minimalMode ? 28 : spxClamp(Math.floor(sw / 5), 220, 280);
      const listW = state.minimalMode ? 118 : spxClamp(Math.floor(sw / 4), 260, 320);
      const hudH = Math.max(180, sh - top - bot);

      if (map) {
        map.style.left = `${margin}px`;
        map.style.top = `${top}px`;
        map.style.width = `${mapW}px`;
        map.style.height = `${hudH}px`;
        map.style.display = state.viewFlags.showMap ? "" : "none";
      }
      if (list) {
        list.style.left = `${sw - margin - listW}px`;
        list.style.top = `${top}px`;
        list.style.width = `${listW}px`;
        list.style.height = `${hudH}px`;
        list.style.display = state.viewFlags.showList ? "" : "none";
      }

      // 日志回放条：贴布面左上，避开地图/列表/方向 HUD 与底栏
      const logBar = $("spxLogBar");
      if (logBar && !logBar.hidden) {
        logBar.style.left = `${margin + (state.viewFlags.showMap ? mapW : 0) + 10}px`;
        logBar.style.top = `${top + 6}px`;
        logBar.style.right = "auto";
        logBar.style.bottom = "auto";
      }

      let toggleX = 0;
      let toggleBarW = 0;
      if (toggles) {
        toggleBarW = Math.max(toggles.scrollWidth || toggles.offsetWidth, 280);
        toggleX = Math.floor((sw - toggleBarW) / 2);
        const toggleY = sh - bottomH - toggleH - toggleGap;
        toggles.style.left = `${toggleX}px`;
        toggles.style.top = `${toggleY}px`;
        toggles.style.width = `${toggleBarW}px`;
        toggles.style.height = `${toggleH}px`;

        const chipH = Math.max(28, toggleH);
        const chipGap = 12;
        const mapRight = map && state.viewFlags.showMap ? margin + mapW : margin;

        if (fpsHud) {
          const right = toggleX - chipGap;
          const left = mapRight + chipGap;
          const w = spxClamp(right - left, 132, 200);
          const x = right - w;
          fpsHud.style.left = `${x}px`;
          fpsHud.style.top = `${toggleY + (toggleH - chipH) / 2}px`;
          fpsHud.style.width = `${w}px`;
          fpsHud.style.height = `${chipH}px`;
        }

        if (coordHud) {
          const w = Math.max(coordHud.offsetWidth || 220, 220);
          const x = toggleX + toggleBarW + chipGap;
          coordHud.style.left = `${x}px`;
          coordHud.style.top = `${toggleY + (toggleH - chipH) / 2}px`;
          coordHud.style.width = `${w}px`;
          coordHud.style.height = `${chipH}px`;
        }

        if (toast) {
          toast.style.bottom = `${bottomH + 12}px`;
        }
      }

      if (runDir && !state.minimalMode) {
        const rdx = Math.floor((sw - 48) / 2);
        runDir.style.left = `${rdx}px`;
        runDir.style.top = `${headerH + 10}px`;
        runDir.style.display = "";
      } else if (runDir) {
        runDir.style.display = "none";
      }
    }

        showClothEdge: true, showDetected: true, showDetectionResult: true, showFiltered: true,

      state.viewFlags = {
        ...state.viewFlags,
        showMap: false, showList: false, showImage: false, showLabelLine: false, showFrameBorder: false,
        showClothEdge: false, showDetected: false, showDetectionResult: false, showFiltered: false,
        showDefectInfo: false, showCoordRuler: false, showGrid: false,
      };

    function buildViewToggleBar() {
      const bar = $("SpxViewToggleBar");
      if (!bar || bar.dataset.built === "1") return;
      bar.dataset.built = "1";
      bar.innerHTML = "";
      VIEW_TOGGLE_SPECS.forEach((spec) => {
        if (spec.kind === "sep") {
          const sep = document.createElement("span");
          sep.className = "spx-vsep";
          sep.setAttribute("aria-hidden", "true");
          bar.appendChild(sep);
          return;
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "spx-vbtn";
        btn.title = t(spec.i18n);
        btn.addEventListener("click", () => playClickFx(btn, 140), true);
        if (spec.kind === "toggle") {
          btn.id = `spxViewBtn${spec.flag.charAt(0).toUpperCase()}${spec.flag.slice(1)}`;
          btn.setAttribute("data-flag", spec.flag);
          btn.setAttribute("data-icon", spec.icon);
          btn.setAttribute("aria-pressed", state.viewFlags[spec.flag] ? "true" : "false");
          btn.innerHTML = viewIconSvg(spec.icon, state.viewFlags[spec.flag]);
          btn.addEventListener("click", () => {
            state.viewFlags[spec.flag] = !state.viewFlags[spec.flag];
            applyViewFlags();
          });
        } else if (spec.kind === "action") {
          btn.id = `spxViewBtn${spec.key.charAt(0).toUpperCase()}${spec.key.slice(1)}`;
          btn.setAttribute("data-icon", spec.icon);
          btn.innerHTML = viewIconSvg(spec.icon, true);
          btn.addEventListener("click", () => {
            if (spec.key === "showAll") applyShowAllViewFlags();
            else if (spec.key === "hideAll") applyHideAllViewFlags();
            else if (spec.key === "resetZoom") {
              // 预览：与布面双击重置一致，清手动缩放状态
              state.userNavigating = false;
              applyViewFlags();
            } else applyResetViewFlags();
          });
        } else if (spec.kind === "fit") {
          btn.id = spec.key === "fitWidth" ? "spxViewBtnFitWidth" : "spxViewBtnFitHeight";
          btn.setAttribute("data-icon", spec.icon);
          btn.setAttribute("aria-pressed", spec.key === "fitWidth" ? (!state.viewFlags.fitHeight ? "true" : "false") : (state.viewFlags.fitHeight ? "true" : "false"));
          btn.innerHTML = viewIconSvg(spec.icon, spec.key === "fitWidth" ? !state.viewFlags.fitHeight : state.viewFlags.fitHeight);
          btn.addEventListener("click", () => {
            state.viewFlags.fitHeight = spec.key === "fitHeight";
            applyViewFlags();
          });
        } else if (spec.kind === "fullscreen") {
          btn.id = "spxViewBtnFullscreen";
          btn.setAttribute("data-icon", "fullscreen");
          btn.setAttribute("aria-pressed", "false");
          btn.innerHTML = viewIconSvg("fullscreen", false);
          btn.addEventListener("click", () => setMinimalMode(!state.minimalMode));
        }
        bar.appendChild(btn);
      });
    }

      const mm = `${mmX.toFixed(1).padStart(8, " ")}, ${mmY.toFixed(1).padStart(8, " ")} mm`;

      state.displayFps = spxClamp(state.displayFps + jitter(), 24, 32);

    function updateRunDirectionHud() {
      const el = $("SpxRunDirectionHud");
      if (!el) return;
      el.classList.toggle("reverse", !!state.isReversal);
      el.classList.toggle("forward", !state.isReversal);
      el.classList.toggle("dim", !state.running);
      el.title = t(state.isReversal ? "run_dir_reverse" : "run_dir_forward");
      const svg = el.querySelector("svg path");

        svg.setAttribute("d", state.isReversal ? "M12 4 L22 20 H14 V26 H10 V20 H2 Z" : "M12 24 L22 8 H14 V2 H10 V8 H2 Z");
      }

    function bindFabricCoordHud() {
      const fabric = $("fabric");
      const coord = $("SpxCoordHud");
      if (!fabric || !coord) return;
      const mmPerPxX = (state.widthCm * 10) / Math.max(fabric.clientWidth, 1);
      const mmPerPxY = 0.35;
      fabric.addEventListener("mousemove", (ev) => {
        const r = fabric.getBoundingClientRect();
        const pxX = Math.round(ev.clientX - r.left);
        const pxY = Math.round(ev.clientY - r.top);
        const mmX = pxX * mmPerPxX;
        const mmY = pxY * mmPerPxY;
        coord.textContent = formatCoordHud(pxX, pxY, mmX, mmY);
        coord.hidden = false;
        layoutStageOverlays();
      });
      fabric.addEventListener("mouseleave", () => {
        coord.textContent = "";
        coord.hidden = true;
      });
    }

    /** 主界面点击瞬时动效（对齐 Qt SpxClickFx） */
    function playClickFx(el, ms) {
      if (!el) return;
      const hold = Math.max(120, Math.min(Number(ms) || 180, 400));
      el.classList.remove("spx-click-fx");
      void el.offsetWidth;
      el.classList.add("spx-click-fx");
      window.setTimeout(() => el.classList.remove("spx-click-fx"), hold + 20);
    }

    /** 主操作按下：透明度脉冲 + busy 固定 hold（对齐 Qt SpxBottomHud） */
    function playActFeedback(el, holdMs) {
      if (!el || el.classList.contains("busy") || el.dataset.actFeedback === "1") return false;
      const hold = Math.max(180, Math.min(Number(holdMs) || 300, 2000));
      const gen = (Number(el.dataset.actFeedbackGen) || 0) + 1;
      el.dataset.actFeedbackGen = String(gen);
      el.dataset.actFeedback = "1";
      el.classList.add("busy");
      playClickFx(el, Math.min(200, hold));
      window.setTimeout(() => {
        if (el.dataset.actFeedbackGen !== String(gen)) return;
        el.dataset.actFeedback = "0";
        el.classList.remove("busy");
      }, hold);
      return true;
    }

      if (!popupHost) return;

    function mapLengthMeters() {
      // 输入码长（targetM）为主，覆盖当前码长与疵点，向上取整 10m
      let maxY = Math.max(Number(state.targetM) || 0, Number(state.lengthM) || 0, 10);
      DEFECTS.forEach((d) => {
        const y = Number(d.y) || 0;
        if (y > maxY) maxY = y;
      });
      return Math.max(10, Math.ceil(maxY / 10) * 10);
    }

    function renderDefects() {
      $("listMeta").textContent = String(DEFECTS.length);
      const mapLen = mapLengthMeters();
      $("mapMeta").textContent =
        `${(state.widthCm / 100).toFixed(2)} × ${mapLen.toFixed(0)} m  ·  ${DEFECTS.length}`;

      const list = $("defectList");
      list.innerHTML = "";
      DEFECTS.forEach((d) => {
        const li = document.createElement("li");
        li.className = d.id === state.selectedId ? "active" : "";
        const sizeMm = Math.max(Number(d.width) || 0, Number(d.length) || 0);
        li.innerHTML =
          `<span class="d-title">${d.title}  ·  ${d.grade}</span><br>` +
          `<span class="d-meta">${sizeMm.toFixed(1)} mm  ·  Y ${Number(d.y).toFixed(2)} m</span>` +
          `<span class="d-compact">${d.title} - ${Number(d.y).toFixed(2)} m</span>`;
        li.addEventListener("click", () => {
          state.selectedId = d.id;
          renderDefects();
          openDefectDetail();
        });
        list.appendChild(li);
      });

      const map = $("mapCanvas");
      map.innerHTML = "";
      // 贴标线：预览用 plcY(mm)/1000；正式路径 cy − ClothStopOffset
      const labelM = Math.max(0, (Number(state.plcY) || 0) / 1000);
      if (labelM > 0 && mapLen > 0) {
        const line = document.createElement("div");
        line.className = "map-label-line";
        const topPct = Math.min(100, Math.max(0, (1 - labelM / mapLen) * 100));
        line.style.top = `${topPct}%`;
        map.appendChild(line);
      }
      DEFECTS.forEach((d) => {
        const p = document.createElement("div");
        p.className = "map-point" + (d.id === state.selectedId ? " selected" : "");
        // x：0–1 归一化幅宽；y：米 / 输入码长
        p.style.left = `${Math.min(100, Math.max(0, Number(d.x) * 100))}%`;
        p.style.top = `${Math.min(100, Math.max(0, (1 - Number(d.y) / mapLen) * 100))}%`;
        p.title = d.title;
        p.addEventListener("click", () => {
          state.selectedId = d.id;
          renderDefects();
          openDefectDetail();
        });
        map.appendChild(p);
      });

      const marks = $("stageMarks");
      marks.innerHTML = "";
      DEFECTS.forEach((d) => {
        const m = document.createElement("div");
        const kind = d.id === 4 ? "filtered" : "detected";
        m.className = "defect-mark" + (d.id === state.selectedId ? " selected" : "");
        m.dataset.kind = kind;
        m.style.left = `${18 + d.x * 64}%`;
        m.style.top = `${22 + (d.y / 40) * 56}%`;
        const info = document.createElement("span");
        info.className = "defect-info";
        info.textContent = `${d.title} · ${d.grade}`;
        info.hidden = !state.viewFlags.showDefectInfo;
        m.appendChild(info);
        if (!state.viewFlags.showDetected && kind === "detected") m.style.display = "none";
        if (!state.viewFlags.showFiltered && kind === "filtered") m.style.display = "none";
        marks.appendChild(m);
      });

      if (popupHost && popupHost.isOpen("defectDetail")) {
        popupHost.refresh(["defectDetail"]);
      }
    }

      alarmMsg.textContent = liveMsg;

      }
      updateDeviceChips();
    }

    function demoTick() {
      // 日志回放期间由 playbackTick 驱动，停止随机演示
      if (playback.active) return;
      if (!state.running) return;
      state.lengthM = Math.min(state.targetM, state.lengthM + state.speed / 3600 * 8);
      state.speed = 40 + Math.sin(Date.now() / 1800) * 4;
      state.widthCm = 150 + Math.sin(Date.now() / 2600) * 1.4;
      state.colorDiff = 0.35 + Math.abs(Math.sin(Date.now() / 2200)) * 0.25;
      state.tension = 30 + Math.sin(Date.now() / 1900) * 4;
      state.plcX = 100 + Math.round((Date.now() / 200) % 40);
      state.plcY = Math.round(state.lengthM * 1000);
      state.plcTy = Math.round(state.targetM * 1000);
      state.camFrames += 2;
      state.lightBrightness = 160 + Math.round(Math.abs(Math.sin(Date.now() / 2400)) * 20);
      // 演示：净重随码长缓慢变化，毛重保持净重+纸管
      state.weightNetKg = 18 + state.lengthM * 0.05;
      state.weightGrossKg = state.weightNetKg + 0.6;
      state.weightKg = state.weightNetKg;
      state.cpu = 35 + Math.abs(Math.sin(Date.now() / 1400)) * 25;
      state.gpu = 45 + Math.abs(Math.cos(Date.now() / 1600)) * 30;
      state.unwind = Math.max(20, 70 - state.lengthM * 0.2);
      if (state.plc) {
        state.plc.fabric_length = state.lengthM;
        state.plc.servo_speed = state.speed;
        state.plc.current_y = state.plcY;
        state.plc.current_x = state.plcX;
        state.plc.fabric_tension_pid = state.tension;
        state.plc.roll_tension = state.rollTension;
        state.plc.plc_fabric_width = state.widthCm;
        state.plc.live_weight = state.weightKg;
      }
      // 演示：周期切换报警信息，驱动顶栏计数与底栏滚动文案
      const demos =
        state.lang === "zh-CN"
          ? [
              { code: "V16_0", msg: "验布站主动轴报警" },
              { code: "V16_1", msg: "验布站张力轴报警" },
              { code: "V17_7", msg: "称重位置物料没清空" },
              { code: "DISK", msg: "磁盘空间不足" },
            ]
          : [
              { code: "V16_0", msg: "Main drive alarm" },
              { code: "V16_1", msg: "Tension axis alarm" },
              { code: "V17_7", msg: "Weighing station not clear" },
              { code: "DISK", msg: "Low disk space" },
            ];
      const phase = Math.floor(Date.now() / 6500) % (demos.length + 2);
      if (phase < demos.length) {
        const cur = demos[phase];
        const next = demos[(phase + 1) % demos.length];
        state.alarm = phase % 2 === 0 ? 1 : 2;
        state.alarmList = phase % 2 === 0 ? [cur] : [cur, next];
        state.alarmMsg = state.alarmList.map((a) => `[${a.code}] ${a.msg}`).join(" · ");
      } else {
        state.alarm = 0;
        state.alarmList = [];
        state.alarmMsg = "";
      }
      pushHistorySample();
      renderMetrics();
      $("mapMeta").textContent =
        `${(state.widthCm / 100).toFixed(2)} × ${state.lengthM.toFixed(1)} m  ·  ${DEFECTS.length}`;
      if (popupHost && typeof popupHost.refresh === "function") {
        popupHost.refresh(["length", "width", "speed", "colorDiff", "tension", "alarm", "cpu", "gpu", "unwind"]);
      }
    }

          refreshOpenTool(host, "artificalAddDefect");

        }
        if (act === "art-confirm-cancel") {
          state.artificalConfirm = null;
          state.artificalConfirmId = null;
          refreshOpenTool(host, "artificalAddDefect");
          return;
        }
        if (act === "art-confirm-ok") {
          const kind = state.artificalConfirm;

          state.artificalConfirm = null;
          state.artificalConfirmId = null;
          if (kind === "clear") {

        // ── artifical_edit_defect ──
        if (act === "edit-select") {

        if (act === "rec-col-select") {
          const idx = actEl ? Number(actEl.getAttribute("data-index")) : -1;
          recUi().settingsActiveIdx = Number.isFinite(idx) ? idx : -1;
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-col-toggle") {
          const col = actEl && actEl.getAttribute("data-column");
          if (!col) return;
          const box = actEl.matches && actEl.matches("input[type='checkbox']")
            ? actEl
            : (actEl.querySelector && actEl.querySelector("input[type='checkbox']"));
          if (box && box.disabled) {
            showToast(state.lang === "zh-CN" ? "前 4 列不可移除" : "First 4 columns are fixed");
            return;
          }
          const ui = recUi();
          const draft = ensureDraft(ui);
          const idx = draft.findIndex((c) => recMatch(c, col));
          const wantOn = box ? !!box.checked : idx < 0;
          if (wantOn) {
            if (idx < 0) draft.push(col);
          } else {
            if (idx >= 0 && idx < 4) {
              if (box) box.checked = true;
              showToast(state.lang === "zh-CN" ? "前 4 列不可移除" : "First 4 columns are fixed");
              return;

            if (idx >= 0) draft.splice(idx, 1);

          ui.draftCols = draft;
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-col-remove") {
          const idx = actEl ? Number(actEl.getAttribute("data-index")) : -1;
          const ui = recUi();
          const draft = ensureDraft(ui);
          if (idx < 4) {
            showToast(state.lang === "zh-CN" ? "前 4 列不可移除" : "First 4 columns are fixed");
            return;
          }
          if (idx >= 0 && idx < draft.length) {
            draft.splice(idx, 1);
            ui.draftCols = draft;
            if (ui.settingsActiveIdx === idx) ui.settingsActiveIdx = -1;
            else if (ui.settingsActiveIdx > idx) ui.settingsActiveIdx -= 1;
            refreshOpenTool(host, "records");

        if (act === "rec-col-top" || act === "rec-col-bottom" || act === "rec-col-up" || act === "rec-col-down") {
          const ui = recUi();
          const draft = ensureDraft(ui);
          let idx = ui.settingsActiveIdx != null ? Number(ui.settingsActiveIdx) : -1;
          if (idx < 4 || idx >= draft.length) return;
          const item = draft.splice(idx, 1)[0];
          if (act === "rec-col-top") idx = 4;
          else if (act === "rec-col-bottom") idx = draft.length;
          else if (act === "rec-col-up") idx = Math.max(4, idx - 1);
          else idx = Math.min(draft.length, idx + 1);
          draft.splice(idx, 0, item);
          ui.draftCols = draft;
          ui.settingsActiveIdx = idx;
          refreshOpenTool(host, "records");
          return;
        }
        if (act === "rec-col-save") {
          const ui = recUi();
          const draft = ensureDraft(ui).map((c) => String(c || "").trim()).filter(Boolean);
          const zh = state.lang === "zh-CN";

              ui.cols = saved.slice();

                msg.className = "spx-msg err";
                msg.textContent = (e && e.message) || (zh ? "保存失败" : "Save failed");

              showToast((e && e.message) || (zh ? "保存失败" : "Save failed"));
            }
            return;
          }
          ui.cols = draft.slice();
          ui.draftCols = null;
          ui.settingsOpen = false;
          refreshOpenTool(host, "records");
          showToast(zh ? "列配置已保存（预览本地，未写库）" : "Saved locally (preview, no DB)");
          return;
        }

        showToast(act);
      },

    document.querySelectorAll("[data-popup]").forEach((el) => {
      el.addEventListener("click", () => {
