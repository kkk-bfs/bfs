    // ── 日志回放（静态文件：./logs/index.js 注册，文件放 ./logs/） ──
    const LOG_INDEX = Array.isArray(window.SPX_LOG_INDEX) ? window.SPX_LOG_INDEX : [];
    const LOG_STORE = window.SPX_LOGS || (window.SPX_LOGS = {});

    const PLAY_NUM_KEYS = [
      "lengthM", "targetM", "speed", "widthCm", "cropLeftMm", "cropRightMm", "colorDiff",
      "weightKg", "weightGrossKg", "weightNetKg", "tension", "fabricTension", "rollTension",
      "swingAmplitude", "unwind", "cpu", "gpu", "todayM", "plcX", "plcY", "plcTy", "camFrames",
      "lightBrightness", "displayFps", "inputFps",
    ];
    const PLAY_OTHER_KEYS = ["lightAuto", "isReversal"];
    const PLAY_PLC_KEYS = [
      "fabric_length", "servo_speed", "encoder", "servo_value", "speed", "fabric_tension_pid",
      "roll_tension", "tension", "plc_fabric_width", "width_sensor_left", "width_sensor_right",
      "live_weight", "last_weight", "current_x", "current_y", "current_z", "speed_set",
      "fabric_tension_set", "roll_tension_set", "label_x", "label_y",
    ];

    const playback = {
      active: false,
      paused: false,
      log: null,
      stateEvents: [],
      otherEvents: [],
      cursor: 0,
      startedAt: 0,
      pausedAt: 0,
      elapsed: 0,
      durationMs: 0,
      initial: {},
    };

    function logList() {
      return LOG_INDEX.filter(function (e) {
        return e && e.id && LOG_STORE[e.id];
      });
    }

    function loadLogScripts() {
      return Promise.all(
        LOG_INDEX.map(function (entry) {
          return new Promise(function (resolve) {
            if (!entry || !entry.file) return resolve();
            // .json 走 fetch（需 http(s) 环境）；.js 走 script（file:// 也可用）
            if (/\.json$/i.test(entry.file)) {
              fetch("./logs/" + entry.file)
                .then(function (r) {
                  return r.ok ? r.json() : null;
                })
                .then(function (log) {
                  if (log) LOG_STORE[entry.id] = log;
                })
                .catch(function () {})
                .then(resolve);
              return;
            }
            const s = document.createElement("script");
            s.src = "./logs/" + entry.file;
            s.async = false;
            s.onload = function () { resolve(); };
            s.onerror = function () { resolve(); };
            document.head.appendChild(s);
          });
        })
      );
    }

    function selectedLogForPlayback() {
      const sel = $("logSelect");
      return sel && LOG_STORE[sel.value] ? LOG_STORE[sel.value] : null;
    }

    function updateLogMeta(text) {
      const el = $("logMeta");
      if (!el) return;
      if (text != null) {
        el.textContent = text;
        return;
      }
      if (playback.active) {
        el.textContent =
          (playback.elapsed / 1000).toFixed(1) + " / " + (playback.durationMs / 1000).toFixed(1) + " s";
      } else {
        el.textContent = selectedLogForPlayback() ? t("log_hint_ready") : t("log_sim");
      }
    }

    function initLogPlayback() {
      const bar = $("spxLogBar");
      const sel = $("logSelect");
      if (!bar || !sel) return;
      loadLogScripts().then(function () {
        const items = logList();
        sel.innerHTML = "";
        const sim = document.createElement("option");
        sim.value = "";
        sim.textContent = t("log_sim");
        sel.appendChild(sim);
        items.forEach(function (e) {
          const log = LOG_STORE[e.id];
          const dur = log && log.meta && log.meta.durationMs ? Math.round(log.meta.durationMs / 1000) : 0;
          const opt = document.createElement("option");
          opt.value = e.id;
          opt.textContent =
            (e.name || (log.meta && log.meta.name) || e.id) + (dur ? "  ·  " + dur + "s" : "");
          sel.appendChild(opt);
        });
        if (items.length) sel.value = items[0].id;
        bar.hidden = !items.length;
        updateLogMeta();
        layoutStageOverlays();
      });
    }

    function preparePlayback(log) {
      const meta = (log && log.meta) || {};
      const events = ((log && (log.events || log.frames)) || [])
        .filter(function (e) {
          return e && typeof e.t === "number";
        })
        .slice()
        .sort(function (a, b) {
          return a.t - b.t;
        });
      const stateEvents = [];
      const otherEvents = [];
      events.forEach(function (e) {
        const type = e.type || (e.data ? "state" : "");
        if (type === "state") stateEvents.push({ t: e.t, data: e.data || e.state || {} });
        else otherEvents.push(e);
      });
      const durationMs = Math.max(
        1,
        Number(meta.durationMs) || (events.length ? events[events.length - 1].t : 0) || 1
      );
      return { meta: meta, stateEvents: stateEvents, otherEvents: otherEvents, durationMs: durationMs };
    }

    function lerp(a, b, k) {
      return a + (b - a) * k;
    }

    function stateAtTime(t) {
      const evs = playback.stateEvents;
      let prev = null;
      let next = null;
      for (let i = 0; i < evs.length; i++) {
        if (evs[i].t <= t) prev = evs[i];
        else {
          next = evs[i];
          break;
        }
      }
      const out = Object.assign({}, playback.initial);
      if (prev) Object.assign(out, prev.data);
      if (prev && next) {
        const span = Math.max(1, next.t - prev.t);
        const k = Math.max(0, Math.min(1, (t - prev.t) / span));
        Object.keys(next.data || {}).forEach(function (key) {
          if (key === "plc") return;
          const b = Number(next.data[key]);
          const a = Number(prev.data && prev.data[key] != null ? prev.data[key] : out[key]);
          if (Number.isFinite(a) && Number.isFinite(b)) out[key] = lerp(a, b, k);
        });
        if (next.data && next.data.plc && typeof next.data.plc === "object") {
          out.plc = Object.assign({}, prev.data && prev.data.plc, next.data.plc);
          Object.keys(next.data.plc).forEach(function (key) {
            const b = Number(next.data.plc[key]);
            const prevV = prev.data && prev.data.plc ? prev.data.plc[key] : null;
            const a = Number(prevV != null ? prevV : out.plc ? out.plc[key] : NaN);
            if (Number.isFinite(a) && Number.isFinite(b)) out.plc[key] = lerp(a, b, k);
          });
        }
      }
      return out;
    }

    function applyPlayState(data) {
      PLAY_NUM_KEYS.forEach(function (key) {
        if (data[key] != null) {
          const n = Number(data[key]);
          state[key] = Number.isFinite(n) ? n : data[key];
        }
      });
      PLAY_OTHER_KEYS.forEach(function (key) {
        if (data[key] != null) state[key] = data[key];
      });
      if (data.plc && typeof data.plc === "object") {
        PLAY_PLC_KEYS.forEach(function (key) {
          if (data.plc[key] != null) {
            const n = Number(data.plc[key]);
            state.plc[key] = Number.isFinite(n) ? n : data.plc[key];
          }
        });
      }
    }

    function applySheetChips() {
      if ($("checkId")) $("checkId").textContent = sheet.checkId;
      if ($("lotNo")) $("lotNo").textContent = sheet.lotNo;
      if ($("rollNo")) $("rollNo").textContent = sheet.rollNo;
      if ($("fabricColor")) $("fabricColor").textContent = sheet.color;
      if ($("fabricName")) $("fabricName").textContent = sheet.fabric;
      if ($("defectSettings")) $("defectSettings").textContent = sheet.fabric;
      renderMetrics();
    }

    function applyPlayEvent(ev) {
      const d = ev.data || {};
      switch (ev.type) {
        case "defects":
          DEFECTS.length = 0;
          (Array.isArray(d) ? d : d.defects || []).forEach(function (x) {
            DEFECTS.push(x);
          });
          renderDefects();
          break;
        case "addDefect": {
          const item = d.defect || d;
          if (item && item.id != null) DEFECTS.push(item);
          renderDefects();
          break;
        }
        case "removeDefect": {
          const id = d.id != null ? d.id : d;
          for (let i = DEFECTS.length - 1; i >= 0; i--) {
            if (DEFECTS[i].id === id) DEFECTS.splice(i, 1);
          }
          renderDefects();
          break;
        }
        case "alarm": {
          const list = Array.isArray(d.messages) ? d.messages : Array.isArray(d.list) ? d.list : [];
          state.alarmList = list;
          state.alarm = d.count != null ? Number(d.count) : list.length;
          state.alarmMsg =
            list
              .map(function (a) {
                return "[" + (a.code || "") + "] " + (a.msg || a.message || "");
              })
              .join(" · ") || d.msg || "";
          break;
        }
        case "toast":
          showToast(d.text || "");
          break;
        case "popup":
          if (d.key && popupHost) popupHost.open(d.key, null);
          break;
        case "closePopup":
          if (popupHost) popupHost.close();
          break;
        case "sheet":
          Object.assign(sheet, d);
          applySheetChips();
          break;
        case "view":
          Object.assign(state.viewFlags, d);
          applyViewFlags();
          break;
        case "minimalMode":
          setMinimalMode(!!(d.on != null ? d.on : d));
          break;
        case "running":
          state.running = !!(d.on != null ? d.on : d);
          break;
      }
    }

    function renderPlaybackFrame() {
      renderMetrics();
      renderDefects();
      if (popupHost && typeof popupHost.refresh === "function") {
        popupHost.refresh(["length", "width", "speed", "colorDiff", "tension", "alarm", "cpu", "gpu", "unwind"]);
      }
      updateLogMeta();
    }

    function startPlayback(log) {
      const p = preparePlayback(log);
      playback.active = true;
      playback.paused = false;
      playback.log = log;
      playback.stateEvents = p.stateEvents;
      playback.otherEvents = p.otherEvents;
      playback.cursor = 0;
      playback.durationMs = p.durationMs;
      playback.elapsed = 0;
      playback.startedAt = Date.now();
      playback.initial = p.meta.initialState || {};

      if (p.meta.sheet) {
        Object.assign(sheet, p.meta.sheet);
        if (p.meta.sheet.targetM != null) state.targetM = Number(p.meta.sheet.targetM) || state.targetM;
        applySheetChips();
      }
      DEFECTS.length = 0;
      (p.meta.defects || []).forEach(function (x) {
        DEFECTS.push(x);
      });
      // 回放从日志定义的状态开始，清掉演示过程遗留的报警
      state.alarm = 0;
      state.alarmMsg = "";
      state.alarmList = [];
      applyPlayState(stateAtTime(0));
      state.running = true;
      applyViewFlags();
      renderPlaybackFrame();
      updateRunBtn();
      showToast((p.meta.name || "log") + " · " + t("log_playing"));
    }

    function stopPlayback(notify) {
      const wasActive = playback.active;
      playback.active = false;
      playback.paused = false;
      playback.log = null;
      playback.elapsed = 0;
      state.running = false;
      updateRunBtn();
      updateLogMeta();
      if (wasActive && notify) showToast(t("log_stopped"));
    }

    function togglePlaybackPause() {
      if (!playback.active) return;
      if (playback.paused) {
        playback.paused = false;
        playback.startedAt += Date.now() - playback.pausedAt;
        state.running = true;
        showToast(t("resume"));
      } else {
        playback.paused = true;
        playback.pausedAt = Date.now();
        state.running = false;
        showToast(t("pause"));
      }
      updateRunBtn();
    }

    function playbackTick() {
      if (!playback.active || playback.paused) return;
      playback.elapsed = Math.min(Date.now() - playback.startedAt, playback.durationMs);
      const evs = playback.otherEvents;
      while (playback.cursor < evs.length && evs[playback.cursor].t <= playback.elapsed) {
        applyPlayEvent(evs[playback.cursor]);
        playback.cursor++;
      }
      applyPlayState(stateAtTime(playback.elapsed));
      renderPlaybackFrame();
      if (playback.elapsed >= playback.durationMs) {
        playback.active = false;
        playback.paused = false;
        state.running = false;
        updateRunBtn();
        updateLogMeta();
        showToast(t("log_finished"));
      }
    }

    $("btnRun").addEventListener("click", () => {
      if (!playActFeedback($("btnRun"), 300)) return;
      const log = selectedLogForPlayback();
      if (log) {
        // 有日志：启动 = 播放；播放中 = 暂停/继续
        if (playback.active) togglePlaybackPause();
        else startPlayback(log);
        return;
      }
      state.running = !state.running;
      updateRunBtn();
      showToast(state.running ? t("start") : t("pause"));
    });

    $("btnLogStop")?.addEventListener("click", () => {
      playClickFx($("btnLogStop"), 160);
      stopPlayback(true);
    });
    $("logSelect")?.addEventListener("change", () => {
      stopPlayback(false);
      updateLogMeta();
    });

    document.querySelector(".action-row .act-new")?.addEventListener("click", (e) => {
      playActFeedback(e.currentTarget, 400);
    }, true);
    document.querySelector(".action-row .act-finish")?.addEventListener("click", (e) => {
      playActFeedback(e.currentTarget, state.running ? 400 : 850);
    }, true);

    $("lang").addEventListener("change", (e) => {
      state.lang = e.target.value;
      applyI18n();
      if (popupHost.activeKey) popupHost.open(popupHost.activeKey, popupHost.triggerEl);
    });

    $("btnExit").addEventListener("click", () => {
      playClickFx($("btnExit"), 160);
      showToast(t("exit"));
    });
    document.querySelectorAll("#SpxHeaderBar .ghost-btn").forEach((el) => {
      el.addEventListener("click", () => playClickFx(el, 160), true);
    });

    window.addEventListener("resize", () => {
      layoutStageOverlays();
      if (popupHost.activeKey) popupHost.open(popupHost.activeKey, popupHost.triggerEl);
    });

    // F11 全屏极简（与 RealTimeDetectionV3 快捷键一致）
    window.addEventListener("keydown", (e) => {
      if (e.key === "F11") {
        e.preventDefault();
        setMinimalMode(!state.minimalMode);
      }
    });

    tickClock();
    setInterval(tickClock, 1000);
    buildViewToggleBar();
    seedDetectionResults();
    bindFabricCoordHud();
    applyI18n();
    applyViewFlags();
    layoutStageOverlays();
    requestAnimationFrame(() => layoutStageOverlays());
    updateFpsHud();
    setInterval(tickPreviewFps, 800);
    renderMetrics();
    renderDefects();
    initLogPlayback();
    setInterval(playbackTick, 100);
    setInterval(demoTick, 400);
  </script>
</body>
</html>
